name: Build TestZone Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag. Leave empty to use the commit SHA."
        required: false
        type: string
      dispatch_deploy:
        description: "Notify the deploy repository after publishing."
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/buddystudy-testzone
  DEPLOY_REPO: ghkdqhrbals/personal-deploy

jobs:
  build:
    name: Validate, Build, and Publish TestZone
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TestZone service and dashboard
        run: |
          set -euo pipefail
          (cd monitoring/testzone-service && npm test)
          (cd monitoring/api-dashboard && npm test)
          node --check monitoring/testzone-service/src/server.mjs
          node --check monitoring/api-dashboard/public/testzone.js
          node --check monitoring/api-dashboard/public/testzone-model.js

      - name: Resolve image tag
        id: resolve
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_SHA}"
          fi
          image_ref="${IMAGE_NAME}:${tag}"
          echo "image_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TestZone image
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring/testzone-service
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify TestZone Deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.dispatch_deploy == true }}

    steps:
      - name: Dispatch personal-deploy
        env:
          DEPLOY_REPO_DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_REPO_DISPATCH_TOKEN}" ]; then
            echo "Missing DEPLOY_REPO_DISPATCH_TOKEN secret." >&2
            exit 1
          fi
          payload="$(jq -n \
            --arg image "${IMAGE_REF}" \
            --arg sha "${GITHUB_SHA}" \
            '{
              event_type: "testzone-image-published",
              client_payload: {
                image: $image,
                sha: $sha
              }
            }')"
          status="$(curl -sS -o /tmp/testzone-dispatch-response -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_REPO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOY_REPO}/dispatches" \
            -d "${payload}")"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            cat /tmp/testzone-dispatch-response >&2
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## TestZone Image"
            echo ""
            echo "- Image: \`${{ needs.build.outputs.image_ref }}\`"
            echo "- Deploy event: \`testzone-image-published\`"
          } >> "${GITHUB_STEP_SUMMARY}"
