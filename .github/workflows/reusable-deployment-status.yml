name: Dispatch Deployment Status

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      phase:
        required: true
        type: string
      status:
        required: true
        type: string
      environment:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_build_number:
        required: true
        type: string
      deployment_targets:
        required: true
        type: string
      upload_enabled:
        required: true
        type: string
      build_result:
        required: false
        default: pending
        type: string
      upload_result:
        required: false
        default: pending
        type: string
      detail:
        required: false
        default: ""
        type: string
    secrets:
      deploy_repo_dispatch_token:
        required: true

permissions:
  contents: read

jobs:
  dispatch_deployment_status:
    name: Dispatch ${{ inputs.module }} ${{ inputs.phase }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment status
        env:
          DEPLOY_REPO_DISPATCH_TOKEN: ${{ secrets.deploy_repo_dispatch_token }}
          DEPLOY_REPO: ghkdqhrbals/personal-deploy
          MODULE: ${{ inputs.module }}
          PHASE: ${{ inputs.phase }}
          DEPLOY_STATUS: ${{ inputs.status }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.release_build_number }}
          DEPLOYMENT_TARGETS: ${{ inputs.deployment_targets }}
          UPLOAD_ENABLED: ${{ inputs.upload_enabled }}
          BUILD_RESULT: ${{ inputs.build_result }}
          UPLOAD_RESULT: ${{ inputs.upload_result }}
          DETAIL: ${{ inputs.detail }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_REPO_DISPATCH_TOKEN}" ]; then
            echo "Missing DEPLOY_REPO_DISPATCH_TOKEN secret." >&2
            exit 1
          fi

          case "${PHASE}" in
            planned|in_progress|completed) ;;
            *)
              echo "Unsupported deployment phase: ${PHASE}" >&2
              exit 1
              ;;
          esac

          payload="$(
            jq -n \
              --arg module "${MODULE}" \
              --arg phase "${PHASE}" \
              --arg status "${DEPLOY_STATUS}" \
              --arg environment "${DEPLOY_ENVIRONMENT}" \
              --arg version "${RELEASE_VERSION}" \
              --arg build "${RELEASE_BUILD_NUMBER}" \
              --arg targets "${DEPLOYMENT_TARGETS}" \
              --arg upload_enabled "${UPLOAD_ENABLED}" \
              --arg build_result "${BUILD_RESULT}" \
              --arg upload_result "${UPLOAD_RESULT}" \
              --arg detail "${DETAIL}" \
              --arg source_repo "${GITHUB_REPOSITORY}" \
              --arg source_sha "${GITHUB_SHA}" \
              --arg source_ref "${GITHUB_REF_NAME}" \
              --arg source_run_id "${GITHUB_RUN_ID}" \
              --arg source_run_attempt "${GITHUB_RUN_ATTEMPT}" \
              '{
                event_type: "deployment-status-updated",
                client_payload: {
                  module: $module,
                  phase: $phase,
                  status: $status,
                  environment: $environment,
                  targets: $targets,
                  detail: $detail,
                  release: {
                    version: $version,
                    build: $build,
                    upload_enabled: $upload_enabled
                  },
                  results: {
                    build: $build_result,
                    upload: $upload_result
                  },
                  source: {
                    repo: $source_repo,
                    sha: $source_sha,
                    ref: $source_ref,
                    run_id: $source_run_id,
                    run_attempt: $source_run_attempt
                  }
                }
              }'
          )"

          response_file="$(mktemp)"
          status_code="$(
            curl -sS \
              --retry 3 \
              --retry-all-errors \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${DEPLOY_REPO_DISPATCH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${DEPLOY_REPO}/dispatches" \
              --data "${payload}"
          )"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Deployment status dispatch failed with HTTP ${status_code}." >&2
            cat "${response_file}" >&2
            exit 1
          fi

          echo "Dispatched ${MODULE} deployment phase: ${PHASE}"
