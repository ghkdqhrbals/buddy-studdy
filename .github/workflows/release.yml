name: Release iOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.1.0. Leave empty to use the iOS project version."
        required: false
        type: string
      upload_to_app_store_connect:
        description: "Upload the exported IPA to App Store Connect for TestFlight."
        required: true
        default: true
        type: boolean
      app_review_candidate:
        description: "Label this TestFlight upload as the App Review resubmission candidate."
        required: true
        default: true
        type: boolean
      admob_test_mode:
        description: "Use Google's demo AdMob IDs and distribute the build to internal testers only."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan_ios_release:
    name: Plan iOS Release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      release_build_number: ${{ steps.release.outputs.release_build_number }}
      upload_enabled: ${{ steps.release.outputs.upload_enabled }}
      review_candidate: ${{ steps.release.outputs.review_candidate }}
      admob_test_mode: ${{ steps.release.outputs.admob_test_mode }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      deployment_targets: ${{ steps.release.outputs.deployment_targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release plan
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_UPLOAD_ENABLED: ${{ inputs.upload_to_app_store_connect }}
          INPUT_REVIEW_CANDIDATE: ${{ inputs.app_review_candidate }}
          INPUT_ADMOB_TEST_MODE: ${{ inputs.admob_test_mode }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="$(
              sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);/\1/p' \
                StudyMate.xcodeproj/project.pbxproj |
                tail -n 1
            )"
          fi

          if ! [[ "${version}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          upload_enabled="${INPUT_UPLOAD_ENABLED:-true}"
          case "${upload_enabled}" in
            true|false) ;;
            *)
              echo "Invalid App Store Connect upload setting: ${upload_enabled}" >&2
              exit 1
              ;;
          esac

          review_candidate="${INPUT_REVIEW_CANDIDATE:-false}"
          case "${review_candidate}" in
            true|false) ;;
            *)
              echo "Invalid App Review candidate setting: ${review_candidate}" >&2
              exit 1
              ;;
          esac
          if [ "${review_candidate}" = "true" ] && [ "${upload_enabled}" != "true" ]; then
            echo "App Review candidate releases must be uploaded to App Store Connect." >&2
            exit 1
          fi

          admob_test_mode="${INPUT_ADMOB_TEST_MODE:-false}"
          case "${admob_test_mode}" in
            true|false) ;;
            *)
              echo "Invalid AdMob test-mode setting: ${admob_test_mode}" >&2
              exit 1
              ;;
          esac
          if [ "${admob_test_mode}" = "true" ] && [ "${upload_enabled}" != "true" ]; then
            echo "AdMob test builds must be uploaded to TestFlight." >&2
            exit 1
          fi

          build_number="${GITHUB_RUN_NUMBER}"
          artifact_name="BuddyStudy-iOS-${version}-${build_number}"
          if [ "${admob_test_mode}" = "true" ]; then
            artifact_name="${artifact_name}-AdMobTest"
          fi
          deployment_targets="iOS 서명 IPA"
          if [ "${upload_enabled}" = "true" ]; then
            deployment_targets="${deployment_targets}, TestFlight"
          fi
          if [ "${admob_test_mode}" = "true" ]; then
            deployment_targets="${deployment_targets}, 내부 AdMob 테스트 그룹"
          fi
          if [ "${review_candidate}" = "true" ]; then
            deployment_targets="${deployment_targets}, App Review 재심사 후보"
          fi

          {
            echo "release_version=${version}"
            echo "release_build_number=${build_number}"
            echo "upload_enabled=${upload_enabled}"
            echo "review_candidate=${review_candidate}"
            echo "admob_test_mode=${admob_test_mode}"
            echo "artifact_name=${artifact_name}"
            echo "deployment_targets=${deployment_targets}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## iOS Release Plan"
            echo ""
            echo "- Version: \`${version}\`"
            echo "- Build: \`${build_number}\`"
            echo "- Targets: ${deployment_targets}"
            echo "- App Review candidate: \`${review_candidate}\`"
            echo "- AdMob test mode: \`${admob_test_mode}\`"
            echo "- Backend: \`https://api.ghkdqhrbals.org\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate TestFlight review-candidate notes
        if: ${{ steps.release.outputs.review_candidate == 'true' }}
        run: TESTFLIGHT_BUILD_NOTES_VALIDATE_ONLY=1 ruby scripts/update-testflight-build-notes.rb

  notify_ios_planned:
    name: Notify iOS Release Planned
    needs: plan_ios_release
    uses: ./.github/workflows/reusable-deployment-status.yml
    with:
      module: ios
      phase: planned
      status: planned
      environment: production
      release_version: ${{ needs.plan_ios_release.outputs.release_version }}
      release_build_number: ${{ needs.plan_ios_release.outputs.release_build_number }}
      deployment_targets: ${{ needs.plan_ios_release.outputs.deployment_targets }}
      upload_enabled: ${{ needs.plan_ios_release.outputs.upload_enabled }}
      detail: "빌드 검증 → 서명 아카이브 → IPA 생성 → TestFlight 업로드 순서로 진행합니다."
    secrets:
      deploy_repo_dispatch_token: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}

  build_ios_ipa:
    name: Build Signed iOS IPA
    runs-on: macos-26
    timeout-minutes: 60
    needs:
      - plan_ios_release
      - notify_ios_planned
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      REVENUECAT_PUBLIC_SDK_KEY: ${{ secrets.REVENUECAT_PUBLIC_SDK_KEY }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_NATIVE_AD_UNIT_ID: ${{ vars.ADMOB_NATIVE_AD_UNIT_ID }}
      ADMOB_TEST_MODE: ${{ needs.plan_ios_release.outputs.admob_test_mode }}
      BUDDYSTUDY_ADMOB_TEST_BUILD: >-
        ${{ needs.plan_ios_release.outputs.admob_test_mode == 'true' && 'YES' || 'NO' }}
      RELEASE_VERSION: ${{ needs.plan_ios_release.outputs.release_version }}
      RELEASE_BUILD_NUMBER: ${{ needs.plan_ios_release.outputs.release_build_number }}
      APP_REVIEW_CANDIDATE: ${{ needs.plan_ios_release.outputs.review_candidate }}
      PRODUCTION_BACKEND_BASE_URL: https://api.ghkdqhrbals.org
      ARTIFACT_NAME: ${{ needs.plan_ios_release.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require AdMob-compatible Xcode
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          ruby -e '
            require "rubygems"
            actual = Gem::Version.new(ARGV.fetch(0))
            required = Gem::Version.new("26.2")
            abort "Xcode #{required} or newer is required for Google Mobile Ads 13.8.0; found #{actual}." if actual < required
          ' "${xcode_version}"

      - name: Validate pinned AdMob source configuration
        run: |
          set -euo pipefail

          grep -Fq 'version = 13.8.0;' StudyMate.xcodeproj/project.pbxproj
          ruby -rjson -e '
            pins = JSON.parse(File.read(ARGV.fetch(0))).fetch("pins")
            mobile_ads = pins.find { |pin| pin.fetch("identity") == "swift-package-manager-google-mobile-ads" }
            abort "Google Mobile Ads package must be pinned exactly to 13.8.0." unless mobile_ads&.dig("state", "version") == "13.8.0"
          ' StudyMate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          /usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' StudyMate/iOSInfo.plist >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :BuddyStudyAdMobNativeAdUnitID' StudyMate/iOSInfo.plist >/dev/null
          skad_count="$(/usr/libexec/PlistBuddy -c 'Print :SKAdNetworkItems' StudyMate/iOSInfo.plist | grep -c 'SKAdNetworkIdentifier')"
          if [ "${skad_count}" -lt 50 ]; then
            echo "The complete Google SKAdNetworkItems list is required; found ${skad_count}." >&2
            exit 1
          fi
          if grep -R -E -q 'NSUserTrackingUsageDescription|ATTrackingManager|AppTrackingTransparency' StudyMate StudyMate.xcodeproj/project.pbxproj; then
            echo "ATT framework, prompt, and NSUserTrackingUsageDescription are forbidden." >&2
            exit 1
          fi
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' StudyMate/Resources/PrivacyInfo.xcprivacy)" != "false" ]; then
            echo "NSPrivacyTracking must remain false." >&2
            exit 1
          fi

      - name: Resolve guarded AdMob identifiers
        run: |
          set -euo pipefail

          case "${ADMOB_TEST_MODE}" in
            true)
              # Use Google's image Native demo creative. The separate Native Video
              # demo unit (ending in /2521693316) is intentionally not supported.
              {
                echo "ADMOB_APP_ID=ca-app-pub-3940256099942544~1458002511"
                echo "ADMOB_NATIVE_AD_UNIT_ID=ca-app-pub-3940256099942544/3986624511"
              } >> "${GITHUB_ENV}"
              ;;
            false) ;;
            *)
              echo "Invalid AdMob test-mode setting: ${ADMOB_TEST_MODE}" >&2
              exit 1
              ;;
          esac

      - name: Validate release secrets and AdMob mode
        run: |
          set -euo pipefail

          missing=0
          for name in \
            APPLE_TEAM_ID \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 \
            GOOGLE_SERVICE_INFO_PLIST_BASE64 \
            REVENUECAT_PUBLIC_SDK_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          if [[ "${REVENUECAT_PUBLIC_SDK_KEY}" != appl_* ]]; then
            echo "REVENUECAT_PUBLIC_SDK_KEY must be the iOS App Store public key (appl_), not a Test Store key." >&2
            exit 1
          fi

          if ! [[ "${ADMOB_APP_ID}" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]; then
            echo "Repository variable ADMOB_APP_ID must contain a production AdMob iOS app ID." >&2
            exit 1
          fi
          if ! [[ "${ADMOB_NATIVE_AD_UNIT_ID}" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
            echo "ADMOB_NATIVE_AD_UNIT_ID must contain a valid native ad unit ID." >&2
            exit 1
          fi

          case "${ADMOB_TEST_MODE}" in
            true)
              if [ "${ADMOB_APP_ID}" != "ca-app-pub-3940256099942544~1458002511" ] \
                || [ "${ADMOB_NATIVE_AD_UNIT_ID}" != "ca-app-pub-3940256099942544/3986624511" ]; then
                echo "AdMob test builds must use Google's iOS demo app ID and image Native demo unit ID." >&2
                exit 1
              fi
              ;;
            false)
              if [[ "${ADMOB_APP_ID}" == ca-app-pub-3940256099942544~* ]] \
                || [[ "${ADMOB_NATIVE_AD_UNIT_ID}" == ca-app-pub-3940256099942544/* ]]; then
                echo "Google demo AdMob identifiers are forbidden in production Release archives." >&2
                exit 1
              fi

              admob_app_publisher="${ADMOB_APP_ID%%~*}"
              admob_unit_publisher="${ADMOB_NATIVE_AD_UNIT_ID%%/*}"
              if [ "${admob_app_publisher}" != "${admob_unit_publisher}" ]; then
                echo "The AdMob app and Native unit must belong to the same publisher." >&2
                exit 1
              fi

              admob_publisher_digits="${admob_app_publisher#ca-app-pub-}"
              if ! grep -Fxq \
                "google.com, pub-${admob_publisher_digits}, DIRECT, f08c47fec0942fa0" \
                docs/app-ads.txt; then
                echo "docs/app-ads.txt must match the publisher used by the Release AdMob identifiers." >&2
                exit 1
              fi
              ;;
            *)
              echo "Invalid AdMob test-mode setting: ${ADMOB_TEST_MODE}" >&2
              exit 1
              ;;
          esac

      - name: Install Firebase iOS configuration
        run: |
          set -euo pipefail

          config_path="StudyMate/GoogleService-Info.plist"
          echo "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" | base64 --decode > "${config_path}"
          plutil -lint "${config_path}"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "${config_path}")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "${config_path}")"
          api_key="$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' "${config_path}")"
          project_id="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "${config_path}")"

          if [ "${bundle_id}" != "io.github.ghkdqhrbals.StudyMate" ]; then
            echo "Firebase configuration has an unexpected bundle identifier." >&2
            exit 1
          fi
          if [[ "${app_id}" != 1:* ]] \
            || [ -z "${api_key}" ] \
            || [ "${api_key}" = "NOT_CONFIGURED" ] \
            || [ -z "${project_id}" ] \
            || [ "${project_id}" = "NOT_CONFIGURED" ]; then
            echo "Firebase iOS configuration is incomplete." >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          private_key_path="${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" | base64 --decode > "${private_key_path}"
          chmod 600 "${private_key_path}"

          echo "APPSTORE_CONNECT_PRIVATE_KEY_PATH=${private_key_path}" >> "${GITHUB_ENV}"

      - name: Install iOS distribution signing assets
        run: |
          set -euo pipefail

          certificate_path="${RUNNER_TEMP}/ios-distribution.p12"
          profile_path="${RUNNER_TEMP}/ios-app-store.mobileprovision"
          profile_plist_path="${RUNNER_TEMP}/ios-app-store-profile.plist"
          keychain_path="${RUNNER_TEMP}/ios-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          echo "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          echo "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${profile_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          security cms -D -i "${profile_path}" > "${profile_plist_path}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist_path}")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${profile_plist_path}")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${profile_plist_path}")"
          profile_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${profile_plist_path}")"

          if [ "${profile_team_id}" != "${APPLE_TEAM_ID}" ]; then
            echo "Provisioning profile team does not match APPLE_TEAM_ID." >&2
            exit 1
          fi

          if [ "${profile_app_identifier}" != "${APPLE_TEAM_ID}.io.github.ghkdqhrbals.StudyMate" ]; then
            echo "Provisioning profile does not match the iOS app bundle identifier." >&2
            exit 1
          fi

          python3 - "${profile_plist_path}" <<'PY'
          import plistlib
          import sys

          profile_path = sys.argv[1]
          with open(profile_path, "rb") as profile_file:
              profile = plistlib.load(profile_file)

          domains = profile.get("Entitlements", {}).get(
              "com.apple.developer.associated-domains",
              [],
          )
          if isinstance(domains, str):
              domains = [domains]

          expected = "applinks:api.ghkdqhrbals.org"
          if "*" not in domains and expected not in domains:
              raise SystemExit(
                  "Provisioning profile must include the BuddyStudy referral Associated Domain."
              )
          PY

          mkdir -p \
            "${HOME}/Library/MobileDevice/Provisioning Profiles" \
            "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          cp "${profile_path}" "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles/${profile_uuid}.mobileprovision"

          security find-identity -v -p codesigning "${keychain_path}"
          echo "IOS_PROVISIONING_PROFILE_NAME=${profile_name}" >> "${GITHUB_ENV}"

      - name: Build iOS debug target
        run: |
          xcodebuild -project StudyMate.xcodeproj \
            -scheme StudyMateiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iOSDeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iOS app
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project StudyMate.xcodeproj \
            -scheme StudyMateiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iOSReleaseDerivedData \
            -archivePath build/StudyMateiOS.xcarchive \
            IOS_PROVISIONING_PROFILE_NAME="${IOS_PROVISIONING_PROFILE_NAME}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            REVENUECAT_PUBLIC_SDK_KEY="${REVENUECAT_PUBLIC_SDK_KEY}" \
            ADMOB_APP_ID="${ADMOB_APP_ID}" \
            ADMOB_NATIVE_AD_UNIT_ID="${ADMOB_NATIVE_AD_UNIT_ID}" \
            BUDDYSTUDY_ADMOB_TEST_BUILD="${BUDDYSTUDY_ADMOB_TEST_BUILD}" \
            BUDDYSTUDY_BACKEND_BASE_URL="${PRODUCTION_BACKEND_BASE_URL}" \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${RELEASE_BUILD_NUMBER}"

      - name: Verify archive release configuration and entitlements
        run: |
          set -euo pipefail

          app_path="build/StudyMateiOS.xcarchive/Products/Applications/StudyMate.app"
          test -d "${app_path}"

          backend_base_url="$(/usr/libexec/PlistBuddy -c 'Print :BuddyStudyBackendBaseURL' "${app_path}/Info.plist")"
          if [ "${backend_base_url}" != "${PRODUCTION_BACKEND_BASE_URL}" ]; then
            echo "Archive backend URL must be ${PRODUCTION_BACKEND_BASE_URL}; found ${backend_base_url:-<missing>}." >&2
            exit 1
          fi

          admob_app_id="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "${app_path}/Info.plist")"
          admob_native_ad_unit_id="$(/usr/libexec/PlistBuddy -c 'Print :BuddyStudyAdMobNativeAdUnitID' "${app_path}/Info.plist")"
          if [ "${admob_app_id}" != "${ADMOB_APP_ID}" ] || [ "${admob_native_ad_unit_id}" != "${ADMOB_NATIVE_AD_UNIT_ID}" ]; then
            echo "Archive AdMob identifiers do not match the release variables." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign --display --entitlements - --xml "${app_path}" > "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          plutil -lint "${RUNNER_TEMP}/ios-archive-entitlements.plist"

          grep -q "aps-environment" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "iCloud.io.github.ghkdqhrbals.StudyMate" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "com.apple.developer.icloud-services" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "com.apple.developer.applesignin" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          if ! plutil -convert json -o - "${RUNNER_TEMP}/ios-archive-entitlements.plist" |
            jq -e --arg expected "applinks:api.ghkdqhrbals.org" '
              .["com.apple.developer.associated-domains"] as $domains
              | ($domains | type) == "array" and ($domains | index($expected)) != null
            ' >/dev/null; then
            echo "Signed archive must include the exact BuddyStudy referral Associated Domain." >&2
            exit 1
          fi

      - name: Export signed IPA
        run: |
          set -euo pipefail

          mkdir -p build dist
          internal_testing_only_plist=""
          if [ "${ADMOB_TEST_MODE}" = "true" ] && [ "${APP_REVIEW_CANDIDATE}" = "false" ]; then
            internal_testing_only_plist="
            <key>testFlightInternalTestingOnly</key>
            <true/>"
          fi
          cat > build/export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.ghkdqhrbals.StudyMate</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>iCloudContainerEnvironment</key>
            <string>Production</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          ${internal_testing_only_plist}
          </dict>
          </plist>
          PLIST

          plutil -lint build/export-options.plist
          if [ "${ADMOB_TEST_MODE}" = "true" ] && [ "${APP_REVIEW_CANDIDATE}" = "false" ]; then
            if [ "$(/usr/libexec/PlistBuddy -c 'Print :testFlightInternalTestingOnly' build/export-options.plist)" != "true" ]; then
              echo "AdMob test exports must be permanently restricted to internal TestFlight." >&2
              exit 1
            fi
          elif /usr/libexec/PlistBuddy -c 'Print :testFlightInternalTestingOnly' build/export-options.plist >/dev/null 2>&1; then
            echo "Production exports must not carry the internal-testing-only restriction." >&2
            exit 1
          fi

          xcodebuild -exportArchive \
            -archivePath build/StudyMateiOS.xcarchive \
            -exportPath dist \
            -exportOptionsPlist build/export-options.plist

          ipa_path="$(find dist -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "IPA export failed." >&2
            exit 1
          fi

          echo "IPA_PATH=${ipa_path}" >> "${GITHUB_ENV}"

      - name: Verify exported IPA release configuration and entitlements
        run: |
          set -euo pipefail

          mkdir -p build/ipa-check
          unzip -q "${IPA_PATH}" -d build/ipa-check

          app_path="$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "Exported IPA does not contain an app bundle." >&2
            exit 1
          fi

          backend_base_url="$(/usr/libexec/PlistBuddy -c 'Print :BuddyStudyBackendBaseURL' "${app_path}/Info.plist")"
          if [ "${backend_base_url}" != "${PRODUCTION_BACKEND_BASE_URL}" ]; then
            echo "Exported IPA backend URL must be ${PRODUCTION_BACKEND_BASE_URL}; found ${backend_base_url:-<missing>}." >&2
            exit 1
          fi

          admob_app_id="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "${app_path}/Info.plist")"
          admob_native_ad_unit_id="$(/usr/libexec/PlistBuddy -c 'Print :BuddyStudyAdMobNativeAdUnitID' "${app_path}/Info.plist")"
          if [ "${admob_app_id}" != "${ADMOB_APP_ID}" ] || [ "${admob_native_ad_unit_id}" != "${ADMOB_NATIVE_AD_UNIT_ID}" ]; then
            echo "Exported IPA AdMob identifiers do not match the release variables." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign --display --entitlements - --xml "${app_path}" > "${RUNNER_TEMP}/ios-export-entitlements.plist"
          plutil -lint "${RUNNER_TEMP}/ios-export-entitlements.plist"

          grep -q "aps-environment" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "production" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "iCloud.io.github.ghkdqhrbals.StudyMate" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "com.apple.developer.icloud-services" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          if ! plutil -convert json -o - "${RUNNER_TEMP}/ios-export-entitlements.plist" |
            jq -e --arg expected "applinks:api.ghkdqhrbals.org" '
              .["com.apple.developer.associated-domains"] as $domains
              | ($domains | type) == "array" and ($domains | index($expected)) != null
            ' >/dev/null; then
            echo "Exported IPA must include the exact BuddyStudy referral Associated Domain." >&2
            exit 1
          fi

      - name: Write release metadata
        run: |
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg build "${RELEASE_BUILD_NUMBER}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg backend_base_url "${PRODUCTION_BACKEND_BASE_URL}" \
            --argjson app_review_candidate "${APP_REVIEW_CANDIDATE}" \
            --argjson admob_test_mode "${ADMOB_TEST_MODE}" \
            '{
              version: $version,
              build: $build,
              sourceSha: $source_sha,
              runId: $run_id,
              backendBaseURL: $backend_base_url,
              appReviewCandidate: $app_review_candidate,
              admobTestMode: $admob_test_mode
            }' > dist/release-metadata.json

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.ipa
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 14

  upload_testflight:
    name: Upload iOS IPA to TestFlight
    runs-on: macos-26
    timeout-minutes: 30
    needs:
      - plan_ios_release
      - build_ios_ipa
    if: ${{ needs.plan_ios_release.outputs.upload_enabled == 'true' }}
    env:
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      RELEASE_VERSION: ${{ needs.plan_ios_release.outputs.release_version }}
      RELEASE_BUILD_NUMBER: ${{ needs.plan_ios_release.outputs.release_build_number }}
      APP_REVIEW_CANDIDATE: ${{ needs.plan_ios_release.outputs.review_candidate }}
      ADMOB_TEST_MODE: ${{ needs.plan_ios_release.outputs.admob_test_mode }}
      PRODUCTION_BACKEND_BASE_URL: https://api.ghkdqhrbals.org
      ARTIFACT_NAME: ${{ needs.plan_ios_release.outputs.artifact_name }}

    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          for name in \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

          private_keys_dir="${RUNNER_TEMP}/app-store-connect-private-keys"
          mkdir -p "${private_keys_dir}"
          private_key_path="${private_keys_dir}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" |
            base64 --decode > "${private_key_path}"
          chmod 600 "${private_key_path}"
          echo "API_PRIVATE_KEYS_DIR=${private_keys_dir}" >> "${GITHUB_ENV}"

      - name: Upload to App Store Connect for TestFlight
        run: |
          set -euo pipefail

          ipa_path="$(find release-artifact -name '*.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "Downloaded artifact does not contain an IPA." >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --file "${ipa_path}" \
            --type ios \
            --apiKey "${APPSTORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APPSTORE_CONNECT_ISSUER_ID}"

          {
            echo "## TestFlight Upload"
            echo ""
            echo "- IPA: \`$(basename "${ipa_path}")\`"
            echo "- Version/build: \`${RELEASE_VERSION} (${RELEASE_BUILD_NUMBER})\`"
            echo "- App Review resubmission candidate: \`${APP_REVIEW_CANDIDATE}\`"
            echo "- AdMob test mode: \`${ADMOB_TEST_MODE}\`"
            echo "- Backend: \`${PRODUCTION_BACKEND_BASE_URL}\`"
            echo "- Result: App Store Connect accepted the upload."
            if [ "${APP_REVIEW_CANDIDATE}" = "true" ]; then
              echo "- Next: The review-note job will wait for processing and label this exact build."
            else
              echo "- Next: Apple processing continues asynchronously."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/app-store-connect-private-keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"

  distribute_admob_test_internal:
    name: Distribute AdMob Test Build Internally
    runs-on: macos-26
    timeout-minutes: 40
    needs:
      - plan_ios_release
      - upload_testflight
    if: ${{ needs.plan_ios_release.outputs.admob_test_mode == 'true' && needs.plan_ios_release.outputs.review_candidate == 'false' }}
    env:
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      APP_STORE_APP_ID: "6774108938"
      APP_BUNDLE_ID: io.github.ghkdqhrbals.StudyMate
      APP_STORE_VERSION_STRING: ${{ needs.plan_ios_release.outputs.release_version }}
      APP_STORE_BUILD_NUMBER: ${{ needs.plan_ios_release.outputs.release_build_number }}
      APP_STORE_APPLY: "1"
      TESTFLIGHT_INTERNAL_GROUP_ID: "5f6797bb-38a0-400b-8269-74aa6f5f3bec"
      TESTFLIGHT_EXPECTED_BUILD_AUDIENCE: INTERNAL_ONLY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          for name in \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

          private_key_path="${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" |
            base64 --decode > "${private_key_path}"
          chmod 600 "${private_key_path}"
          echo "APPSTORE_CONNECT_PRIVATE_KEY_PATH=${private_key_path}" >> "${GITHUB_ENV}"

      - name: Distribute exact test build to the internal group
        run: |
          set -euo pipefail

          ruby scripts/distribute-testflight-internal.rb

          {
            echo "## Internal AdMob Test Build"
            echo ""
            echo "- Version/build: \`${APP_STORE_VERSION_STRING} (${APP_STORE_BUILD_NUMBER})\`"
            echo "- AdMob IDs: Google iOS demo app and Native unit"
            echo "- Scope: internal TestFlight testers only"
            echo "- App Review selection: unchanged"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"

  sync_testflight_review_notes:
    name: Label TestFlight App Review Candidate
    runs-on: macos-26
    timeout-minutes: 40
    needs:
      - plan_ios_release
      - upload_testflight
    if: ${{ needs.plan_ios_release.outputs.review_candidate == 'true' }}
    env:
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      APP_STORE_VERSION_STRING: ${{ needs.plan_ios_release.outputs.release_version }}
      APP_STORE_BUILD_NUMBER: ${{ needs.plan_ios_release.outputs.release_build_number }}
      APP_STORE_SYNC_VERSION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          for name in \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

          private_key_path="${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" |
            base64 --decode > "${private_key_path}"
          chmod 600 "${private_key_path}"
          echo "APPSTORE_CONNECT_PRIVATE_KEY_PATH=${private_key_path}" >> "${GITHUB_ENV}"

      - name: Update and verify What to Test
        run: |
          set -euo pipefail

          APP_STORE_APPLY=1 ruby scripts/update-testflight-build-notes.rb

      - name: Select exact build for App Review
        run: |
          set -euo pipefail

          APP_STORE_APPLY=1 ruby scripts/select-app-store-build.rb

      - name: Summarize App Review candidate
        run: |
          set -euo pipefail

          {
            echo "## TestFlight App Review Candidate"
            echo ""
            echo "- Version/build: \`${APP_STORE_VERSION_STRING} (${APP_STORE_BUILD_NUMBER})\`"
            echo "- Backend: \`https://api.ghkdqhrbals.org\`"
            echo "- What to Test: en-US, ko, and ja updated and verified."
            echo "- App Store version mapping: exact build selected and verified."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
