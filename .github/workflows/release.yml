name: Release iOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.0.17. Leave empty to use the project version."
        required: false
        type: string
      upload_to_app_store_connect:
        description: "Upload the exported IPA to App Store Connect."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ios:
    name: Build and Upload iOS
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      INPUT_VERSION: ${{ inputs.version || '' }}
      UPLOAD_TO_APP_STORE_CONNECT: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_app_store_connect }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        run: |
          set -euo pipefail

          missing=0
          for name in \
            APPLE_TEAM_ID \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          PRIVATE_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" | base64 --decode > "${PRIVATE_KEY_PATH}"
          chmod 600 "${PRIVATE_KEY_PATH}"

          echo "APPSTORE_CONNECT_PRIVATE_KEY_PATH=${PRIVATE_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Install iOS distribution signing assets
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="${RUNNER_TEMP}/ios-distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/ios-app-store.mobileprovision"
          PROFILE_PLIST_PATH="${RUNNER_TEMP}/ios-app-store-profile.plist"
          KEYCHAIN_PATH="${RUNNER_TEMP}/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          echo "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST_PATH}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${PROFILE_PLIST_PATH}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${PROFILE_PLIST_PATH}")"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${PROFILE_PLIST_PATH}")"
          PROFILE_APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${PROFILE_PLIST_PATH}")"

          if [ "${PROFILE_TEAM_ID}" != "${APPLE_TEAM_ID}" ]; then
            echo "Provisioning profile team does not match APPLE_TEAM_ID." >&2
            exit 1
          fi

          if [ "${PROFILE_APP_IDENTIFIER}" != "${APPLE_TEAM_ID}.io.github.ghkdqhrbals.StudyMate" ]; then
            echo "Provisioning profile does not match the iOS app bundle identifier." >&2
            exit 1
          fi

          mkdir -p \
            "${HOME}/Library/MobileDevice/Provisioning Profiles" \
            "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          cp "${PROFILE_PATH}" "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          echo "IOS_PROVISIONING_PROFILE_NAME=${PROFILE_NAME}" >> "${GITHUB_ENV}"

      - name: Resolve release version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(
              xcodebuild -project StudyMate.xcodeproj \
                -scheme StudyMateiOS \
                -configuration Release \
                -showBuildSettings |
                awk -F '= ' '/MARKETING_VERSION/ { print $2; exit }'
            )"
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Build iOS debug target
        run: |
          xcodebuild -project StudyMate.xcodeproj \
            -scheme StudyMateiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iOSDeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iOS app
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project StudyMate.xcodeproj \
            -scheme StudyMateiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iOSReleaseDerivedData \
            -archivePath build/StudyMateiOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${IOS_PROVISIONING_PROFILE_NAME}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            POSTHOG_PROJECT_TOKEN="${POSTHOG_PROJECT_TOKEN}" \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${RELEASE_BUILD_NUMBER}"

      - name: Verify archive entitlements
        run: |
          set -euo pipefail

          APP_PATH="build/StudyMateiOS.xcarchive/Products/Applications/StudyMate.app"
          test -d "${APP_PATH}"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign -d --entitlements - "${APP_PATH}" > "${RUNNER_TEMP}/ios-archive-entitlements.plist"

          grep -q "aps-environment" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "iCloud.io.github.ghkdqhrbals.StudyMate" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "com.apple.developer.icloud-services" "${RUNNER_TEMP}/ios-archive-entitlements.plist"

      - name: Export IPA
        run: |
          set -euo pipefail

          mkdir -p build dist
          cat > build/export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.ghkdqhrbals.StudyMate</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>iCloudContainerEnvironment</key>
            <string>Production</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/StudyMateiOS.xcarchive \
            -exportPath dist \
            -exportOptionsPlist build/export-options.plist

          IPA_PATH="$(find dist -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "IPA export failed." >&2
            exit 1
          fi

          echo "IPA_PATH=${IPA_PATH}" >> "${GITHUB_ENV}"

      - name: Verify exported IPA entitlements
        run: |
          set -euo pipefail

          mkdir -p build/ipa-check
          unzip -q "${IPA_PATH}" -d build/ipa-check

          APP_PATH="$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "Exported IPA does not contain an app bundle." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign -d --entitlements - "${APP_PATH}" > "${RUNNER_TEMP}/ios-export-entitlements.plist"

          grep -q "aps-environment" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "production" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "iCloud.io.github.ghkdqhrbals.StudyMate" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "com.apple.developer.icloud-services" "${RUNNER_TEMP}/ios-export-entitlements.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddyStudy-iOS-${{ env.RELEASE_VERSION }}-${{ env.RELEASE_BUILD_NUMBER }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: env.UPLOAD_TO_APP_STORE_CONNECT == 'true'
        run: |
          set -euo pipefail

          cat > build/upload-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.ghkdqhrbals.StudyMate</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>iCloudContainerEnvironment</key>
            <string>Production</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/StudyMateiOS.xcarchive \
            -exportPath build/app-store-upload \
            -exportOptionsPlist build/upload-options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${APPSTORE_CONNECT_PRIVATE_KEY_PATH}" \
            -authenticationKeyID "${APPSTORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APPSTORE_CONNECT_ISSUER_ID}"
