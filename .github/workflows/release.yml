name: Release iOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.1.0. Leave empty to use the iOS project version."
        required: false
        type: string
      upload_to_app_store_connect:
        description: "Upload the exported IPA to App Store Connect for TestFlight."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan_ios_release:
    name: Plan iOS Release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      release_build_number: ${{ steps.release.outputs.release_build_number }}
      upload_enabled: ${{ steps.release.outputs.upload_enabled }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      deployment_targets: ${{ steps.release.outputs.deployment_targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release plan
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_UPLOAD_ENABLED: ${{ inputs.upload_to_app_store_connect }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="$(
              sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);/\1/p' \
                StudyMate.xcodeproj/project.pbxproj |
                tail -n 1
            )"
          fi

          if ! [[ "${version}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          upload_enabled="${INPUT_UPLOAD_ENABLED:-true}"
          case "${upload_enabled}" in
            true|false) ;;
            *)
              echo "Invalid App Store Connect upload setting: ${upload_enabled}" >&2
              exit 1
              ;;
          esac

          build_number="${GITHUB_RUN_NUMBER}"
          artifact_name="BuddyStudy-iOS-${version}-${build_number}"
          deployment_targets="iOS 서명 IPA"
          if [ "${upload_enabled}" = "true" ]; then
            deployment_targets="${deployment_targets}, TestFlight"
          fi

          {
            echo "release_version=${version}"
            echo "release_build_number=${build_number}"
            echo "upload_enabled=${upload_enabled}"
            echo "artifact_name=${artifact_name}"
            echo "deployment_targets=${deployment_targets}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## iOS Release Plan"
            echo ""
            echo "- Version: \`${version}\`"
            echo "- Build: \`${build_number}\`"
            echo "- Targets: ${deployment_targets}"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify_ios_planned:
    name: Notify iOS Release Planned
    needs: plan_ios_release
    uses: ./.github/workflows/reusable-deployment-status.yml
    with:
      module: ios
      phase: planned
      status: planned
      environment: production
      release_version: ${{ needs.plan_ios_release.outputs.release_version }}
      release_build_number: ${{ needs.plan_ios_release.outputs.release_build_number }}
      deployment_targets: ${{ needs.plan_ios_release.outputs.deployment_targets }}
      upload_enabled: ${{ needs.plan_ios_release.outputs.upload_enabled }}
      detail: "빌드 검증 → 서명 아카이브 → IPA 생성 → TestFlight 업로드 순서로 진행합니다."
    secrets:
      deploy_repo_dispatch_token: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}

  build_ios_ipa:
    name: Build Signed iOS IPA
    runs-on: macos-26
    timeout-minutes: 60
    needs:
      - plan_ios_release
      - notify_ios_planned
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      RELEASE_VERSION: ${{ needs.plan_ios_release.outputs.release_version }}
      RELEASE_BUILD_NUMBER: ${{ needs.plan_ios_release.outputs.release_build_number }}
      ARTIFACT_NAME: ${{ needs.plan_ios_release.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        run: |
          set -euo pipefail

          missing=0
          for name in \
            APPLE_TEAM_ID \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 \
            GOOGLE_SERVICE_INFO_PLIST_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Install Firebase Analytics configuration
        run: |
          set -euo pipefail

          config_path="StudyMate/GoogleService-Info.plist"
          echo "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" | base64 --decode > "${config_path}"
          plutil -lint "${config_path}"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "${config_path}")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "${config_path}")"
          api_key="$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' "${config_path}")"
          analytics_enabled="$(/usr/libexec/PlistBuddy -c 'Print :IS_ANALYTICS_ENABLED' "${config_path}")"
          analytics_enabled="$(printf '%s' "${analytics_enabled}" | tr '[:upper:]' '[:lower:]')"

          if [ "${bundle_id}" != "io.github.ghkdqhrbals.StudyMate" ]; then
            echo "Firebase configuration has an unexpected bundle identifier." >&2
            exit 1
          fi
          if [[ "${app_id}" != 1:* ]] || [ -z "${api_key}" ] || { [ "${analytics_enabled}" != "true" ] && [ "${analytics_enabled}" != "yes" ] && [ "${analytics_enabled}" != "1" ]; }; then
            echo "Firebase Analytics configuration is incomplete or disabled." >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          private_key_path="${RUNNER_TEMP}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" | base64 --decode > "${private_key_path}"
          chmod 600 "${private_key_path}"

          echo "APPSTORE_CONNECT_PRIVATE_KEY_PATH=${private_key_path}" >> "${GITHUB_ENV}"

      - name: Install iOS distribution signing assets
        run: |
          set -euo pipefail

          certificate_path="${RUNNER_TEMP}/ios-distribution.p12"
          profile_path="${RUNNER_TEMP}/ios-app-store.mobileprovision"
          profile_plist_path="${RUNNER_TEMP}/ios-app-store-profile.plist"
          keychain_path="${RUNNER_TEMP}/ios-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          echo "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          echo "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${profile_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          security cms -D -i "${profile_path}" > "${profile_plist_path}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist_path}")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${profile_plist_path}")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${profile_plist_path}")"
          profile_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${profile_plist_path}")"

          if [ "${profile_team_id}" != "${APPLE_TEAM_ID}" ]; then
            echo "Provisioning profile team does not match APPLE_TEAM_ID." >&2
            exit 1
          fi

          if [ "${profile_app_identifier}" != "${APPLE_TEAM_ID}.io.github.ghkdqhrbals.StudyMate" ]; then
            echo "Provisioning profile does not match the iOS app bundle identifier." >&2
            exit 1
          fi

          mkdir -p \
            "${HOME}/Library/MobileDevice/Provisioning Profiles" \
            "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          cp "${profile_path}" "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles/${profile_uuid}.mobileprovision"

          security find-identity -v -p codesigning "${keychain_path}"
          echo "IOS_PROVISIONING_PROFILE_NAME=${profile_name}" >> "${GITHUB_ENV}"

      - name: Build iOS debug target
        run: |
          xcodebuild -project StudyMate.xcodeproj \
            -scheme StudyMateiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iOSDeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iOS app
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project StudyMate.xcodeproj \
            -scheme StudyMateiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iOSReleaseDerivedData \
            -archivePath build/StudyMateiOS.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${APPSTORE_CONNECT_PRIVATE_KEY_PATH}" \
            -authenticationKeyID "${APPSTORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APPSTORE_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${RELEASE_BUILD_NUMBER}"

      - name: Verify archive entitlements
        run: |
          set -euo pipefail

          app_path="build/StudyMateiOS.xcarchive/Products/Applications/StudyMate.app"
          test -d "${app_path}"

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign -d --entitlements - "${app_path}" > "${RUNNER_TEMP}/ios-archive-entitlements.plist"

          grep -q "aps-environment" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "iCloud.io.github.ghkdqhrbals.StudyMate" "${RUNNER_TEMP}/ios-archive-entitlements.plist"
          grep -q "com.apple.developer.icloud-services" "${RUNNER_TEMP}/ios-archive-entitlements.plist"

      - name: Export signed IPA
        run: |
          set -euo pipefail

          mkdir -p build dist
          cat > build/export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.ghkdqhrbals.StudyMate</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>iCloudContainerEnvironment</key>
            <string>Production</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/StudyMateiOS.xcarchive \
            -exportPath dist \
            -exportOptionsPlist build/export-options.plist

          ipa_path="$(find dist -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "IPA export failed." >&2
            exit 1
          fi

          echo "IPA_PATH=${ipa_path}" >> "${GITHUB_ENV}"

      - name: Verify exported IPA entitlements
        run: |
          set -euo pipefail

          mkdir -p build/ipa-check
          unzip -q "${IPA_PATH}" -d build/ipa-check

          app_path="$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "Exported IPA does not contain an app bundle." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign -d --entitlements - "${app_path}" > "${RUNNER_TEMP}/ios-export-entitlements.plist"

          grep -q "aps-environment" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "production" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "iCloud.io.github.ghkdqhrbals.StudyMate" "${RUNNER_TEMP}/ios-export-entitlements.plist"
          grep -q "com.apple.developer.icloud-services" "${RUNNER_TEMP}/ios-export-entitlements.plist"

      - name: Write release metadata
        run: |
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg build "${RELEASE_BUILD_NUMBER}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{
              version: $version,
              build: $build,
              sourceSha: $source_sha,
              runId: $run_id
            }' > dist/release-metadata.json

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.ipa
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 14

  upload_testflight:
    name: Upload iOS IPA to TestFlight
    runs-on: macos-26
    timeout-minutes: 30
    needs:
      - plan_ios_release
      - build_ios_ipa
    if: ${{ needs.plan_ios_release.outputs.upload_enabled == 'true' }}
    env:
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      ARTIFACT_NAME: ${{ needs.plan_ios_release.outputs.artifact_name }}

    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          for name in \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

          private_keys_dir="${RUNNER_TEMP}/app-store-connect-private-keys"
          mkdir -p "${private_keys_dir}"
          echo "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64}" |
            base64 --decode > "${private_keys_dir}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          chmod 600 "${private_keys_dir}/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          echo "API_PRIVATE_KEYS_DIR=${private_keys_dir}" >> "${GITHUB_ENV}"

      - name: Upload to App Store Connect for TestFlight
        run: |
          set -euo pipefail

          ipa_path="$(find release-artifact -name '*.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "Downloaded artifact does not contain an IPA." >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --file "${ipa_path}" \
            --type ios \
            --apiKey "${APPSTORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APPSTORE_CONNECT_ISSUER_ID}"

          {
            echo "## TestFlight Upload"
            echo ""
            echo "- IPA: \`$(basename "${ipa_path}")\`"
            echo "- Result: App Store Connect accepted the upload."
            echo "- Next: Apple processing continues asynchronously."
          } >> "${GITHUB_STEP_SUMMARY}"
