name: Load-test static validation

on:
  pull_request:
    paths:
      - "backend/loadtest/**"
      - ".github/workflows/loadtest-static.yml"
  push:
    branches: [main]
    paths:
      - "backend/loadtest/**"
      - ".github/workflows/loadtest-static.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reusable load-test assets
        run: backend/loadtest/static-check.sh
