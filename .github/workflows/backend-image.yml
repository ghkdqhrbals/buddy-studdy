name: Build Backend Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag. Leave empty to use the commit SHA."
        required: false
        type: string
      dispatch_deploy:
        description: "Notify the deploy repository after pushing the image."
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/buddy-studdy-backend
  DEPLOY_REPO: ghkdqhrbals/personal-deploy

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=${IMAGE_NAME}:${TAG}" >> "${GITHUB_ENV}"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${IMAGE_NAME}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_NAME }}:latest

  notify:
    name: Notify Deploy Repo
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.dispatch_deploy == true }}

    steps:
      - name: Dispatch personal-deploy
        env:
          DEPLOY_REPO_DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          EVENT_TYPE: backend-image-published
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_REPO_DISPATCH_TOKEN}" ]; then
            echo "Missing DEPLOY_REPO_DISPATCH_TOKEN secret." >&2
            exit 1
          fi

          payload="$(jq -n \
            --arg image "${IMAGE_REF}" \
            --arg sha "${GITHUB_SHA}" \
            --arg image_tag "${IMAGE_TAG}" \
            --argjson deploy_enabled true \
            '{
              event_type: "backend-image-published",
              client_payload: {
                image: $image,
                sha: $sha,
                image_tag: $image_tag,
                deploy_enabled: $deploy_enabled
              }
            }')"

          echo "Dispatch target: ${DEPLOY_REPO}"
          echo "Dispatch event: ${EVENT_TYPE}"
          echo "Dispatch image: ${IMAGE_REF}"
          echo "Dispatch payload:"
          echo "${payload}" | jq .

          response_file="$(mktemp)"
          status="$(
            curl -sS \
              -o "${response_file}" \
              -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${DEPLOY_REPO_DISPATCH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${DEPLOY_REPO}/dispatches" \
              -d "${payload}"
          )"

          echo "Dispatch HTTP status: ${status}"
          if [ -s "${response_file}" ]; then
            echo "Dispatch response body:"
            cat "${response_file}"
          else
            echo "Dispatch response body: <empty>"
          fi

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Deploy Repo Notification"
            echo ""
            echo "- Target: \`${DEPLOY_REPO}\`"
            echo "- Event: \`backend-image-published\`"
            echo "- Image: \`${{ needs.build.outputs.image_ref }}\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
