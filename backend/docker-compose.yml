services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buddystuddy
      POSTGRES_USER: buddystuddy
      POSTGRES_PASSWORD: local-password
    volumes:
      - buddystuddy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddystuddy -d buddystuddy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    image: buddystuddy-backend:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://buddystuddy:local-password@db:5432/buddystuddy
    restart: unless-stopped

volumes:
  buddystuddy-postgres-data:
