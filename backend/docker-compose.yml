services:
  db:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: buddystudy
      MYSQL_USER: buddystudy
      MYSQL_PASSWORD: local-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - buddystudy-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    image: buddystudy-backend:local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://db:3306/buddystudy?serverTimezone=UTC
      DATABASE_USERNAME: buddystudy
      DATABASE_PASSWORD: local-password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_OPENAPI_DOCS: "true"
      OPENAPI_ACCESS_TOKEN: "local-openapi"
      GOOGLE_IOS_CLIENT_ID: 328281669925-evuebplih3vir99daj4lapj1javqsmsr.apps.googleusercontent.com
      REACTION_STREAM_ENABLED: "false"
      BUDDYSTUDY_TRANSLATION_BASE_URL: http://libretranslate:5000
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    user: root
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: en,ko
      LT_DISABLE_WEB_UI: "true"
      LT_WORKERS: "1"
    volumes:
      - buddystudy-libretranslate-data:/home/libretranslate/.local/share
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --save
      - "3600"
      - "1"
      - --save
      - "300"
      - "100"
      - --save
      - "60"
      - "10000"
      - --rdbcompression
      - "yes"
      - --rdbchecksum
      - "yes"
      - --dbfilename
      - dump.rdb
      - --dir
      - /data
    volumes:
      - buddystudy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  backup:
    image: mysql:8.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: buddystudy
      MYSQL_DATABASE: buddystudy
      MYSQL_PASSWORD: local-password
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - buddystudy-db-backups:/backups
    restart: unless-stopped
    command: >
      sh -c '
      mkdir -p /backups &&
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        mysqldump --single-transaction --quick --routines --triggers
          -h "$${MYSQL_HOST}" -u "$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" "$${MYSQL_DATABASE}"
          | gzip > /backups/buddystudy-$${ts}.sql.gz;
        find /backups -type f -name "buddystudy-*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS} -delete;
        sleep 86400;
      done'

volumes:
  buddystudy-mysql-data:
  buddystudy-db-backups:
  buddystudy-libretranslate-data:
  buddystudy-redis-data:
