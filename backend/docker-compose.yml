services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: buddystuddy
      POSTGRES_USER: buddystuddy
      POSTGRES_PASSWORD: local-password
    volumes:
      - buddystuddy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddystuddy -d buddystuddy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    image: buddystuddy-backend:local
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/buddystuddy
      DATABASE_USERNAME: buddystuddy
      DATABASE_PASSWORD: local-password
      ENABLE_OPENAPI_DOCS: "true"
      OPENAPI_ACCESS_TOKEN: "local-openapi"
      GOOGLE_IOS_CLIENT_ID: 328281669925-evuebplih3vir99daj4lapj1javqsmsr.apps.googleusercontent.com
      REACTION_STREAM_ENABLED: "false"
      BUDDYSTUDDY_TRANSLATION_BASE_URL: http://libretranslate:5000
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    user: root
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: en,ko
      LT_DISABLE_WEB_UI: "true"
      LT_WORKERS: "1"
    volumes:
      - buddystuddy-libretranslate-data:/home/libretranslate/.local/share
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: buddystuddy
      PGDATABASE: buddystuddy
      PGPASSWORD: local-password
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - buddystuddy-db-backups:/backups
    restart: unless-stopped
    command: >
      sh -c '
      mkdir -p /backups &&
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        pg_dump -Fc -h "$${PGHOST}" -U "$${PGUSER}" -d "$${PGDATABASE}" > /backups/buddystuddy-$${ts}.dump;
        find /backups -type f -name "buddystuddy-*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete;
        sleep 86400;
      done'

volumes:
  buddystuddy-postgres-data:
  buddystuddy-db-backups:
  buddystuddy-libretranslate-data:
