services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: buddystudy
      POSTGRES_USER: buddystudy
      POSTGRES_PASSWORD: local-password
    volumes:
      - buddystudy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddystudy -d buddystudy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    image: buddystudy-backend:local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/buddystudy
      DATABASE_USERNAME: buddystudy
      DATABASE_PASSWORD: local-password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_OPENAPI_DOCS: "true"
      OPENAPI_ACCESS_TOKEN: "local-openapi"
      GOOGLE_IOS_CLIENT_ID: 328281669925-evuebplih3vir99daj4lapj1javqsmsr.apps.googleusercontent.com
      REACTION_STREAM_ENABLED: "false"
      BUDDYSTUDY_TRANSLATION_BASE_URL: http://libretranslate:5000
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    user: root
    ports:
      - "5001:5000"
    environment:
      LT_LOAD_ONLY: en,ko
      LT_DISABLE_WEB_UI: "true"
      LT_WORKERS: "1"
    volumes:
      - buddystudy-libretranslate-data:/home/libretranslate/.local/share
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buddystudy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: buddystudy
      PGDATABASE: buddystudy
      PGPASSWORD: local-password
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - buddystudy-db-backups:/backups
    restart: unless-stopped
    command: >
      sh -c '
      mkdir -p /backups &&
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        pg_dump -Fc -h "$${PGHOST}" -U "$${PGUSER}" -d "$${PGDATABASE}" > /backups/buddystudy-$${ts}.dump;
        find /backups -type f -name "buddystudy-*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete;
        sleep 86400;
      done'

volumes:
  buddystudy-postgres-data:
  buddystudy-db-backups:
  buddystudy-libretranslate-data:
  buddystudy-redis-data:
