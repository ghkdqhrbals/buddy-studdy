spring:
  config:
    activate:
      on-profile: dev
    import: optional:aws-secretsmanager:${AWS_SECRET_ID:buddystuddy/dev}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      secretsmanager:
        enabled: true
        region: ${AWS_REGION:ap-northeast-2}

buddystuddy:
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
  streams:
    enabled: ${REACTION_STREAM_ENABLED:false}
  openapi:
    enabled: ${ENABLE_OPENAPI_DOCS:true}
    access-token: ${OPENAPI_ACCESS_TOKEN:dev-openapi}
