spring:
  config:
    activate:
      on-profile: dev
    import: optional:aws-secretsmanager:${AWS_SECRET_ID:buddystuddy/dev}
  autoconfigure:
    exclude:
      - com.redisstream.RedisStreamCoordinatorAutoConfiguration
      - com.redisstream.producer.ProducerRoutingAutoConfiguration
      - com.redisstream.consumer.CoordinatorConsumerAutoConfiguration
  flyway:
    enabled: false
  cloud:
    aws:
      region:
        static: ap-northeast-2
      secretsmanager:
        enabled: true
        region: ap-northeast-2

buddystuddy:
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
  streams:
    enabled: ${REACTION_STREAM_ENABLED:false}
  openapi:
    enabled: true
    access-token: ${OPENAPI_ACCESS_TOKEN:dev-openapi}
