spring:
  config:
    activate:
      on-profile: dev
  r2dbc:
    url: ${R2DBC_DATABASE_URL:r2dbc:mysql://localhost:3306/buddystudy?serverZoneId=UTC}
    username: ${DATABASE_USERNAME:buddystudy}
    password: ${DATABASE_PASSWORD:local-password}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${ENABLE_OPENAPI_DOCS:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${ENABLE_OPENAPI_DOCS:true}
    path: /docs
    url: /v3/api-docs

buddystudy:
  scheduler:
    enabled: true
  streams:
    enabled: true
  openapi:
    enabled: true
    access-token: ${OPENAPI_ACCESS_TOKEN:dev-openapi}
