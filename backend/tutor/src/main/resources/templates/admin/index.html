<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuddyStuddy Admin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: #f6f7f9;
      color: #17171a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7f9; color: #17171a; }
    button, input { border: 0; font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 18px;
      background: #ffffff;
      border-right: 1px solid #e6e7eb;
      overflow-y: auto;
    }
    .brand { margin: 0 0 22px; }
    .brand h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .brand p { margin: 8px 0 0; color: #71717a; font-size: 13px; line-height: 1.45; }
    .nav-section { margin: 10px 0; border-radius: 16px; }
    .nav-category {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 14px;
      background: transparent;
      color: #27272a;
      font-weight: 800;
      text-align: left;
    }
    .nav-category:hover, .nav-section.active > .nav-category { background: #f1f2f4; }
    .nav-count { color: #8a8a94; font-size: 12px; font-weight: 700; }
    .nav-items { display: none; margin: 3px 0 8px; padding-left: 8px; }
    .nav-section.open .nav-items { display: grid; gap: 3px; }
    .nav-item {
      width: 100%;
      padding: 9px 12px;
      border-radius: 12px;
      background: transparent;
      color: #5f6068;
      text-align: left;
      font-size: 14px;
      font-weight: 650;
    }
    .nav-item:hover, .nav-item.active { background: #eef5ff; color: #0969da; }
    .logout { width: 100%; margin-top: 20px; background: #f3f4f6; color: #3f3f46; padding: 12px 14px; border-radius: 14px; font-weight: 800; }
    main { padding: 34px 34px 70px; min-width: 0; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: #71717a; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .page-title { margin: 6px 0 0; font-size: 40px; letter-spacing: 0; line-height: 1.05; }
    .page-subtitle { margin: 8px 0 0; color: #71717a; font-size: 15px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; }
    .toolbar input {
      width: 152px;
      padding: 12px 13px;
      border-radius: 13px;
      background: #ffffff;
      border: 1px solid #e2e3e8;
      color: #17171a;
      outline: none;
    }
    .button { background: #17171a; color: #ffffff; padding: 12px 15px; border-radius: 13px; font-weight: 800; }
    .button.secondary { background: #ffffff; color: #27272a; border: 1px solid #e2e3e8; }
    .status { min-height: 20px; color: #71717a; font-size: 13px; }
    .panel { background: #ffffff; border: 1px solid #e6e7eb; border-radius: 22px; padding: 20px; box-shadow: 0 12px 34px rgba(15, 23, 42, .05); }
    .login { max-width: 420px; display: grid; gap: 12px; margin: 64px auto 0; }
    .login input { background: #f3f4f6; color: #17171a; padding: 15px 16px; border-radius: 14px; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: #ffffff; border: 1px solid #e6e7eb; border-radius: 18px; padding: 16px; min-height: 100px; }
    .label { color: #71717a; font-size: 13px; font-weight: 750; }
    .value { font-size: 32px; font-weight: 900; margin-top: 12px; letter-spacing: -.01em; }
    .hint { color: #8a8a94; font-size: 12px; margin-top: 8px; min-height: 16px; }
    .charts { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .chart-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .chart-title strong { font-size: 18px; }
    svg { width: 100%; height: 230px; display: block; background: #fbfbfc; border: 1px solid #eeeeF2; border-radius: 14px; }
    .axis { stroke: #d8dbe2; stroke-width: 1; }
    .grid-line { stroke: #eef0f4; stroke-width: 1; }
    .axis-label { fill: #7c7f89; font-size: 13px; }
    .x-label { fill: #8c8f99; font-size: 12px; }
    .line { fill: none; stroke: #168a3a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #168a3a; }
    .muted { color: #71717a; }
    .error { color: #d1242f; min-height: 22px; }
    .hidden { display: none !important; }
    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid #e6e7eb; }
      main { padding: 26px 18px 56px; }
      .topbar { display: grid; }
      .toolbar { justify-content: flex-start; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-title { font-size: 34px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar hidden">
    <div class="brand">
      <h1>BuddyStuddy</h1>
      <p>운영 지표를 카테고리별로 확인합니다.</p>
    </div>
    <nav id="metricNav"></nav>
    <button id="logoutButton" class="logout">Logout</button>
  </aside>

  <main>
    <section id="loginPanel" class="panel login">
      <input id="username" autocomplete="username" placeholder="Admin username" />
      <input id="password" autocomplete="current-password" type="password" placeholder="Password" />
      <button id="loginButton" class="button">Login</button>
      <div id="loginError" class="error"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="topbar">
        <div>
          <div class="eyebrow">Admin analytics</div>
          <h2 id="pageTitle" class="page-title">Overview</h2>
          <p id="pageSubtitle" class="page-subtitle">핵심 운영 지표를 확인합니다.</p>
        </div>
        <div class="toolbar">
          <input id="startDate" type="date" />
          <input id="endDate" type="date" />
          <button id="refreshButton" class="button">Refresh Aggregates</button>
          <button id="reloadButton" class="button secondary">Reload</button>
          <span id="status" class="status"></span>
        </div>
      </div>
      <div id="cards" class="grid"></div>
      <div id="charts" class="charts"></div>
    </section>
  </main>
</div>

<script>
const metricLabels = {
  daily_active_users: "Daily active users",
  weekly_active_learners: "Weekly active learners",
  question_created_count: "Questions created",
  answer_submitted_count: "Answers submitted",
  answer_rate: "Average answer rate",
  push_open_rate: "Average push open rate",
  question_to_answer_latency: "Average answer latency",
  study_streak: "Study streak",
  quota_used_count: "Quota used"
};
const categories = [
  {
    id: "overview",
    title: "Overview",
    description: "핵심 운영 지표를 한 화면에서 봅니다.",
    metrics: ["daily_active_users", "weekly_active_learners", "question_created_count", "answer_submitted_count", "answer_rate", "push_open_rate", "question_to_answer_latency", "quota_used_count"]
  },
  {
    id: "users",
    title: "Users",
    description: "활성 사용자와 학습자 리텐션을 봅니다.",
    metrics: ["daily_active_users", "weekly_active_learners", "study_streak"]
  },
  {
    id: "learning",
    title: "Learning",
    description: "질문 생성, 답변 제출, 답변 전환율을 봅니다.",
    metrics: ["question_created_count", "answer_submitted_count", "answer_rate", "question_to_answer_latency"]
  },
  {
    id: "notifications",
    title: "Notifications",
    description: "푸시 도달 이후 열람 흐름을 봅니다.",
    metrics: ["push_open_rate"]
  },
  {
    id: "quota",
    title: "Quota",
    description: "시스템 API 사용량과 무료 질문 사용량을 봅니다.",
    metrics: ["quota_used_count"]
  }
];
let token = localStorage.getItem("buddystuddy.adminToken") || "";
let activeCategoryId = "overview";
let activeMetricKey = null;

function isoDate(date) { return date.toISOString().slice(0, 10); }
function defaultDates() {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - 29);
  startDate.value = isoDate(start);
  endDate.value = isoDate(end);
}
function authHeaders() { return { "Authorization": `Bearer ${token}` }; }
function activeCategory() { return categories.find(category => category.id === activeCategoryId) || categories[0]; }
function activeMetricKeys() { return activeMetricKey ? [activeMetricKey] : activeCategory().metrics; }
function formatValue(metric, value) {
  if (metric.endsWith("_rate")) return `${Math.round(value * 100)}%`;
  if (metric === "question_to_answer_latency") return `${Math.round(value / 60)}m`;
  return new Intl.NumberFormat().format(Math.round(value * 10) / 10);
}
function addDays(value, days) {
  const date = new Date(`${value}T00:00:00Z`);
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString().slice(0, 10);
}
function pointRange(metric, point) {
  if (!point) return "";
  if (metric === "weekly_active_learners") return `${addDays(point.date, -6)} ~ ${point.date}`;
  return point.date;
}
function formatDateLabel(date) {
  const [, month, day] = date.split("-");
  return `${Number(month)}/${Number(day)}`;
}
function rateDetail(point) {
  const denominator = Number(point.sampleCount || 0);
  if (denominator <= 0) return "0/0";
  const numerator = Math.round(point.value * denominator);
  return `${numerator}/${denominator}`;
}
function pointDetail(series, point) {
  if (series.metricKey.endsWith("_rate")) return `${formatValue(series.metricKey, point.value)} (${rateDetail(point)})`;
  if (series.metricKey === "question_to_answer_latency") return `${formatValue(series.metricKey, point.value)} · ${new Intl.NumberFormat().format(point.sampleCount || 0)} answers`;
  return `${new Intl.NumberFormat().format(Math.round(point.value * 10) / 10)} count`;
}
function pointTooltip(series, point) {
  const name = metricLabels[series.metricKey] || series.metricKey;
  const range = pointRange(series.metricKey, point);
  return `${name}\n${range}\n${pointDetail(series, point)}`;
}
function renderNav() {
  metricNav.innerHTML = categories.map(category => `
    <section class="nav-section ${category.id === activeCategoryId ? "active open" : ""}" data-category="${category.id}">
      <button class="nav-category" type="button" data-category="${category.id}">
        <span>${category.title}</span>
        <span class="nav-count">${category.metrics.length}</span>
      </button>
      <div class="nav-items">
        ${category.metrics.map(metric => `
          <button class="nav-item ${activeMetricKey === metric ? "active" : ""}" type="button" data-category="${category.id}" data-metric="${metric}">
            ${metricLabels[metric] || metric}
          </button>
        `).join("")}
      </div>
    </section>
  `).join("");
  metricNav.querySelectorAll(".nav-category").forEach(button => {
    button.onclick = async () => {
      activeCategoryId = button.dataset.category;
      activeMetricKey = null;
      renderNav();
      await reload();
    };
  });
  metricNav.querySelectorAll(".nav-item").forEach(button => {
    button.onclick = async event => {
      event.stopPropagation();
      activeCategoryId = button.dataset.category;
      activeMetricKey = button.dataset.metric;
      renderNav();
      await reload();
    };
  });
}
async function login() {
  loginError.textContent = "";
  const res = await fetch("/api/v1/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: username.value, password: password.value })
  });
  if (!res.ok) {
    loginError.textContent = "Login failed.";
    return;
  }
  const body = await res.json();
  token = body.adminToken;
  localStorage.setItem("buddystuddy.adminToken", token);
  showDashboard();
  await reload();
}
function logout() {
  token = "";
  localStorage.removeItem("buddystuddy.adminToken");
  sidebar.classList.add("hidden");
  dashboard.classList.add("hidden");
  loginPanel.classList.remove("hidden");
}
function showDashboard() {
  loginPanel.classList.add("hidden");
  sidebar.classList.remove("hidden");
  dashboard.classList.remove("hidden");
  renderNav();
}
async function refreshAggregates() {
  status.textContent = "Refreshing...";
  const url = `/api/v1/admin/analytics/refresh?startDate=${startDate.value}&endDate=${endDate.value}`;
  const res = await fetch(url, { method: "POST", headers: authHeaders() });
  if (!res.ok) throw new Error("refresh failed");
  status.textContent = "Aggregates refreshed";
  await render(await res.json());
}
async function reload() {
  const category = activeCategory();
  pageTitle.textContent = activeMetricKey ? metricLabels[activeMetricKey] : category.title;
  pageSubtitle.textContent = activeMetricKey ? category.description : category.description;
  status.textContent = "Loading...";
  const query = activeMetricKeys().map(key => `metricKey=${encodeURIComponent(key)}`).join("&");
  const url = `/api/v1/admin/analytics/metrics?startDate=${startDate.value}&endDate=${endDate.value}&${query}`;
  const res = await fetch(url, { headers: authHeaders() });
  if (!res.ok) throw new Error("load failed");
  status.textContent = "";
  await render(await res.json());
}
async function render(data) {
  const metricKeys = activeMetricKeys();
  const byKey = new Map(data.series.filter(s => !s.dimension).map(s => [s.metricKey, s]));
  cards.innerHTML = metricKeys.map(key => {
    const point = byKey.get(key)?.points?.at(-1);
    return `<div class="card"><div class="label">${metricLabels[key] || key}</div><div class="value">${formatValue(key, point?.value || 0)}</div><div class="hint">${pointRange(key, point)}</div></div>`;
  }).join("");
  charts.innerHTML = data.series.map(series => chart(series)).join("");
}
function chart(series) {
  const points = series.points || [];
  const values = points.map(p => p.value);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const span = Math.max(max - min, 1);
  const width = 1000;
  const height = 230;
  const leftPad = 66;
  const rightPad = 24;
  const topPad = 22;
  const bottomPad = 34;
  const coords = points.map((p, i) => {
    const x = leftPad + (points.length <= 1 ? 0 : i * (width - leftPad - rightPad) / (points.length - 1));
    const y = height - bottomPad - ((p.value - min) / span) * (height - topPad - bottomPad);
    return { x, y, point: p };
  });
  const linePoints = coords.map(p => `${p.x},${p.y}`).join(" ");
  const yTicks = [max, min + span / 2, min].map(value => {
    const y = height - bottomPad - ((value - min) / span) * (height - topPad - bottomPad);
    return { value, y };
  });
  const xTickIndexes = tickIndexes(points.length, 6);
  const xTicks = xTickIndexes.map(index => ({
    x: coords[index]?.x || leftPad,
    date: points[index]?.date || ""
  }));
  const pointMarks = coords.map(({ x, y, point }) => `
        <circle class="dot" cx="${x}" cy="${y}" r="4">
          <title>${pointTooltip(series, point)}</title>
        </circle>
      `).join("");
  const latest = points.at(-1);
  const title = `${metricLabels[series.metricKey] || series.metricKey}${series.dimension ? ` · ${series.dimension}` : ""}`;
  return `<section class="panel">
    <div class="chart-title"><strong>${title}</strong><span class="muted">${latest ? formatValue(series.metricKey, latest.value) : "0"}</span></div>
    <svg viewBox="0 0 ${width} ${height}">
      ${yTicks.map(t => `<line class="grid-line" x1="${leftPad}" y1="${t.y}" x2="${width - rightPad}" y2="${t.y}"></line><text class="axis-label" x="${leftPad - 12}" y="${t.y + 5}" text-anchor="end">${formatValue(series.metricKey, t.value)}</text>`).join("")}
      ${xTicks.map(t => `<line class="grid-line" x1="${t.x}" y1="${topPad}" x2="${t.x}" y2="${height - bottomPad}"></line><text class="x-label" x="${t.x}" y="${height - 10}" text-anchor="middle">${formatDateLabel(t.date)}</text>`).join("")}
      <line class="axis" x1="${leftPad}" y1="${topPad}" x2="${leftPad}" y2="${height - bottomPad}"></line>
      <line class="axis" x1="${leftPad}" y1="${height - bottomPad}" x2="${width - rightPad}" y2="${height - bottomPad}"></line>
      <polyline class="line" points="${linePoints}"></polyline>
      ${pointMarks}
    </svg>
  </section>`;
}
function tickIndexes(length, maxTicks) {
  if (length <= 0) return [];
  if (length <= maxTicks) return Array.from({ length }, (_, index) => index);
  const last = length - 1;
  const indexes = new Set([0, last]);
  for (let i = 1; i < maxTicks - 1; i++) {
    indexes.add(Math.round(i * last / (maxTicks - 1)));
  }
  return [...indexes].sort((a, b) => a - b);
}
loginButton.onclick = login;
logoutButton.onclick = logout;
refreshButton.onclick = () => refreshAggregates().catch(error => status.textContent = error.message);
reloadButton.onclick = () => reload().catch(error => status.textContent = error.message);
defaultDates();
if (token) { showDashboard(); reload().catch(() => logout()); }
</script>
</body>
</html>
