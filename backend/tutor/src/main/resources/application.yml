server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: buddystudy-backend
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: none
      image: none
      moderation: none
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/buddystudy}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  mail:
    host: ${email.google.smtpHost:${SMTP_HOST:}}
    port: ${email.google.smtpPort:${SMTP_PORT:587}}
    username: ${email.google.smtpUsername:${SMTP_USERNAME:}}
    password: ${email.google.smtpPassword:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

buddystudy:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:${BACKEND_MASTER_KEY:dev-buddystudy-secret-must-be-overridden}}
    access-token-days: ${ACCESS_TOKEN_DAYS:90}
  crypto:
    master-key: ${BACKEND_MASTER_KEY:dev-buddystudy-master-key}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    poll-ms: ${SCHEDULER_POLL_MS:30000}
    max-pending-per-study: ${MAX_PENDING_PER_STUDY:1}
    batch-size: ${SCHEDULER_BATCH_SIZE:50}
    processing-timeout-seconds: ${SCHEDULER_PROCESSING_TIMEOUT_SECONDS:300}
    worker-id: ${SCHEDULER_WORKER_ID:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4}
  apns:
    team-id: ${notificatoin.push.apns.team-id:${APNS_TEAM_ID:}}
    key-id: ${notificatoin.push.apns.key-id:${APNS_KEY_ID:}}
    auth-key-p8: ${notificatoin.push.apns.private-key:${APNS_AUTH_KEY_P8:${APNS_AUTH_KEY_BASE64:}}}
    bundle-id: ${notificatoin.push.apns.bundle-id:${APNS_BUNDLE_ID:io.github.ghkdqhrbals.StudyMate}}
  streams:
    enabled: ${REACTION_STREAM_ENABLED:true}
    push-prefix: ${PUSH_STREAM_PREFIX:push-v1}
    view-prefix: ${VIEW_STREAM_PREFIX:view-v1}
    max-len: ${REACTION_STREAM_XADD_MAX_LEN:100000}
    view-queue-capacity: ${VIEW_EVENT_QUEUE_CAPACITY:20000}
    view-publisher-concurrency: ${VIEW_EVENT_PUBLISHER_CONCURRENCY:4}
  email:
    verification-ttl-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:180}
    from: ${email.google.smtpFrom:${SMTP_FROM:${email.google.smtpUsername:${SMTP_USERNAME:}}}}
  openapi:
    enabled: ${ENABLE_OPENAPI_DOCS:false}
    access-token: ${OPENAPI_ACCESS_TOKEN:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    token-hours: ${ADMIN_TOKEN_HOURS:12}
  monitoring:
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    environment-name: ${MONITORING_ENVIRONMENT_NAME:${SPRING_PROFILES_ACTIVE:production}}
    service-name: ${MONITORING_SERVICE_NAME:BuddyStudy backend}
    admin-base-url: ${MONITORING_ADMIN_BASE_URL:}
    slack-timeout-ms: ${MONITORING_SLACK_TIMEOUT_MS:5000}
    scheduler-readiness-enabled: ${MONITORING_SCHEDULER_READINESS_ENABLED:true}
    coordinator-readiness-enabled: ${MONITORING_COORDINATOR_READINESS_ENABLED:false}
    coordinator-base-url: ${MONITORING_COORDINATOR_BASE_URL:${REACTION_STREAM_COORDINATOR_BASE_URL:}}
    coordinator-timeout-ms: ${MONITORING_COORDINATOR_TIMEOUT_MS:3000}
    scheduler-stale-threshold-minutes: ${MONITORING_SCHEDULER_STALE_THRESHOLD_MINUTES:15}
    scheduler-startup-grace-minutes: ${MONITORING_SCHEDULER_STARTUP_GRACE_MINUTES:15}
    scheduler-monitored-jobs: ${MONITORING_SCHEDULER_MONITORED_JOBS:question-schedule,question-push-outbox-dispatch,user-stats-refresh,admin-analytics-recent,admin-analytics-correction}
  analytics:
    enabled: ${ADMIN_ANALYTICS_ENABLED:true}
    recent-days: ${ADMIN_ANALYTICS_RECENT_DAYS:2}
    correction-days: ${ADMIN_ANALYTICS_CORRECTION_DAYS:30}
    datasource:
      url: ${ADMIN_ANALYTICS_DATABASE_URL:}
      username: ${ADMIN_ANALYTICS_DATABASE_USERNAME:${DATABASE_USERNAME:}}
      password: ${ADMIN_ANALYTICS_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}
      driver-class-name: ${ADMIN_ANALYTICS_DATABASE_DRIVER:}
      database-name: ${ADMIN_ANALYTICS_DATABASE_NAME:buddystudy_aggregation}

redis-stream-coordinator:
  coordinator-base-url: ${REACTION_STREAM_COORDINATOR_BASE_URL:https://coordinator.ghkdqhrbals.org}
  username: ${REACTION_STREAM_COORDINATOR_USERNAME:admin}
  password: ${REACTION_STREAM_COORDINATOR_PASSWORD:${REDIS_STREAM_COORDINATOR_PASSWORD:}}
