<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>BuddyStudy 계정 연결</title>
<link rel="stylesheet" href="/oauth/connect.css"><script src="/oauth/connect.js" defer></script>
</head>
<body>
<div class="page">
<header><span class="brand">BuddyStudy</span><button id="language" class="text-button" type="button">English</button></header>
<main>
<h1 id="screen-title" tabindex="-1">BuddyStudy 로그인</h1>
<p id="screen-description" class="description">연결할 계정의 이메일을 입력하세요.</p>
<section id="login" aria-labelledby="screen-title">
<form id="email-form">
<label for="email" data-ko="계정 이메일" data-en="Account email">계정 이메일</label>
<input id="email" type="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required>
<p class="hint" data-ko="BuddyStudy 프로필에 표시된 이메일을 사용하세요." data-en="Use the email shown in your BuddyStudy profile.">BuddyStudy 프로필에 표시된 이메일을 사용하세요.</p>
<button class="primary" type="submit" data-ko="계속" data-en="Continue">계속</button>
</form>
<form id="code-form" hidden>
<label for="code" data-ko="8자리 인증번호" data-en="8-digit verification code">8자리 인증번호</label>
<input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required>
<button class="primary" type="submit" data-ko="확인" data-en="Verify">확인</button>
<button id="change-email" class="text-button back" type="button" data-ko="다른 이메일 사용" data-en="Use a different email">다른 이메일 사용</button>
</form>
</section>
<section id="consent" aria-labelledby="screen-title" hidden>
<div class="account"><span id="account-email"></span><button id="change-account" class="text-button" type="button" data-ko="계정 변경" data-en="Change account">계정 변경</button></div>
<h2 data-ko="공유할 정보" data-en="Information you share">공유할 정보</h2>
<ul class="permissions">
<li><strong data-ko="스터디" data-en="Studies and topics">스터디</strong><span data-ko="학습 주제와 트리" data-en="Your saved learning tree">학습 주제와 트리</span></li>
<li><strong data-ko="학습 기록" data-en="Questions, answers and feedback">학습 기록</strong><span data-ko="질문, 답변, 채점 결과" data-en="Your records and grading results">질문, 답변, 채점 결과</span></li>
<li><strong data-ko="통계" data-en="Topic statistics">통계</strong><span data-ko="주제별 점수와 학습 추이" data-en="Scores and progress by topic">주제별 점수와 학습 추이</span></li>
</ul>
<p class="scope-note" data-ko="ChatGPT는 기록을 수정하거나 삭제할 수 없습니다." data-en="ChatGPT cannot edit or delete your records.">ChatGPT는 기록을 수정하거나 삭제할 수 없습니다.</p>
<div class="actions"><button id="deny" class="secondary" type="button" data-ko="취소" data-en="Cancel">취소</button><button id="allow" class="primary" type="button" data-ko="연결 허용" data-en="Allow connection">연결 허용</button></div>
<p class="disclosure" data-ko="연결은 최대 30일 동안 유지됩니다." data-en="The connection lasts up to 30 days.">연결은 최대 30일 동안 유지됩니다.</p>
</section>
<section id="connections" aria-labelledby="screen-title" hidden>
<p class="hint" data-ko="연결을 해제하면 더 이상 내 기록을 조회할 수 없습니다. 이미 전달된 내용은 ChatGPT에서 별도로 관리하세요." data-en="Disconnecting stops future access. Manage content already shared with ChatGPT separately.">연결을 해제하면 더 이상 내 기록을 조회할 수 없습니다. 이미 전달된 내용은 ChatGPT에서 별도로 관리하세요.</p>
<div id="connection-list"></div>
</section>
<p id="message" role="status" aria-live="polite"></p>
<footer><a target="_blank" rel="noopener noreferrer" id="connection-notice" href="https://ghkdqhrbals.github.io/buddy-studdy/chatgpt-connection-2026-10-20.html" data-ko="연결 안내" data-en="Connection notice">연결 안내</a><a target="_blank" rel="noopener noreferrer" id="privacy" href="https://ghkdqhrbals.github.io/buddy-studdy/privacy.html" data-ko="개인정보 처리방침" data-en="Privacy policy">개인정보 처리방침</a></footer>
</main>
</div>
</body></html>
