name: Deploy RedisStreamScope on MacBook Air

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable RedisStreamScope image reference
        required: true
        default: ghcr.io/ghkdqhrbals/redisstreamscope@sha256:fe0b881f071a70c896bb9dda84a00c79343100a4748f9dd0b968574bf7e99a98
        type: string

concurrency:
  group: deploy-macbookair-redisstreamscope
  cancel-in-progress: false

jobs:
  deploy_redisstreamscope:
    name: Deploy RedisStreamScope Module
    runs-on: [self-hosted, macOS, ARM64, macbook-air, buddystudy]
    timeout-minutes: 10
    env:
      REDISSTREAMSCOPE_ROOT: ${{ vars.MACBOOKAIR_REDISSTREAMSCOPE_ROOT || '$HOME/buddystudy/redisstreamscope' }}
      REDISSTREAMSCOPE_PORT: ${{ vars.REDISSTREAMSCOPE_PORT || '3002' }}

    steps:
      - name: Deploy RedisStreamScope runtime
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          REDIS_CLUSTER_NODES: ${{ secrets.RSC_REDIS_CLUSTER_NODES }}
          REDIS_PASSWORD: ${{ secrets.RSC_REDIS_PASSWORD }}
          BASIC_AUTH_HTPASSWD: ${{ secrets.API_DASHBOARD_BASIC_AUTH_HTPASSWD }}
        run: |
          set -euo pipefail

          if [ -z "${REDIS_CLUSTER_NODES}" ]; then
            echo "Missing GitHub Actions secret: RSC_REDIS_CLUSTER_NODES" >&2
            exit 1
          fi
          if [ -z "${REDIS_PASSWORD}" ]; then
            echo "Missing GitHub Actions secret: RSC_REDIS_PASSWORD" >&2
            exit 1
          fi
          if [ -z "${BASIC_AUTH_HTPASSWD}" ]; then
            echo "Missing GitHub Actions secret: API_DASHBOARD_BASIC_AUTH_HTPASSWD" >&2
            exit 1
          fi
          if [[ "${IMAGE_REF}" != ghcr.io/ghkdqhrbals/redisstreamscope@sha256:* ]]; then
            echo "image_ref must be an immutable ghcr.io/ghkdqhrbals/redisstreamscope digest." >&2
            exit 1
          fi

          redisstreamscope_root="$(eval echo "${REDISSTREAMSCOPE_ROOT}")"
          mkdir -p "${redisstreamscope_root}/gateway"
          chmod 700 "${redisstreamscope_root}" "${redisstreamscope_root}/gateway"

          htpasswd_temp="$(mktemp)"
          nginx_temp="$(mktemp)"
          cleanup() {
            rm -f "${htpasswd_temp}" "${nginx_temp}"
          }
          trap cleanup EXIT

          printf '%s\n' "${BASIC_AUTH_HTPASSWD}" > "${htpasswd_temp}"
          chmod 600 "${htpasswd_temp}"
          cp "${htpasswd_temp}" "${redisstreamscope_root}/gateway/htpasswd"
          chmod 600 "${redisstreamscope_root}/gateway/htpasswd"

          cat > "${nginx_temp}" <<'NGINX'
          server {
            listen 8080;
            server_name _;

            auth_basic "RedisStreamScope";
            auth_basic_user_file /etc/nginx/auth/htpasswd;

            location / {
              proxy_pass http://buddystudy-redisstreamscope:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_buffering off;
              proxy_read_timeout 3600s;
            }
          }
          NGINX
          cp "${nginx_temp}" "${redisstreamscope_root}/gateway/nginx.conf"
          chmod 600 "${redisstreamscope_root}/gateway/nginx.conf"

          docker pull "${IMAGE_REF}"
          docker pull nginx:1.27-alpine
          docker network create buddystudy-redisstreamscope >/dev/null 2>&1 || true
          docker volume create buddystudy-redisstreamscope-data >/dev/null

          docker rm -f buddystudy-redisstreamscope-gateway >/dev/null 2>&1 || true
          docker rm -f buddystudy-redisstreamscope >/dev/null 2>&1 || true

          docker run -d \
            --name buddystudy-redisstreamscope \
            --network buddystudy-redisstreamscope \
            --restart unless-stopped \
            --memory 256m \
            -e SECURE_COOKIES=true \
            -e SESSION_TTL=12h \
            -e REDIS_ID=buddystudy-production \
            -e "REDIS_NAME=BuddyStudy Production" \
            -e REDIS_MODE=cluster \
            -e "REDIS_NODES=${REDIS_CLUSTER_NODES}" \
            -e "REDIS_PASSWORD=${REDIS_PASSWORD}" \
            -e REDIS_KEY_PATTERN='*' \
            -v buddystudy-redisstreamscope-data:/data \
            "${IMAGE_REF}"

          docker run -d \
            --name buddystudy-redisstreamscope-gateway \
            --network buddystudy-redisstreamscope \
            --restart unless-stopped \
            --memory 64m \
            -p "127.0.0.1:${REDISSTREAMSCOPE_PORT}:8080" \
            -v "${redisstreamscope_root}/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "${redisstreamscope_root}/gateway/htpasswd:/etc/nginx/auth/htpasswd:ro" \
            nginx:1.27-alpine

          {
            echo "### RedisStreamScope deployment submitted"
            echo
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Origin: \`127.0.0.1:${REDISSTREAMSCOPE_PORT}\`"
            echo "- Data: Docker volume \`buddystudy-redisstreamscope-data\`"
            echo "- Public protection: gateway Basic Auth + RedisStreamScope session auth"
            echo "- Runtime health is owned by monitoring, not this deploy workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
