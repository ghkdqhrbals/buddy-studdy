version: "3.8"

services:
  backend:
    image: "${IMAGE_REF}"
    env_file:
      - .env
    networks:
      - buddystudy-swarm-net
    volumes:
      - buddystudy-profile-photos:/app/profile-photos
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8080/api/v1/health/dependencies
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      replicas: 1
      endpoint_mode: vip
      resources:
        limits:
          cpus: "1.50"
          memory: 1280M
        reservations:
          cpus: "0.25"
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 90s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 90s
        max_failure_ratio: 0
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  buddystudy-swarm-net:
    external: true

volumes:
  buddystudy-profile-photos:
    external: true
