name: Deploy BuddyStudy TestZone on MacBook Air

on:
  repository_dispatch:
    types:
      - testzone-image-published
  workflow_dispatch:
    inputs:
      image:
        description: "TestZone image ref to deploy."
        required: true
        default: "ghcr.io/ghkdqhrbals/buddystudy-testzone:latest"
        type: string

concurrency:
  group: deploy-macbookair-testzone
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy_testzone:
    name: Deploy TestZone Module
    runs-on: [self-hosted, macOS, ARM64, macbook-air, buddystudy]
    timeout-minutes: 15
    env:
      IMAGE_REF: ${{ github.event.client_payload.image || inputs.image }}
      TESTZONE_ROOT: ${{ vars.MACBOOKAIR_TESTZONE_ROOT || '$HOME/buddystudy/monitoring/testzone' }}
      TESTZONE_ALLOWED_TARGET_HOSTS: ${{ vars.TESTZONE_ALLOWED_TARGET_HOSTS || 'api.ghkdqhrbals.org,host.docker.internal' }}
      TESTZONE_INFLUX_ORG: ${{ vars.TESTZONE_INFLUX_ORG || 'buddystudy' }}
      TESTZONE_INFLUX_BUCKET: ${{ vars.TESTZONE_INFLUX_BUCKET || 'testzone' }}

    steps:
      - name: Deploy TestZone execution service
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TESTZONE_INFLUX_PASSWORD: ${{ secrets.TESTZONE_INFLUX_PASSWORD }}
          TESTZONE_INFLUX_TOKEN: ${{ secrets.TESTZONE_INFLUX_TOKEN }}
          TESTZONE_COMPONENT_PASSWORD: ${{ secrets.TESTZONE_COMPONENT_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          for required in IMAGE_REF GHCR_USERNAME GHCR_TOKEN TESTZONE_INFLUX_PASSWORD TESTZONE_INFLUX_TOKEN TESTZONE_COMPONENT_PASSWORD OPENAI_API_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "Missing TestZone deployment value: ${required}" >&2
              exit 1
            fi
          done

          testzone_root="$(eval echo "${TESTZONE_ROOT}")"
          mkdir -p "${testzone_root}/data" "${testzone_root}/influxdb"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker pull "${IMAGE_REF}"
          docker pull influxdb:2.7-alpine
          docker network create buddystudy-monitoring >/dev/null 2>&1 || true
          docker network create buddystudy-testzone >/dev/null 2>&1 || true

          docker rm -f buddystudy-testzone-service buddystudy-testzone-influxdb >/dev/null 2>&1 || true

          docker run -d \
            --name buddystudy-testzone-influxdb \
            --network buddystudy-monitoring \
            --restart unless-stopped \
            -p "127.0.0.1:8086:8086" \
            -e DOCKER_INFLUXDB_INIT_MODE=setup \
            -e DOCKER_INFLUXDB_INIT_USERNAME=testzone \
            -e DOCKER_INFLUXDB_INIT_PASSWORD="${TESTZONE_INFLUX_PASSWORD}" \
            -e DOCKER_INFLUXDB_INIT_ORG="${TESTZONE_INFLUX_ORG}" \
            -e DOCKER_INFLUXDB_INIT_BUCKET="${TESTZONE_INFLUX_BUCKET}" \
            -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN="${TESTZONE_INFLUX_TOKEN}" \
            -e DOCKER_INFLUXDB_INIT_RETENTION=30d \
            -v "${testzone_root}/influxdb:/var/lib/influxdb2" \
            influxdb:2.7-alpine

          docker run -d \
            --name buddystudy-testzone-service \
            --network buddystudy-monitoring \
            --restart unless-stopped \
            -e TESTZONE_PORT=3020 \
            -e TESTZONE_DATA_DIR=/data \
            -e TESTZONE_MAX_VUS=1000 \
            -e TESTZONE_MAX_TARGET_RPS=3000 \
            -e TESTZONE_MAX_DURATION_SECONDS=3600 \
            -e TESTZONE_MAX_CONCURRENT_RUNS=1 \
            -e TESTZONE_ALLOWED_TARGET_HOSTS="${TESTZONE_ALLOWED_TARGET_HOSTS}" \
            -e TESTZONE_GRAFANA_URL=https://grafana.lowfidev.cloud/grafana/ \
            -e TESTZONE_INFLUX_URL=http://buddystudy-testzone-influxdb:8086 \
            -e TESTZONE_INFLUX_ORG="${TESTZONE_INFLUX_ORG}" \
            -e TESTZONE_INFLUX_BUCKET="${TESTZONE_INFLUX_BUCKET}" \
            -e TESTZONE_INFLUX_TOKEN="${TESTZONE_INFLUX_TOKEN}" \
            -e TESTZONE_OPENAI_MODEL=gpt-5 \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e TESTZONE_COMPONENT_PASSWORD="${TESTZONE_COMPONENT_PASSWORD}" \
            -v "${testzone_root}/data:/data" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${IMAGE_REF}"

          docker network connect buddystudy-testzone buddystudy-testzone-service >/dev/null 2>&1 || true

          sleep 3
          for container in buddystudy-testzone-influxdb buddystudy-testzone-service; do
            if ! docker inspect -f '{{.State.Running}}' "${container}" 2>/dev/null | grep -qx true; then
              echo "${container} did not stay running." >&2
              docker logs "${container}" >&2 || true
              exit 1
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## TestZone Deployment"
            echo ""
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Load ceiling: \`1,000 VUs\`"
            echo "- Metrics: \`InfluxDB / 30 days\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
