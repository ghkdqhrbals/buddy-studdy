name: Deploy BuddyStudy Backend

on:
  repository_dispatch:
    types:
      - backend-image-published
  workflow_dispatch:
    inputs:
      image:
        description: "Image ref to deploy."
        required: true
        type: string
      coordinator_image:
        description: "Redis Stream Coordinator image ref to deploy. Leave empty to keep the current default."
        required: false
        default: "ghcr.io/ghkdqhrbals/redis-stream-coordinator/coordinator:native-latest"
        type: string

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, ARM64, ec2, rsc-deploy]
    timeout-minutes: 20
    env:
      IMAGE_REF: ${{ github.event.client_payload.image || inputs.image }}
      COORDINATOR_IMAGE_REF: ${{ github.event.client_payload.coordinator_image || inputs.coordinator_image || 'ghcr.io/ghkdqhrbals/redis-stream-coordinator/coordinator:native-latest' }}
      BACKEND_DOMAIN: api.ghkdqhrbals.org
      COORDINATOR_DOMAIN: coordinator.ghkdqhrbals.org

    steps:
      - name: Validate input
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "Missing image ref." >&2
            exit 1
          fi

      - name: Deploy on self-hosted runner
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_MASTER_KEY: ${{ secrets.BACKEND_MASTER_KEY }}
          BACKEND_API_TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
          POSTGRES_SECRET_ID: buddystuddy/prod/postgres
          APP_SECRET_ID: buddystuddy/prod
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          APNS_AUTH_KEY_BASE64: ${{ secrets.APNS_AUTH_KEY_BASE64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          APNS_ENV: ${{ secrets.APNS_ENV }}
          REDIS_STREAM_COORDINATOR_PASSWORD: ${{ secrets.REDIS_STREAM_COORDINATOR_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p /opt/buddystuddy-backend

          cd /opt/buddystuddy-backend

          mkdir -p nginx/certs letsencrypt

          POSTGRES_SECRET_JSON="$(aws secretsmanager get-secret-value \
            --region ap-northeast-2 \
            --secret-id "${POSTGRES_SECRET_ID}" \
            --query SecretString \
            --output text 2>/dev/null || true)"

          if [ -n "${POSTGRES_SECRET_JSON}" ]; then
            POSTGRES_DB="$(SECRET_JSON="${POSTGRES_SECRET_JSON}" python3 -c 'import json, os; print(json.loads(os.environ["SECRET_JSON"]).get("dbname") or "buddystuddy")')"
            POSTGRES_USER="$(SECRET_JSON="${POSTGRES_SECRET_JSON}" python3 -c 'import json, os; print(json.loads(os.environ["SECRET_JSON"]).get("username") or "buddystuddy")')"
            POSTGRES_PASSWORD="$(SECRET_JSON="${POSTGRES_SECRET_JSON}" python3 -c 'import json, os; print(json.loads(os.environ["SECRET_JSON"])["password"])')"
            printf '%s' "${POSTGRES_PASSWORD}" > .postgres_password
            printf '%s' "${POSTGRES_SECRET_ID}" > .postgres_secret_name
          elif [ ! -s .postgres_password ]; then
            POSTGRES_DB=buddystuddy
            POSTGRES_USER=buddystuddy
            openssl rand -hex 32 > .postgres_password
          else
            POSTGRES_DB=buddystuddy
            POSTGRES_USER=buddystuddy
          fi
          chmod 600 .postgres_password
          chmod 600 .postgres_secret_name 2>/dev/null || true
          POSTGRES_PASSWORD="$(cat .postgres_password)"
          DATABASE_URL="jdbc:postgresql://buddystuddy-db:5432/${POSTGRES_DB}"

          cat > .env <<ENV
          SPRING_PROFILES_ACTIVE=prod
          FLYWAY_ENABLED=true
          DATABASE_URL=${DATABASE_URL}
          DATABASE_USERNAME=${POSTGRES_USER}
          DATABASE_PASSWORD=${POSTGRES_PASSWORD}
          SCHEDULER_ENABLED=true
          SCHEDULER_POLL_MS=30000
          OPENAI_MODEL=gpt-5.4
          BACKEND_MASTER_KEY=${BACKEND_MASTER_KEY}
          BACKEND_API_TOKEN=${BACKEND_API_TOKEN}
          GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}
          APNS_AUTH_KEY_BASE64=${APNS_AUTH_KEY_BASE64}
          APNS_KEY_ID=${APNS_KEY_ID}
          APNS_TEAM_ID=${APNS_TEAM_ID}
          APNS_BUNDLE_ID=${APNS_BUNDLE_ID}
          APNS_ENV=${APNS_ENV}
          AWS_SECRET_ID=${APP_SECRET_ID}
          AWS_REGION=ap-northeast-2
          REDIS_STREAM_COORDINATOR_PASSWORD=${REDIS_STREAM_COORDINATOR_PASSWORD}
          ENV
          chmod 600 .env

          cat > db.env <<ENV
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ENV
          chmod 600 db.env

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker pull "${IMAGE_REF}"
          docker pull "${COORDINATOR_IMAGE_REF}"
          docker pull nginx:1.27-alpine
          docker pull postgres:16-alpine
          docker pull certbot/certbot:v2.11.0
          docker pull curlimages/curl:8.11.0

          docker network create buddystuddy-net >/dev/null 2>&1 || true
          docker network create redis-stream-coordinator-net >/dev/null 2>&1 || true
          docker volume create buddystuddy-postgres-data >/dev/null

          docker rm -f rsc-prometheus redis-exporter-6379 redis-exporter-6380 redis-exporter-6381 >/dev/null 2>&1 || true

          docker rm -f rsc-coordinator >/dev/null 2>&1 || true
          docker run -d \
            --name rsc-coordinator \
            --network redis-stream-coordinator-net \
            --restart unless-stopped \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e AWS_REGION=ap-northeast-2 \
            -e AWS_SECRET_ID=${APP_SECRET_ID} \
            -e REDIS_STREAM_COORDINATOR_PASSWORD=${REDIS_STREAM_COORDINATOR_PASSWORD} \
            -p 18080:8080 \
            "${COORDINATOR_IMAGE_REF}"

          docker network connect buddystuddy-net rsc-coordinator >/dev/null 2>&1 || true

          docker rm -f buddystuddy-caddy >/dev/null 2>&1 || true
          if docker inspect buddystuddy-db >/dev/null 2>&1; then
            docker start buddystuddy-db >/dev/null
            docker network connect buddystuddy-net buddystuddy-db >/dev/null 2>&1 || true
          else
            docker run -d \
              --name buddystuddy-db \
              --network buddystuddy-net \
              --restart unless-stopped \
              --env-file db.env \
              -p 5432:5432 \
              -v buddystuddy-postgres-data:/var/lib/postgresql/data \
              --health-cmd "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" \
              --health-interval 10s \
              --health-timeout 5s \
              --health-retries 5 \
              postgres:16-alpine
          fi

          for attempt in $(seq 1 60); do
            if docker exec buddystuddy-db pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become ready." >&2
              docker logs buddystuddy-db || true
              exit 1
            fi
            sleep 2
          done

          BLUE_SLOT="buddystuddy-backend-a"
          GREEN_SLOT="buddystuddy-backend-b"
          LEGACY_SLOT="buddystuddy-backend"
          ACTIVE_SLOT="$(cat .active_backend_slot 2>/dev/null || true)"
          if [ -n "${ACTIVE_SLOT}" ] && ! docker inspect -f '{{.State.Running}}' "${ACTIVE_SLOT}" 2>/dev/null | grep -qx true; then
            ACTIVE_SLOT=""
          fi
          if [ -z "${ACTIVE_SLOT}" ]; then
            if docker inspect -f '{{.State.Running}}' "${BLUE_SLOT}" 2>/dev/null | grep -qx true; then
              ACTIVE_SLOT="${BLUE_SLOT}"
            elif docker inspect -f '{{.State.Running}}' "${GREEN_SLOT}" 2>/dev/null | grep -qx true; then
              ACTIVE_SLOT="${GREEN_SLOT}"
            elif docker inspect -f '{{.State.Running}}' "${LEGACY_SLOT}" 2>/dev/null | grep -qx true; then
              ACTIVE_SLOT="${LEGACY_SLOT}"
            fi
          fi
          if [ "${ACTIVE_SLOT}" = "${BLUE_SLOT}" ]; then
            NEW_SLOT="${GREEN_SLOT}"
            OLD_SLOT="${BLUE_SLOT}"
          else
            NEW_SLOT="${BLUE_SLOT}"
            OLD_SLOT="${ACTIVE_SLOT}"
          fi
          echo "Deploying ${IMAGE_REF} to ${NEW_SLOT}; active slot is ${OLD_SLOT:-none}."

          docker rm -f "${NEW_SLOT}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${NEW_SLOT}" \
            --network buddystuddy-net \
            --restart unless-stopped \
            --env-file .env \
            "${IMAGE_REF}"

          if docker network inspect redis-stream-coordinator-net >/dev/null 2>&1; then
            docker network connect redis-stream-coordinator-net "${NEW_SLOT}" >/dev/null 2>&1 || true
          fi

          for attempt in $(seq 1 30); do
            if docker run --rm \
              --network buddystuddy-net \
              curlimages/curl:8.11.0 \
              -fsS "http://${NEW_SLOT}:8080/health"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "New backend slot ${NEW_SLOT} failed health check after ${attempt} attempts." >&2
              docker logs "${NEW_SLOT}" || true
              docker rm -f "${NEW_SLOT}" >/dev/null 2>&1 || true
              exit 1
            fi
            sleep 2
          done

          SSL_CERTIFICATE="/etc/letsencrypt/live/${BACKEND_DOMAIN}/fullchain.pem"
          SSL_CERTIFICATE_KEY="/etc/letsencrypt/live/${BACKEND_DOMAIN}/privkey.pem"
          if ! test -s "letsencrypt/live/${BACKEND_DOMAIN}/fullchain.pem"; then
            if ! docker run --rm \
              -p 80:80 \
              -v "$PWD/letsencrypt:/etc/letsencrypt" \
              certbot/certbot:v2.11.0 certonly \
              --standalone \
              --preferred-challenges http-01 \
              -d "${BACKEND_DOMAIN}" \
              --agree-tos \
              --non-interactive \
              --register-unsafely-without-email; then
              echo "Let's Encrypt certificate issuance failed. Falling back to a temporary self-signed certificate." >&2
            fi
          else
            docker run --rm \
              -p 80:80 \
              -v "$PWD/letsencrypt:/etc/letsencrypt" \
              certbot/certbot:v2.11.0 renew \
              --standalone \
              --preferred-challenges http-01 \
              --quiet || true
          fi

          if ! test -s "letsencrypt/live/${BACKEND_DOMAIN}/fullchain.pem"; then
            openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
              -keyout nginx/certs/server.key \
              -out nginx/certs/server.crt \
              -subj "/CN=${BACKEND_DOMAIN}" \
              -addext "subjectAltName=DNS:${BACKEND_DOMAIN}"
            chmod 600 nginx/certs/server.key
            SSL_CERTIFICATE="/etc/nginx/certs/server.crt"
            SSL_CERTIFICATE_KEY="/etc/nginx/certs/server.key"
          fi

          COORDINATOR_SSL_CERTIFICATE="/etc/letsencrypt/live/${COORDINATOR_DOMAIN}/fullchain.pem"
          COORDINATOR_SSL_CERTIFICATE_KEY="/etc/letsencrypt/live/${COORDINATOR_DOMAIN}/privkey.pem"
          if ! test -s "letsencrypt/live/${COORDINATOR_DOMAIN}/fullchain.pem"; then
            if ! docker run --rm \
              -p 80:80 \
              -v "$PWD/letsencrypt:/etc/letsencrypt" \
              certbot/certbot:v2.11.0 certonly \
              --standalone \
              --preferred-challenges http-01 \
              -d "${COORDINATOR_DOMAIN}" \
              --agree-tos \
              --non-interactive \
              --register-unsafely-without-email; then
              echo "Let's Encrypt certificate issuance failed for ${COORDINATOR_DOMAIN}. Falling back to a temporary self-signed certificate." >&2
            fi
          fi

          if ! test -s "letsencrypt/live/${COORDINATOR_DOMAIN}/fullchain.pem"; then
            openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
              -keyout nginx/certs/coordinator.key \
              -out nginx/certs/coordinator.crt \
              -subj "/CN=${COORDINATOR_DOMAIN}" \
              -addext "subjectAltName=DNS:${COORDINATOR_DOMAIN}"
            chmod 600 nginx/certs/coordinator.key
            COORDINATOR_SSL_CERTIFICATE="/etc/nginx/certs/coordinator.crt"
            COORDINATOR_SSL_CERTIFICATE_KEY="/etc/nginx/certs/coordinator.key"
          fi

          MONITOR_DOMAIN="monitor.ghkdqhrbals.org"
          MONITOR_SERVER_BLOCK=""
          if test -s "letsencrypt/live/${MONITOR_DOMAIN}/fullchain.pem" \
            && test -s "letsencrypt/live/${MONITOR_DOMAIN}/privkey.pem"; then
            MONITOR_SERVER_BLOCK="$(cat <<MONITOR_NGINX

            server {
              listen 443 ssl;
              http2 on;
              server_name ${MONITOR_DOMAIN};

              ssl_certificate /etc/letsencrypt/live/${MONITOR_DOMAIN}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${MONITOR_DOMAIN}/privkey.pem;

              add_header Strict-Transport-Security "max-age=0" always;

              client_max_body_size 1m;

              location /coord/ {
                set \$rsc_coordinator http://rsc-coordinator:8080;
                proxy_pass \$rsc_coordinator;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }

              location / {
                set \$rsc_grafana http://rsc-grafana:3000;
                proxy_pass \$rsc_grafana;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection \$connection_upgrade;
              }
            }
          MONITOR_NGINX
          )"
          fi

          COORDINATOR_DOMAIN="coordinator.ghkdqhrbals.org"
          COORDINATOR_SERVER_BLOCK=""
          if test -s "letsencrypt/live/${COORDINATOR_DOMAIN}/fullchain.pem" \
            && test -s "letsencrypt/live/${COORDINATOR_DOMAIN}/privkey.pem"; then
            COORDINATOR_SERVER_BLOCK="$(cat <<COORDINATOR_NGINX

            server {
              listen 443 ssl;
              http2 on;
              server_name ${COORDINATOR_DOMAIN};

              ssl_certificate /etc/letsencrypt/live/${COORDINATOR_DOMAIN}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${COORDINATOR_DOMAIN}/privkey.pem;

              client_max_body_size 1m;

              location / {
                set \$rsc_coordinator http://rsc-coordinator:8080;
                proxy_pass \$rsc_coordinator;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }
            }
          COORDINATOR_NGINX
          )"
          fi

          write_nginx_config() {
            local backend_slot="$1"
            cat > nginx/nginx.conf <<NGINX
          events {}

          http {
            resolver 127.0.0.11 valid=30s ipv6=off;

            map \$http_upgrade \$connection_upgrade {
              default upgrade;
              "" close;
            }

            server {
              listen 443 ssl;
              http2 on;
              server_name ${BACKEND_DOMAIN};

              ssl_certificate ${SSL_CERTIFICATE};
              ssl_certificate_key ${SSL_CERTIFICATE_KEY};

              client_max_body_size 1m;

              location /coord/ {
                set \$rsc_coordinator http://rsc-coordinator:8080;
                proxy_pass \$rsc_coordinator;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }

              location /actuator/ {
                set \$rsc_coordinator http://rsc-coordinator:8080;
                proxy_pass \$rsc_coordinator;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }

              location / {
                set \$backend http://${backend_slot}:8080;
                proxy_pass \$backend;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }
            }

            server {
              listen 443 ssl;
              http2 on;
              server_name ${COORDINATOR_DOMAIN};

              ssl_certificate ${COORDINATOR_SSL_CERTIFICATE};
              ssl_certificate_key ${COORDINATOR_SSL_CERTIFICATE_KEY};

              client_max_body_size 1m;

              location /coord/ {
                set \$rsc_coordinator http://rsc-coordinator:8080;
                proxy_pass \$rsc_coordinator;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }

              location /actuator/ {
                set \$rsc_coordinator http://rsc-coordinator:8080;
                proxy_pass \$rsc_coordinator;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }

              location / {
                return 404;
              }
            }
          ${MONITOR_SERVER_BLOCK}
          ${COORDINATOR_SERVER_BLOCK}
          }
          NGINX
          }

          write_nginx_config "${NEW_SLOT}"

          if docker inspect buddystuddy-nginx >/dev/null 2>&1; then
            docker start buddystuddy-nginx >/dev/null 2>&1 || true
            docker network connect buddystuddy-net buddystuddy-nginx >/dev/null 2>&1 || true
            docker exec buddystuddy-nginx nginx -t
            docker exec buddystuddy-nginx nginx -s reload
          else
            docker run -d \
              --name buddystuddy-nginx \
              --network buddystuddy-net \
              --restart unless-stopped \
              -p 443:443 \
              -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
              -v "$PWD/letsencrypt:/etc/letsencrypt:ro" \
              nginx:1.27-alpine
          fi
          if docker network inspect redis-stream-coordinator-net >/dev/null 2>&1; then
            docker network connect redis-stream-coordinator-net buddystuddy-nginx >/dev/null 2>&1 || true
          fi

          for attempt in $(seq 1 30); do
            if docker run --rm \
              --network buddystuddy-net \
              curlimages/curl:8.11.0 \
              -fsS "http://${NEW_SLOT}:8080/health"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend container health check failed after ${attempt} attempts." >&2
              docker logs "${NEW_SLOT}" || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl -kfsS https://127.0.0.1/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend health check failed after ${attempt} attempts." >&2
              docker logs "${NEW_SLOT}" || true
              docker logs buddystuddy-nginx || true
              if [ -n "${OLD_SLOT}" ]; then
                echo "Rolling Nginx back to ${OLD_SLOT}." >&2
                write_nginx_config "${OLD_SLOT}"
                docker exec buddystuddy-nginx nginx -t || true
                docker exec buddystuddy-nginx nginx -s reload || true
              fi
              exit 1
            fi
            sleep 2
          done

          printf '%s' "${NEW_SLOT}" > .active_backend_slot
          if [ -n "${OLD_SLOT}" ] && [ "${OLD_SLOT}" != "${NEW_SLOT}" ]; then
            docker stop --time 30 "${OLD_SLOT}" >/dev/null 2>&1 || true
            docker rm "${OLD_SLOT}" >/dev/null 2>&1 || true
          fi
          docker image prune -f
