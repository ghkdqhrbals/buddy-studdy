name: Deploy BuddyStudy Monitoring

on:
  workflow_dispatch:

concurrency:
  group: deploy-monitoring
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Loki Promtail Grafana
    runs-on: [self-hosted, Linux, ARM64, ec2, rsc-deploy]
    timeout-minutes: 15
    env:
      MONITOR_DOMAIN: monitor.ghkdqhrbals.org
      DASHBOARD_SOURCE_BASE: https://raw.githubusercontent.com/ghkdqhrbals/study-mate/main/docs/observability

    steps:
      - name: Deploy monitoring stack
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "Missing GRAFANA_ADMIN_PASSWORD secret." >&2
            exit 1
          fi

          monitoring_root="/opt/redis-stream-coordinator"
          render_root="${RUNNER_TEMP:-/tmp}/buddystuddy-monitoring-render"
          rm -rf "${render_root}"

          mkdir -p \
            "${render_root}/grafana/provisioning/datasources" \
            "${render_root}/grafana/provisioning/dashboards" \
            "${render_root}/grafana/dashboards" \
            "${render_root}/loki" \
            "${render_root}/promtail"
          cd "${render_root}"

          cat > grafana/provisioning/datasources/loki.yml <<'YAML'
          apiVersion: 1

          datasources:
            - name: BuddyStudy Loki
              uid: buddystuddy-loki
              type: loki
              access: proxy
              url: http://rsc-loki:3100
              isDefault: false
              editable: true
          YAML

          cat > grafana/provisioning/dashboards/dashboards.yml <<'YAML'
          apiVersion: 1

          providers:
            - name: BuddyStudy
              orgId: 1
              folder: BuddyStudy
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards
          YAML

          curl -fsSL \
            "${DASHBOARD_SOURCE_BASE}/grafana-loki-search-dashboard.json" \
            -o grafana/dashboards/grafana-loki-search-dashboard.json
          curl -fsSL \
            "${DASHBOARD_SOURCE_BASE}/grafana-api-latency-dashboard.json" \
            -o grafana/dashboards/grafana-api-latency-dashboard.json

          cat > loki/loki.yml <<'YAML'
          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory

          query_range:
            results_cache:
              cache:
                embedded_cache:
                  enabled: true
                  max_size_mb: 100

          schema_config:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            retention_period: 168h
            allow_structured_metadata: false

          compactor:
            working_directory: /loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
          YAML

          cat > promtail/promtail.yml <<'YAML'
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /tmp/positions.yaml

          clients:
            - url: http://rsc-loki:3100/loki/api/v1/push

          scrape_configs:
            - job_name: docker
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 15s
              relabel_configs:
                - source_labels: ['__meta_docker_container_name']
                  regex: '/(.*)'
                  target_label: container
                - source_labels: ['__meta_docker_container_log_stream']
                  target_label: stream
                - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
                  target_label: compose_service
                - source_labels: ['__meta_docker_container_name']
                  regex: '/(buddystuddy-.*|rsc-.*)'
                  action: keep
          YAML

          docker pull alpine:3.20
          docker run --rm \
            -v "${monitoring_root}:/target" \
            -v "${render_root}:/source:ro" \
            alpine:3.20 \
            sh -c 'mkdir -p /target/grafana /target/loki /target/promtail && cp -R /source/grafana/provisioning /target/grafana/ && cp -R /source/grafana/dashboards /target/grafana/ && cp /source/loki/loki.yml /target/loki/loki.yml && cp /source/promtail/promtail.yml /target/promtail/promtail.yml'

          docker network create buddystuddy-net >/dev/null 2>&1 || true
          docker network create redis-stream-coordinator-net >/dev/null 2>&1 || true
          docker volume create rsc-loki-data >/dev/null
          docker volume create rsc-grafana-data >/dev/null

          docker pull grafana/loki:3.3.2
          docker pull grafana/promtail:3.3.2
          docker pull grafana/grafana:11.4.0

          docker rm -f \
            rsc-prometheus \
            redis-exporter-6379 \
            redis-exporter-6380 \
            redis-exporter-6381 \
            buddystuddy-loki \
            buddystuddy-promtail \
            >/dev/null 2>&1 || true

          docker rm -f rsc-loki rsc-promtail rsc-grafana >/dev/null 2>&1 || true

          docker run -d \
            --name rsc-loki \
            --network redis-stream-coordinator-net \
            --restart unless-stopped \
            -v rsc-loki-data:/loki \
            -v "${monitoring_root}/loki/loki.yml:/etc/loki/local-config.yaml:ro" \
            grafana/loki:3.3.2 \
            -config.file=/etc/loki/local-config.yaml

          docker run -d \
            --name rsc-promtail \
            --network redis-stream-coordinator-net \
            --restart unless-stopped \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "${monitoring_root}/promtail/promtail.yml:/etc/promtail/config.yml:ro" \
            grafana/promtail:3.3.2 \
            -config.file=/etc/promtail/config.yml

          docker run -d \
            --name rsc-grafana \
            --network redis-stream-coordinator-net \
            --restart unless-stopped \
            -e GF_SECURITY_ADMIN_USER=admin \
            -e GF_SECURITY_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD}" \
            -e GF_USERS_ALLOW_SIGN_UP=false \
            -e GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/grafana-loki-search-dashboard.json \
            -v rsc-grafana-data:/var/lib/grafana \
            -v "${monitoring_root}/grafana/provisioning:/etc/grafana/provisioning:ro" \
            -v "${monitoring_root}/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            grafana/grafana:11.4.0

          docker network connect buddystuddy-net rsc-grafana >/dev/null 2>&1 || true
          docker network connect redis-stream-coordinator-net buddystuddy-nginx >/dev/null 2>&1 || true

          for attempt in $(seq 1 30); do
            if docker exec rsc-grafana wget -qO- http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Grafana did not become healthy." >&2
              docker logs rsc-grafana || true
              exit 1
            fi
            sleep 2
          done

          echo "Monitoring stack is running. Open https://${MONITOR_DOMAIN}/"
