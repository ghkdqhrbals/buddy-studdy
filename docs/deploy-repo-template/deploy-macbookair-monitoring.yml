name: Deploy BuddyStudy Monitoring on MacBook Air

on:
  repository_dispatch:
    types: [monitoring-source-published]
  workflow_dispatch:

concurrency:
  group: deploy-macbookair-monitoring
  cancel-in-progress: false

jobs:
  deploy_monitoring:
    name: Deploy Monitoring Module
    runs-on: [self-hosted, macOS, ARM64, macbook-air, buddystudy]
    timeout-minutes: 20
    env:
      MONITORING_ROOT: ${{ vars.MACBOOKAIR_MONITORING_ROOT || '$HOME/buddystudy/monitoring' }}
      MONITORING_SOURCE_DIR: ${{ github.workspace }}/buddy-studdy-source/monitoring
      API_DASHBOARD_PORT: ${{ vars.API_DASHBOARD_PORT || '3000' }}
      GRAFANA_PORT: ${{ vars.GRAFANA_PORT || '3001' }}
      LOKI_PORT: ${{ vars.LOKI_PORT || '3100' }}
      REDISSTREAMSCOPE_PORT: ${{ vars.REDISSTREAMSCOPE_PORT || '3002' }}

    steps:
      - name: Checkout BuddyStudy monitoring config
        uses: actions/checkout@v4
        with:
          repository: ghkdqhrbals/buddy-studdy
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: buddy-studdy-source

      - name: Deploy monitoring module
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_SLACK_WEBHOOK_URL: ${{ secrets.GRAFANA_SLACK_WEBHOOK_URL }}
          GRAFANA_INCIDENT_HMAC_SECRET: ${{ secrets.GRAFANA_INCIDENT_HMAC_SECRET }}
          CODEX_AUTOFIX_GITHUB_TOKEN: ${{ secrets.CODEX_AUTOFIX_GITHUB_TOKEN }}
          LEGACY_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TESTZONE_ROOT: ${{ vars.MACBOOKAIR_TESTZONE_ROOT || '$HOME/buddystudy/monitoring/testzone' }}
          TESTZONE_INFLUX_ORG: ${{ vars.TESTZONE_INFLUX_ORG || 'buddystudy' }}
          TESTZONE_INFLUX_BUCKET: ${{ vars.TESTZONE_INFLUX_BUCKET || 'testzone' }}
        run: |
          set -euo pipefail

          if [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "Missing GitHub Actions secret: GRAFANA_ADMIN_PASSWORD" >&2
            exit 1
          fi
          GRAFANA_SLACK_WEBHOOK_URL="${GRAFANA_SLACK_WEBHOOK_URL:-${LEGACY_SLACK_WEBHOOK_URL:-}}"
          if [ -z "${GRAFANA_SLACK_WEBHOOK_URL}" ]; then
            echo "Missing GitHub Actions secret: GRAFANA_SLACK_WEBHOOK_URL (or legacy SLACK_WEBHOOK_URL)" >&2
            exit 1
          fi
          for required_secret in GRAFANA_INCIDENT_HMAC_SECRET CODEX_AUTOFIX_GITHUB_TOKEN; do
            if [ -z "${!required_secret:-}" ]; then
              echo "Missing GitHub Actions secret: ${required_secret}" >&2
              exit 1
            fi
          done

          monitoring_root="$(eval echo "${MONITORING_ROOT}")"
          testzone_root="$(eval echo "${TESTZONE_ROOT}")"
          if [ ! -s "${testzone_root}/.influx_token" ]; then
            echo "TestZone InfluxDB token is not initialized. Deploy TestZone first." >&2
            exit 1
          fi
          TESTZONE_INFLUX_TOKEN="$(cat "${testzone_root}/.influx_token")"

          run_with_timeout() {
            local seconds="$1"
            shift
            python3 - "${seconds}" "$@" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          timeout_seconds = float(sys.argv[1])
          process = subprocess.Popen(sys.argv[2:], start_new_session=True)
          try:
              return_code = process.wait(timeout=timeout_seconds)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              raise SystemExit(124)
          raise SystemExit(return_code if return_code >= 0 else 128 - return_code)
          PY
          }

          export DOCKER_CLI_HINTS=false
          docker_ready=false
          if run_with_timeout 10 docker info >/dev/null 2>&1; then
            docker_ready=true
          else
            echo "Docker daemon is unavailable; restarting Docker Desktop."
            if ! run_with_timeout 90 docker desktop restart --timeout 75; then
              run_with_timeout 45 docker desktop stop --force --timeout 30 || true
              run_with_timeout 120 docker desktop start --timeout 105 \
                || open -ga Docker \
                || true
            fi
            for _ in $(seq 1 24); do
              if run_with_timeout 10 docker info >/dev/null 2>&1; then
                docker_ready=true
                break
              fi
              sleep 5
            done
          fi
          if [ "${docker_ready}" != true ]; then
            echo "Docker Desktop did not become ready within the deployment window." >&2
            exit 1
          fi

          mkdir -p \
            "${monitoring_root}/api-dashboard/public" \
            "${monitoring_root}/api-dashboard/logs" \
            "${monitoring_root}/incident-receiver/src" \
            "${monitoring_root}/incident-receiver/data" \
            "${monitoring_root}/grafana/provisioning/datasources" \
            "${monitoring_root}/grafana/provisioning/dashboards" \
            "${monitoring_root}/grafana/provisioning/plugins" \
            "${monitoring_root}/grafana/provisioning/alerting" \
            "${monitoring_root}/grafana/dashboards" \
            "${monitoring_root}/grafana/data" \
            "${monitoring_root}/loki/data" \
            "${monitoring_root}/loki/config" \
            "${monitoring_root}/promtail/config" \
            "${monitoring_root}/promtail/data" \
            "${monitoring_root}/gateway"

          file_differs() {
            [ ! -f "$2" ] || ! cmp -s "$1" "$2"
          }

          loki_config_changed=false
          grafana_config_changed=false
          grafana_gateway_config_changed=false
          api_dashboard_config_changed=false
          incident_receiver_config_changed=false
          promtail_config_changed=false
          api_dashboard_config_hash="$(shasum -a 256 "${MONITORING_SOURCE_DIR}/api-dashboard/nginx.conf" | awk '{print $1}')"
          api_dashboard_revision_file="${monitoring_root}/api-dashboard/.nginx-config.sha256"

          if file_differs \
            "${MONITORING_SOURCE_DIR}/loki/config/loki.yml" \
            "${monitoring_root}/loki/config/loki.yml"; then
            loki_config_changed=true
          fi
          if file_differs \
              "${MONITORING_SOURCE_DIR}/grafana/provisioning/datasources/loki.yml" \
              "${monitoring_root}/grafana/provisioning/datasources/loki.yml" \
            || file_differs \
              "${MONITORING_SOURCE_DIR}/grafana/provisioning/datasources/testzone-influx.yml" \
              "${monitoring_root}/grafana/provisioning/datasources/testzone-influx.yml" \
            || file_differs \
              "${MONITORING_SOURCE_DIR}/grafana/provisioning/dashboards/dashboards.yml" \
              "${monitoring_root}/grafana/provisioning/dashboards/dashboards.yml" \
            || ! diff -qr \
              "${MONITORING_SOURCE_DIR}/grafana/provisioning/alerting" \
              "${monitoring_root}/grafana/provisioning/alerting" >/dev/null 2>&1; then
            grafana_config_changed=true
          fi
          if file_differs \
            "${MONITORING_SOURCE_DIR}/grafana-gateway/nginx.conf" \
            "${monitoring_root}/gateway/grafana-nginx.conf"; then
            grafana_gateway_config_changed=true
          fi
          if file_differs \
            "${MONITORING_SOURCE_DIR}/api-dashboard/nginx.conf" \
            "${monitoring_root}/api-dashboard/nginx.conf" \
            || ! grep -Fxq "${api_dashboard_config_hash}" \
              "${api_dashboard_revision_file}" 2>/dev/null; then
            api_dashboard_config_changed=true
          fi
          if ! diff -qr \
            "${MONITORING_SOURCE_DIR}/incident-receiver/src" \
            "${monitoring_root}/incident-receiver/src" >/dev/null 2>&1; then
            incident_receiver_config_changed=true
          fi

          hmac_secret_hash="$(printf '%s' "${GRAFANA_INCIDENT_HMAC_SECRET}" | shasum -a 256 | awk '{print $1}')"
          github_token_hash="$(printf '%s' "${CODEX_AUTOFIX_GITHUB_TOKEN}" | shasum -a 256 | awk '{print $1}')"
          previous_hmac_secret_hash="$(cat "${monitoring_root}/incident-receiver/hmac-secret.sha256" 2>/dev/null || true)"
          previous_github_token_hash="$(cat "${monitoring_root}/incident-receiver/github-token.sha256" 2>/dev/null || true)"
          if [ "${hmac_secret_hash}" != "${previous_hmac_secret_hash}" ]; then
            grafana_config_changed=true
            incident_receiver_config_changed=true
          fi
          if [ "${github_token_hash}" != "${previous_github_token_hash}" ]; then
            incident_receiver_config_changed=true
          fi
          if file_differs \
            "${MONITORING_SOURCE_DIR}/promtail/config/promtail.yml" \
            "${monitoring_root}/promtail/config/promtail.yml"; then
            promtail_config_changed=true
          fi

          find "${monitoring_root}/grafana/provisioning/datasources" -maxdepth 1 -type f -name '*.yml' -delete
          cp "${MONITORING_SOURCE_DIR}/grafana/provisioning/datasources/"*.yml \
            "${monitoring_root}/grafana/provisioning/datasources/"
          cp "${MONITORING_SOURCE_DIR}/grafana/provisioning/dashboards/dashboards.yml" \
            "${monitoring_root}/grafana/provisioning/dashboards/dashboards.yml"
          find "${monitoring_root}/grafana/provisioning/alerting" -maxdepth 1 -type f -name '*.yml' -delete
          cp "${MONITORING_SOURCE_DIR}/grafana/provisioning/alerting/"*.yml \
            "${monitoring_root}/grafana/provisioning/alerting/"
          for source_dashboard in "${MONITORING_SOURCE_DIR}/grafana/dashboards/"*.json; do
            dashboard_name="$(basename "${source_dashboard}")"
            dashboard_target="${monitoring_root}/grafana/dashboards/${dashboard_name}"
            dashboard_temp="${dashboard_target}.tmp"
            cp "${source_dashboard}" "${dashboard_temp}"
            mv -f "${dashboard_temp}" "${dashboard_target}"
          done
          for deployed_dashboard in "${monitoring_root}/grafana/dashboards/"*.json; do
            dashboard_name="$(basename "${deployed_dashboard}")"
            if [ ! -f "${MONITORING_SOURCE_DIR}/grafana/dashboards/${dashboard_name}" ]; then
              rm -f "${deployed_dashboard}"
            fi
          done
          cp "${MONITORING_SOURCE_DIR}/loki/config/loki.yml" \
            "${monitoring_root}/loki/config/loki.yml"
          cp -R "${MONITORING_SOURCE_DIR}/api-dashboard/public/." \
            "${monitoring_root}/api-dashboard/public/"
          cp "${MONITORING_SOURCE_DIR}/api-dashboard/nginx.conf" \
            "${monitoring_root}/api-dashboard/nginx.conf"
          find "${monitoring_root}/incident-receiver/src" -mindepth 1 -delete
          cp -R "${MONITORING_SOURCE_DIR}/incident-receiver/src/." \
            "${monitoring_root}/incident-receiver/src/"
          cp "${MONITORING_SOURCE_DIR}/promtail/config/promtail.yml" \
            "${monitoring_root}/promtail/config/promtail.yml"
          cp "${MONITORING_SOURCE_DIR}/grafana-gateway/nginx.conf" \
            "${monitoring_root}/gateway/grafana-nginx.conf"

          grep -q 'X-Forwarded-Proto \$public_forwarded_proto' \
            "${monitoring_root}/api-dashboard/nginx.conf"
          grep -q 'proxy_set_header Host grafana.lowfidev.cloud;' \
            "${monitoring_root}/gateway/grafana-nginx.conf"
          grep -q 'proxy_set_header X-Forwarded-Proto https;' \
            "${monitoring_root}/gateway/grafana-nginx.conf"
          grep -q 'monitoring_access' \
            "${monitoring_root}/api-dashboard/nginx.conf"
          grep -q 'job: monitoring-access' \
            "${monitoring_root}/promtail/config/promtail.yml"
          grep -Fq '<{{ .Annotations.logs_url }}|오류 로그 보기>' \
            "${monitoring_root}/grafana/provisioning/alerting/backend-errors.yml"
          grep -Fq '{{ $requestID := index .Labels "request_id" }}' \
            "${monitoring_root}/grafana/provisioning/alerting/backend-errors.yml"
          grep -Fq '<{{ .GeneratorURL }}|알림 규칙 진단 보기>' \
            "${monitoring_root}/grafana/provisioning/alerting/backend-errors.yml"
          grep -Fq '| occurred_at!="" | logger!="" | error_message!=""' \
            "${monitoring_root}/grafana/provisioning/alerting/backend-errors.yml"
          grep -Fq 'http://buddystudy-incident-receiver:3030/internal/incidents/grafana' \
            "${monitoring_root}/grafana/provisioning/alerting/backend-errors.yml"
          grep -Fq 'timestampHeader: X-Grafana-Alerting-Timestamp' \
            "${monitoring_root}/grafana/provisioning/alerting/backend-errors.yml"

          run_with_timeout 30 docker network create buddystudy-monitoring >/dev/null 2>&1 || true

          docker_config_backup=""
          if [ -f "${HOME}/.docker/config.json" ] && grep -q '"credsStore"[[:space:]]*:' "${HOME}/.docker/config.json"; then
            docker_config_backup="$(mktemp)"
            cp "${HOME}/.docker/config.json" "${docker_config_backup}"
            python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path.home() / ".docker/config.json"
          data = json.loads(path.read_text())
          data.pop("credsStore", None)
          path.write_text(json.dumps(data, indent=2))
          PY
          fi
          run_with_timeout 300 docker pull nginx:1.27-alpine
          run_with_timeout 300 docker pull node:22-alpine
          run_with_timeout 300 docker pull grafana/loki:3.3.2
          run_with_timeout 300 docker pull grafana/promtail:3.3.2
          run_with_timeout 300 docker pull grafana/grafana:12.3.0
          if [ -n "${docker_config_backup}" ]; then
            cp "${docker_config_backup}" "${HOME}/.docker/config.json"
          fi

          grafana_volume="buddystudy-grafana-data"
          docker volume create "${grafana_volume}" >/dev/null
          if [ -z "$(docker run --rm \
            -v "${grafana_volume}:/target" \
            nginx:1.27-alpine \
            sh -c 'find /target -mindepth 1 -maxdepth 1 -print -quit')" ]; then
            docker run --rm \
              --user 0 \
              -v "${monitoring_root}/grafana/data:/source:ro" \
              -v "${grafana_volume}:/target" \
              nginx:1.27-alpine \
              sh -c 'cp -a /source/. /target/'
          fi
          docker run --rm \
            --user 0 \
            -v "${grafana_volume}:/var/lib/grafana" \
            nginx:1.27-alpine \
            sh -c 'chown -R 472:0 /var/lib/grafana && if [ -f /var/lib/grafana/grafana.db ]; then chmod 0640 /var/lib/grafana/grafana.db; fi'

          container_running() {
            [ "$(docker inspect --format '{{.State.Running}}' "$1" 2>/dev/null || true)" = "true" ]
          }

          if ! container_running buddystudy-loki || [ "${loki_config_changed}" = "true" ]; then
            docker rm -f buddystudy-loki >/dev/null 2>&1 || true
            docker run -d \
              --name buddystudy-loki \
              --network buddystudy-monitoring \
              --restart unless-stopped \
              -p "127.0.0.1:${LOKI_PORT}:3100" \
              -v "${monitoring_root}/loki/data:/loki" \
              -v "${monitoring_root}/loki/config/loki.yml:/etc/loki/local-config.yaml:ro" \
              grafana/loki:3.3.2 \
              -config.file=/etc/loki/local-config.yaml
          fi

          if ! container_running buddystudy-incident-receiver \
            || [ "${incident_receiver_config_changed}" = "true" ]; then
            docker rm -f buddystudy-incident-receiver >/dev/null 2>&1 || true
            docker run -d \
              --name buddystudy-incident-receiver \
              --network buddystudy-monitoring \
              --restart unless-stopped \
              --read-only \
              --tmpfs /tmp \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -e INCIDENT_RECEIVER_PORT=3030 \
              -e INCIDENT_DATA_DIR=/data \
              -e GRAFANA_INCIDENT_HMAC_SECRET="${GRAFANA_INCIDENT_HMAC_SECRET}" \
              -e CODEX_AUTOFIX_GITHUB_TOKEN="${CODEX_AUTOFIX_GITHUB_TOKEN}" \
              -e GITHUB_AUTOFIX_REPOSITORY=ghkdqhrbals/buddy-studdy \
              -e GITHUB_AUTOFIX_EVENT_TYPE=codex-incident-autofix \
              -e LOKI_BASE_URL=http://buddystudy-loki:3100 \
              -e DEPLOYMENT_HISTORY_URL=http://buddystudy-testzone-service:3020 \
              -v "${monitoring_root}/incident-receiver/src:/app/src:ro" \
              -v "${monitoring_root}/incident-receiver/data:/data" \
              node:22-alpine \
              node /app/src/server.mjs
          fi
          printf '%s' "${hmac_secret_hash}" \
            > "${monitoring_root}/incident-receiver/hmac-secret.sha256"
          printf '%s' "${github_token_hash}" \
            > "${monitoring_root}/incident-receiver/github-token.sha256"
          chmod 0600 \
            "${monitoring_root}/incident-receiver/hmac-secret.sha256" \
            "${monitoring_root}/incident-receiver/github-token.sha256"

          if ! container_running buddystudy-grafana || [ "${grafana_config_changed}" = "true" ]; then
            docker rm -f buddystudy-grafana >/dev/null 2>&1 || true
            docker run -d \
              --name buddystudy-grafana \
              --network buddystudy-monitoring \
              --restart unless-stopped \
              -e GF_SECURITY_ADMIN_USER=admin \
              -e GF_SECURITY_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD}" \
              -e GF_USERS_ALLOW_SIGN_UP=false \
              -e GF_AUTH_ANONYMOUS_ENABLED=false \
              -e GF_SERVER_ROOT_URL=https://grafana.lowfidev.cloud/ \
              -e GF_SERVER_SERVE_FROM_SUB_PATH=false \
              -e GF_LIVE_ALLOWED_ORIGINS=https://grafana.lowfidev.cloud \
              -e TESTZONE_INFLUX_TOKEN="${TESTZONE_INFLUX_TOKEN}" \
              -e TESTZONE_INFLUX_ORG="${TESTZONE_INFLUX_ORG}" \
              -e TESTZONE_INFLUX_BUCKET="${TESTZONE_INFLUX_BUCKET}" \
              -e GRAFANA_SLACK_WEBHOOK_URL="${GRAFANA_SLACK_WEBHOOK_URL}" \
              -e GRAFANA_INCIDENT_HMAC_SECRET="${GRAFANA_INCIDENT_HMAC_SECRET}" \
              -v "${grafana_volume}:/var/lib/grafana" \
              -v "${monitoring_root}/grafana/provisioning:/etc/grafana/provisioning:ro" \
              -v "${monitoring_root}/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
              grafana/grafana:12.3.0
          fi

          grafana_password_reset=false
          for attempt in $(seq 1 15); do
            if docker exec buddystudy-grafana \
              grafana cli \
              --homepath /usr/share/grafana \
              admin reset-admin-password "${GRAFANA_ADMIN_PASSWORD}"; then
              grafana_password_reset=true
              break
            fi
            sleep 2
          done
          if [ "${grafana_password_reset}" != "true" ]; then
            echo "Failed to synchronize the Grafana admin password." >&2
            exit 1
          fi

          if ! container_running buddystudy-grafana-gateway \
            || [ "${grafana_gateway_config_changed}" = "true" ]; then
            docker rm -f buddystudy-grafana-gateway >/dev/null 2>&1 || true
            docker run -d \
              --name buddystudy-grafana-gateway \
              --network buddystudy-monitoring \
              --restart unless-stopped \
              -p "127.0.0.1:${GRAFANA_PORT}:80" \
              -v "${monitoring_root}/gateway/grafana-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine
          fi

          # Maintenance is published exclusively through backend-managed
          # Firebase Remote Config. Remove the retired local status server
          # while preserving its on-disk data for manual recovery.
          docker rm -f buddystudy-service-status >/dev/null 2>&1 || true

          if ! container_running buddystudy-api-dashboard \
            || [ "${api_dashboard_config_changed}" = "true" ]; then
            run_with_timeout 30 docker run --rm \
              -v "${monitoring_root}/api-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine \
              nginx -t
            docker rm -f buddystudy-api-dashboard >/dev/null 2>&1 || true
            docker run -d \
              --name buddystudy-api-dashboard \
              --network buddystudy-monitoring \
              --restart unless-stopped \
              -p "127.0.0.1:${API_DASHBOARD_PORT}:80" \
              -p "127.0.0.1:${REDISSTREAMSCOPE_PORT}:8082" \
              -v "${monitoring_root}/api-dashboard/public:/usr/share/nginx/html:ro" \
              -v "${monitoring_root}/api-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "${monitoring_root}/api-dashboard/logs:/var/log/nginx" \
              nginx:1.27-alpine
          fi
          api_dashboard_revision_temp="${api_dashboard_revision_file}.tmp"
          printf '%s\n' "${api_dashboard_config_hash}" > "${api_dashboard_revision_temp}"
          mv -f "${api_dashboard_revision_temp}" "${api_dashboard_revision_file}"

          if ! container_running buddystudy-monitoring-promtail \
            || [ "${promtail_config_changed}" = "true" ]; then
            docker rm -f buddystudy-monitoring-promtail >/dev/null 2>&1 || true
            docker run -d \
              --name buddystudy-monitoring-promtail \
              --network buddystudy-monitoring \
              --restart unless-stopped \
              -v "${monitoring_root}/api-dashboard/logs:/var/log/monitoring:ro" \
              -v "${monitoring_root}/promtail/config/promtail.yml:/etc/promtail/config.yml:ro" \
              -v "${monitoring_root}/promtail/data:/var/lib/promtail" \
              grafana/promtail:3.3.2 \
              -config.file=/etc/promtail/config.yml
          fi

          sleep 2
          echo "Grafana startup log:"
          docker logs --tail 80 buddystudy-grafana || true
          echo "Grafana gateway startup log:"
          docker logs --tail 80 buddystudy-grafana-gateway || true
          echo "Monitoring gateway startup log:"
          docker logs --tail 80 buddystudy-api-dashboard || true
          echo "Monitoring access collector startup log:"
          docker logs --tail 80 buddystudy-monitoring-promtail || true
          echo "Incident receiver startup log:"
          docker logs --tail 80 buddystudy-incident-receiver || true

          echo "MacBook Air monitoring module is running."
          echo "Restarted components: loki=${loki_config_changed}, grafana=${grafana_config_changed}, grafana_gateway=${grafana_gateway_config_changed}, api_dashboard=${api_dashboard_config_changed}, incident_receiver=${incident_receiver_config_changed}, promtail=${promtail_config_changed}"
          echo "API Logs: http://127.0.0.1:${API_DASHBOARD_PORT}"
          echo "TestZone: http://127.0.0.1:${API_DASHBOARD_PORT}/testzone.html"
          echo "Grafana: http://127.0.0.1:${GRAFANA_PORT}/"
          echo "Loki push: http://127.0.0.1:${LOKI_PORT}/loki/api/v1/push"
