name: Deploy BuddyStudy Monitoring Routes on MacBook Air

on:
  workflow_dispatch:

concurrency:
  group: deploy-macbookair-monitoring-routing
  cancel-in-progress: false

jobs:
  deploy_monitoring_routing:
    name: Deploy Monitoring Routing Module
    runs-on: [self-hosted, macOS, ARM64, macbook-air, buddystudy]
    timeout-minutes: 5
    env:
      API_DASHBOARD_PORT: ${{ vars.API_DASHBOARD_PORT || '3000' }}
      GRAFANA_PORT: ${{ vars.GRAFANA_PORT || '3001' }}

    steps:
      - name: Configure Routingflare routes
        run: |
          set -euo pipefail

          routingflare_bin="$(command -v routingflare || true)"
          for candidate in \
            "/Applications/routingflare.app/Contents/MacOS/routingflare" \
            "${HOME}/Applications/routingflare.app/Contents/MacOS/routingflare"; do
            if [ -z "${routingflare_bin}" ] && [ -x "${candidate}" ]; then
              routingflare_bin="${candidate}"
            fi
          done
          if [ -z "${routingflare_bin}" ]; then
            echo "Routingflare CLI was not found in PATH or an Applications directory." >&2
            exit 1
          fi

          configure_route() {
            local hostname="$1"
            local port="$2"
            local expected="${hostname} -> 127.0.0.1:${port}"
            if "${routingflare_bin}" list | grep -Fq "${expected}"; then
              return
            fi

            local index
            index="$("${routingflare_bin}" list | awk -v host="${hostname}" '
              $0 ~ host {
                value=$1
                gsub(/\./, "", value)
                print value
                exit
              }
            ')"
            if [ -n "${index}" ]; then
              "${routingflare_bin}" remove dns "${index}"
            fi
            "${routingflare_bin}" add dns --host "${hostname}" --port "${port}" --path /
          }

          configure_route monitoring.lowfidev.cloud "${API_DASHBOARD_PORT}"
          configure_route grafana.lowfidev.cloud "${GRAFANA_PORT}"
          "${routingflare_bin}" stop
          RUNNER_TRACKING_ID="" "${routingflare_bin}" start

          echo "Monitoring route: https://monitoring.lowfidev.cloud -> 127.0.0.1:${API_DASHBOARD_PORT}"
          echo "Grafana route: https://grafana.lowfidev.cloud -> 127.0.0.1:${GRAFANA_PORT}"
