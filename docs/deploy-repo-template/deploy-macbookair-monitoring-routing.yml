name: Deploy BuddyStudy Monitoring Routes on MacBook Air

on:
  workflow_dispatch:

concurrency:
  group: deploy-macbookair-monitoring-routing
  cancel-in-progress: false

jobs:
  deploy_monitoring_routing:
    name: Deploy Monitoring Routing Module
    runs-on: [self-hosted, macOS, ARM64, macbook-air, buddystudy]
    timeout-minutes: 5
    env:
      API_DASHBOARD_PORT: ${{ vars.API_DASHBOARD_PORT || '3000' }}
      GRAFANA_PORT: ${{ vars.GRAFANA_PORT || '3001' }}

    steps:
      - name: Configure Routingflare routes
        run: |
          set -euo pipefail

          routingflare_bin="$(command -v routingflare || true)"
          routingflare_app=""
          for candidate in \
            "/Applications/routingflare.app" \
            "${HOME}/Applications/routingflare.app"; do
            if [ -d "${candidate}" ]; then
              routingflare_app="${candidate}"
              if [ -z "${routingflare_bin}" ] && [ -x "${candidate}/Contents/MacOS/routingflare" ]; then
                routingflare_bin="${candidate}/Contents/MacOS/routingflare"
              fi
            fi
          done
          if [ -z "${routingflare_bin}" ] || [ -z "${routingflare_app}" ]; then
            echo "Routingflare app or CLI was not found in an Applications directory." >&2
            exit 1
          fi
          echo "Routingflare version before update: $(/usr/bin/defaults read "${routingflare_app}/Contents/Info" CFBundleShortVersionString)"
          "${routingflare_bin}" update
          echo "Routingflare version after update: $(/usr/bin/defaults read "${routingflare_app}/Contents/Info" CFBundleShortVersionString)"

          cloudflared_bin="$(command -v cloudflared || true)"
          for candidate in \
            "/opt/homebrew/bin/cloudflared" \
            "/usr/local/bin/cloudflared"; do
            if [ -z "${cloudflared_bin}" ] && [ -x "${candidate}" ]; then
              cloudflared_bin="${candidate}"
            fi
          done
          if [ -z "${cloudflared_bin}" ]; then
            echo "cloudflared was not found in PATH or a Homebrew directory." >&2
            exit 1
          fi

          tunnel_id="$("${routingflare_bin}" settings get | awk -F': ' '/dns tunnel id:/ { print $2; exit }')"
          if [ -z "${tunnel_id}" ] || [ "${tunnel_id}" = "-" ]; then
            echo "Routingflare does not have a named tunnel ID configured." >&2
            exit 1
          fi

          configure_route() {
            local hostname="$1"
            local port="$2"
            local expected="${hostname} -> 127.0.0.1:${port}"
            if "${routingflare_bin}" list | grep -Fq "${expected}"; then
              "${cloudflared_bin}" tunnel route dns --overwrite-dns "${tunnel_id}" "${hostname}"
              return
            fi

            local index
            index="$("${routingflare_bin}" list | awk -v host="${hostname}" '
              $0 ~ host {
                value=$1
                gsub(/\./, "", value)
                print value
                exit
              }
            ')"
            if [ -n "${index}" ]; then
              "${routingflare_bin}" remove dns "${index}"
            fi
            "${routingflare_bin}" add dns --host "${hostname}" --port "${port}" --path /
            "${cloudflared_bin}" tunnel route dns --overwrite-dns "${tunnel_id}" "${hostname}"
          }

          configure_route monitoring.lowfidev.cloud "${API_DASHBOARD_PORT}"
          configure_route grafana.lowfidev.cloud "${GRAFANA_PORT}"
          "${routingflare_bin}" autostart on
          "${routingflare_bin}" stop
          /usr/bin/pkill -f "cloudflared.*${tunnel_id}" >/dev/null 2>&1 || true
          sleep 2
          "${cloudflared_bin}" tunnel cleanup "${tunnel_id}" || true

          # LaunchServices gives the menu-bar app a clean, persistent process
          # context so Actions orphan cleanup cannot terminate its tunnel.
          routingflare_process="$(
            /usr/bin/defaults read "${routingflare_app}/Contents/Info" CFBundleExecutable
          )"
          /usr/bin/pkill -x "${routingflare_process}" >/dev/null 2>&1 || true
          sleep 2
          /usr/bin/env -u RUNNER_TRACKING_ID /usr/bin/open "${routingflare_app}"
          sleep 3
          /usr/bin/env -u RUNNER_TRACKING_ID "${routingflare_bin}" start
          sleep 4
          "${routingflare_bin}" list
          "${cloudflared_bin}" tunnel info "${tunnel_id}"
          /bin/ps -axo pid,ppid,command | grep -E "[${routingflare_process:0:1}]${routingflare_process:1}|[c]loudflared.*${tunnel_id}" || true
          routingflare_pid="$(/usr/bin/pgrep -x "${routingflare_process}" | head -1 || true)"
          echo "Routingflare listeners:"
          if [ -n "${routingflare_pid}" ]; then
            /usr/sbin/lsof -nP -a -p "${routingflare_pid}" -iTCP -sTCP:LISTEN || true
          fi
          echo "Monitoring listener:"
          /usr/sbin/lsof -nP -iTCP:"${API_DASHBOARD_PORT}" -sTCP:LISTEN || true
          echo "Grafana listener:"
          /usr/sbin/lsof -nP -iTCP:"${GRAFANA_PORT}" -sTCP:LISTEN || true
          echo "Monitoring gateway container:"
          docker ps \
            --filter name=buddystudy-api-dashboard \
            --format 'name={{.Names}} status={{.Status}} ports={{.Ports}}' || true
          echo "Monitoring gateway recent log:"
          docker logs --tail 80 buddystudy-api-dashboard || true
          echo "Routingflare ingress:"
          /usr/bin/find "${HOME}/Library/Application Support/TunnelBar" \
            -maxdepth 1 -type f -name 'cloudflared-*.yml' -print0 2>/dev/null \
            | /usr/bin/xargs -0 grep -HE '^(tunnel:|  - hostname:|    service:)' || true

          echo "Monitoring route: https://monitoring.lowfidev.cloud -> 127.0.0.1:${API_DASHBOARD_PORT}"
          echo "Grafana route: https://grafana.lowfidev.cloud -> 127.0.0.1:${GRAFANA_PORT}"
