name: Deploy BuddyStudy Admin Frontend

"on":
  repository_dispatch:
    types:
      - admin-frontend-image-published
  workflow_dispatch:
    inputs:
      image:
        description: "Admin frontend image ref to deploy."
        required: true
        type: string

concurrency:
  group: deploy-admin-frontend-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_admin_frontend:
    name: Submit Admin Frontend Image on Backend Host
    runs-on: [self-hosted, Linux, ARM64, ec2, buddystudy]
    timeout-minutes: 10
    env:
      IMAGE_REF: ${{ github.event.client_payload.image || inputs.image }}
      CONTAINER: buddystudy-admin-frontend
      NETWORK: buddystudy-swarm-net
      BACKEND_UPSTREAM: http://buddystudy_backend:8080
      ENVIRONMENT: ec2

    steps:
      - name: Validate input
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "Missing admin frontend image ref." >&2
            exit 1
          fi

      - name: Submit admin frontend image
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_USERNAME}" ] || [ -z "${GHCR_TOKEN}" ]; then
            echo "Missing GHCR deployment credentials." >&2
            exit 1
          fi

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker pull "${IMAGE_REF}"
          docker network inspect "${NETWORK}" >/dev/null 2>&1 \
            || docker network create "${NETWORK}" >/dev/null
          docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${CONTAINER}" \
            --network "${NETWORK}" \
            --restart unless-stopped \
            -e "BACKEND_UPSTREAM=${BACKEND_UPSTREAM}" \
            "${IMAGE_REF}"

          applied_image="$(docker inspect --format '{{.Config.Image}}' "${CONTAINER}")"
          if [ "${applied_image}" != "${IMAGE_REF}" ]; then
            echo "Container config image mismatch: expected ${IMAGE_REF}, found ${applied_image:-<missing>}." >&2
            exit 1
          fi
          echo "Container config accepted image: ${applied_image}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Admin Frontend Deployment"
            echo ""
            echo "- Target: \`${ENVIRONMENT}\`"
            echo "- Container: \`${CONTAINER}\`"
            echo "- Network: \`${NETWORK}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Submission: \`${{ job.status }}\`"
            echo "- Runtime readiness: monitored by Grafana, not gated by GitHub Actions"
          } >> "${GITHUB_STEP_SUMMARY}"
