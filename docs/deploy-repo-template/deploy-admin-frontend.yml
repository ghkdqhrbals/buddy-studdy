name: Deploy BuddyStudy Admin Frontend

"on":
  repository_dispatch:
    types:
      - admin-frontend-image-published
  workflow_dispatch:
    inputs:
      image:
        description: "Admin frontend image ref to deploy."
        required: true
        type: string

concurrency:
  group: deploy-admin-frontend-macbook-air
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_admin_frontend:
    name: Submit Admin Frontend Image on MacBook Air
    runs-on: [self-hosted, macOS, ARM64, macbook-air, buddystudy]
    timeout-minutes: 10
    env:
      IMAGE_REF: ${{ github.event.client_payload.image || inputs.image }}
      NAMESPACE: buddystudy
      DEPLOYMENT: buddystudy-admin-frontend
      CONTAINER: admin-frontend
      ENVIRONMENT: macbook-air

    steps:
      - name: Validate input
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "Missing admin frontend image ref." >&2
            exit 1
          fi

      - name: Prepare kubectl environment
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "${GITHUB_PATH}"
          echo "/usr/local/bin" >> "${GITHUB_PATH}"
          kubeconfig="${KUBECONFIG:-${HOME}/.kube/config}"
          if [[ "${kubeconfig}" == *'$'* ]]; then
            kubeconfig="${HOME}/.kube/config"
          fi
          echo "KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"

      - name: Validate kubectl context
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:${PATH}"
          export KUBECONFIG="${KUBECONFIG:-${HOME}/.kube/config}"
          if [[ "${KUBECONFIG}" == *'$'* ]]; then
            export KUBECONFIG="${HOME}/.kube/config"
          fi
          kubectl config current-context

          control_plane_ready=false
          if kubectl --request-timeout=5s get namespace "${NAMESPACE}" >/dev/null 2>&1; then
            control_plane_ready=true
          else
            echo "Docker Desktop Kubernetes API is unavailable; restarting Docker Desktop to restore the deployment control plane."
            if ! /usr/bin/env -u RUNNER_TRACKING_ID \
              docker desktop restart --timeout 75; then
              /usr/bin/env -u RUNNER_TRACKING_ID \
                docker desktop stop --force --timeout 30 \
                || true
              /usr/bin/env -u RUNNER_TRACKING_ID \
                docker desktop start --timeout 105 \
                || /usr/bin/env -u RUNNER_TRACKING_ID open -ga Docker \
                || true
            fi

            for attempt in $(seq 1 24); do
              if kubectl --request-timeout=5s get namespace "${NAMESPACE}" >/dev/null 2>&1; then
                control_plane_ready=true
                break
              fi
              echo "Waiting for the Kubernetes API. attempt=${attempt}/24"
              sleep 5
            done
          fi

          if [ "${control_plane_ready}" != true ]; then
            echo "Kubernetes control plane did not become available within the deployment window." >&2
            exit 1
          fi

      - name: Submit admin frontend image
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:${PATH}"
          export KUBECONFIG="${KUBECONFIG:-${HOME}/.kube/config}"
          if [[ "${KUBECONFIG}" == *'$'* ]]; then
            export KUBECONFIG="${HOME}/.kube/config"
          fi

          kubectl -n "${NAMESPACE}" set image \
            "deployment/${DEPLOYMENT}" \
            "${CONTAINER}=${IMAGE_REF}"
          kubectl -n "${NAMESPACE}" annotate \
            "deployment/${DEPLOYMENT}" \
            "buddystudy.github.com/deployed-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "buddystudy.github.com/source-run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --overwrite

          applied_image="$(
            kubectl -n "${NAMESPACE}" get "deployment/${DEPLOYMENT}" \
              --output="jsonpath={.spec.template.spec.containers[?(@.name==\"${CONTAINER}\")].image}"
          )"
          if [ "${applied_image}" != "${IMAGE_REF}" ]; then
            echo "Deployment spec image mismatch: expected ${IMAGE_REF}, found ${applied_image:-<missing>}." >&2
            exit 1
          fi
          echo "Deployment spec accepted image: ${applied_image}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Admin Frontend Deployment"
            echo ""
            echo "- Target: \`${ENVIRONMENT}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
            echo "- Deployment: \`${DEPLOYMENT}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Submission: \`${{ job.status }}\`"
            echo "- Runtime readiness: monitored by Grafana, not gated by GitHub Actions"
          } >> "${GITHUB_STEP_SUMMARY}"
