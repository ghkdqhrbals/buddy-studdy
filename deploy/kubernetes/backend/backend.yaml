apiVersion: v1
kind: Service
metadata:
  name: buddystudy-backend
  labels:
    app.kubernetes.io/name: buddystudy-backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: buddystudy-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddystudy-backend
  labels:
    app.kubernetes.io/name: buddystudy-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-backend
    spec:
      initContainers:
        - name: wait-for-redis-cluster
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0.buddystudy-redis-headless -p 6379 cluster info | grep -q "cluster_state:ok"; do
                sleep 2
              done
      containers:
        - name: backend
          image: ghcr.io/ghkdqhrbals/buddy-study-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: buddystudy-backend-config
            - secretRef:
                name: buddystudy-backend-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
