apiVersion: v1
kind: Service
metadata:
  name: buddystuddy-backend
  labels:
    app.kubernetes.io/name: buddystuddy-backend
spec:
  selector:
    app.kubernetes.io/name: buddystuddy-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddystuddy-backend
  labels:
    app.kubernetes.io/name: buddystuddy-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ghkdqhrbals/buddy-studdy-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: buddystuddy-backend-config
            - secretRef:
                name: buddystuddy-backend-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi

