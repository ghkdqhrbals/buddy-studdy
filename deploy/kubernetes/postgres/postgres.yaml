apiVersion: v1
kind: ConfigMap
metadata:
  name: buddystuddy-postgres-init
data:
  01-create-aggregation-db.sql: |
    SELECT 'CREATE DATABASE buddystuddy_aggregation'
    WHERE NOT EXISTS (
      SELECT FROM pg_database WHERE datname = 'buddystuddy_aggregation'
    )\gexec
---
apiVersion: v1
kind: Service
metadata:
  name: buddystuddy-postgres
  labels:
    app.kubernetes.io/name: buddystuddy-postgres
spec:
  selector:
    app.kubernetes.io/name: buddystuddy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buddystuddy-postgres
  labels:
    app.kubernetes.io/name: buddystuddy-postgres
spec:
  serviceName: buddystuddy-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: buddystuddy
            - name: POSTGRES_USER
              value: buddystuddy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystuddy-backend-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "buddystuddy", "-d", "buddystuddy"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "buddystuddy", "-d", "buddystuddy"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: buddystuddy-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

