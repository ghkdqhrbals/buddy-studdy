apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystuddy-redis
    app.kubernetes.io/part-of: buddystuddy
  name: buddystuddy-redis
  namespace: buddystuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-redis
      app.kubernetes.io/part-of: buddystuddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-redis
        app.kubernetes.io/part-of: buddystuddy
    spec:
      containers:
      - command:
        - sh
        - -c
        - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystuddy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - emptyDir: {}
        name: data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystuddy-postgres
    app.kubernetes.io/part-of: buddystuddy
  name: buddystuddy-postgres
  namespace: buddystuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-postgres
      app.kubernetes.io/part-of: buddystuddy
  serviceName: buddystuddy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-postgres
        app.kubernetes.io/part-of: buddystuddy
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: buddystuddy
        - name: POSTGRES_USER
          value: buddystuddy
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: buddystuddy-backend-secret
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - buddystuddy
            - -d
            - buddystuddy
          initialDelaySeconds: 30
          periodSeconds: 20
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - buddystuddy
            - -d
            - buddystuddy
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - configMap:
          name: buddystuddy-postgres-init
        name: init-scripts
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/part-of: buddystuddy
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: buddystuddy-postgres-backup
    app.kubernetes.io/part-of: buddystuddy
  name: buddystuddy-postgres-backup
  namespace: buddystuddy
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buddystuddy
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystuddy-postgres-backup
            app.kubernetes.io/part-of: buddystuddy
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -euo pipefail
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p /backups
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystuddy > "/backups/buddystuddy-${ts}.dump"
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystuddy_aggregation > "/backups/buddystuddy-aggregation-${ts}.dump"
              find /backups -type f -name "buddystuddy*.dump" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
            env:
            - name: PGHOST
              value: buddystuddy-postgres
            - name: PGUSER
              value: buddystuddy
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_PASSWORD
                  name: buddystuddy-backend-secret
            - name: BACKUP_RETENTION_DAYS
              value: "14"
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent
            name: backup
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: buddystuddy-postgres-backups
  schedule: 0 18 * * *
  successfulJobsHistoryLimit: 3
