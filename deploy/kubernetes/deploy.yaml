apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-admin-frontend
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-admin-frontend
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-admin-frontend
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-admin-frontend
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: BACKEND_UPSTREAM
          value: http://buddystudy-backend:8080
        - name: BACKEND_PROXY_HOST
          value: buddystudy-backend
        image: ghcr.io/ghkdqhrbals/buddystudy-admin-frontend:latest
        imagePullPolicy: Always
        name: admin-frontend
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /admin/
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-backend
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-backend
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-backend
      app.kubernetes.io/part-of: buddystudy
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-backend
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: buddystudy-backend-config
        - secretRef:
            name: buddystudy-backend-secret
        image: ghcr.io/ghkdqhrbals/buddystudy-backend:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 256Mi
      initContainers:
      - command:
        - sh
        - -c
        - |
          until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis -p 6379 ping | grep -q PONG; do
            sleep 2
          done
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-libretranslate
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-libretranslate
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-libretranslate
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-libretranslate
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: LT_LOAD_ONLY
          value: en,ko
        - name: LT_DISABLE_WEB_UI
          value: "true"
        - name: LT_WORKERS
