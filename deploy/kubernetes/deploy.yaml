apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis
  namespace: buddystudy
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-redis-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          exec redis-server \
            --port 6379 \
            --bind 0.0.0.0 \
            --protected-mode no \
            --appendonly yes \
            --dir /data \
            --requirepass "$REDIS_PASSWORD" \
            --masterauth "$REDIS_PASSWORD" \
            --cluster-enabled yes \
            --cluster-config-file nodes.conf \
            --cluster-node-timeout 5000 \
            --cluster-announce-hostname "$(hostname).buddystudy-redis-headless.buddystudy.svc.cluster.local" \
            --cluster-preferred-endpoint-type hostname \
            --cluster-announce-port 6379 \
            --cluster-announce-bus-port 16379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 30
          periodSeconds: 20
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 16379
          name: cluster-bus
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /data
          name: data
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/part-of: buddystudy
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      selector:
        matchLabels:
          app.kubernetes.io/name: buddystudy-redis
      storageClassName: buddystudy-local
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-postgres-backup
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-postgres-backup
  namespace: buddystudy
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buddystudy
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystudy-postgres-backup
            app.kubernetes.io/part-of: buddystudy
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -euo pipefail
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p /backups
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystudy > "/backups/buddystudy-${ts}.dump"
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystudy_aggregation > "/backups/buddystudy-aggregation-${ts}.dump"
              find /backups -type f -name "buddystudy*.dump" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
            env:
            - name: PGHOST
              value: buddystudy-postgres
            - name: PGUSER
              value: buddystudy
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_PASSWORD
                  name: buddystudy-backend-secret
            - name: BACKUP_RETENTION_DAYS
              value: "14"
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent
            name: backup
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: buddystudy-postgres-backups
  schedule: 0 18 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis-cluster-init
  namespace: buddystudy
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-cluster-init
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          set -eu
          nodes="
          buddystudy-redis-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
          buddystudy-redis-1.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
          buddystudy-redis-2.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
          "
          for node in $nodes; do
            until redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" ping | grep -q PONG; do
              sleep 2
            done
          done
          if redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0.buddystudy-redis-headless.buddystudy.svc.cluster.local cluster info | grep -q "cluster_state:ok"; then
            echo "Redis cluster already initialized"
            exit 0
          fi
          yes yes | redis-cli -a "$REDIS_PASSWORD" --cluster create $nodes --cluster-replicas 0
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: redis-cluster-init
      restartPolicy: OnFailure
