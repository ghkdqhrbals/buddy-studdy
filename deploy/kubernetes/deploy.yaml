apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-admin-frontend
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-admin-frontend
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-admin-frontend
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-admin-frontend
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: BACKEND_UPSTREAM
          value: http://buddystudy-backend:8080
        - name: BACKEND_PROXY_HOST
          value: buddystudy-backend
        image: ghcr.io/ghkdqhrbals/buddystudy-admin-frontend:latest
        imagePullPolicy: Always
        name: admin-frontend
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /admin/
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-backend
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-backend
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-backend
      app.kubernetes.io/part-of: buddystudy
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-backend
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: buddystudy-backend-config
        - secretRef:
            name: buddystudy-backend-secret
        image: ghcr.io/ghkdqhrbals/buddystudy-backend:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /api/v1/health/dependencies
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 256Mi
      initContainers:
      - command:
        - sh
        - -c
        - |
          until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis -p 6379 ping | grep -q PONG; do
            sleep 2
          done
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-libretranslate
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-libretranslate
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-libretranslate
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-libretranslate
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: LT_LOAD_ONLY
          value: en,ko,ja
        - name: LT_DISABLE_WEB_UI
          value: "true"
        - name: LT_THREADS
          value: "1"
        - name: LT_UPDATE_MODELS
          value: "true"
        image: libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
        imagePullPolicy: IfNotPresent
        name: libretranslate
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          httpGet:
            path: /languages
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - mountPath: /home/libretranslate/.local/share
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: buddystudy-libretranslate-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-mysql
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-mysql
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-mysql
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-mysql
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: MYSQL_DATABASE
          value: buddystudy
        - name: MYSQL_USER
          value: buddystudy
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: buddystudy-backend-secret
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: buddystudy-backend-secret
        image: mysql:8.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent
          initialDelaySeconds: 40
          periodSeconds: 20
        name: mysql
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: buddystudy-mysql-data
      - configMap:
          name: buddystudy-mysql-init
        name: init-scripts
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          exec redis-server \
            --port 6379 \
            --bind 0.0.0.0 \
            --protected-mode no \
            --appendonly yes \
            --appendfsync everysec \
            --aof-use-rdb-preamble yes \
            --auto-aof-rewrite-percentage 100 \
            --auto-aof-rewrite-min-size 64mb \
            --save 3600 1 \
            --save 300 100 \
            --save 60 10000 \
            --rdbcompression yes \
            --rdbchecksum yes \
            --dbfilename dump.rdb \
            --dir /data \
            --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" -p 6379 ping | grep PONG
          initialDelaySeconds: 30
          periodSeconds: 20
        name: redis
        ports:
        - containerPort: 6379
          hostPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" -p 6379 ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /data
          name: data
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-buddystudy-redis
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-mysql-backup
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-mysql-backup
  namespace: buddystudy
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buddystudy
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystudy-mysql-backup
            app.kubernetes.io/part-of: buddystudy
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -eu
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p /backups
              mysqldump --single-transaction --quick --routines --triggers \
                -h "${MYSQL_HOST}" -u "${MYSQL_USER}" buddystudy \
                | gzip > "/backups/buddystudy-${ts}.sql.gz"
              mysqldump --single-transaction --quick --routines --triggers \
                -h "${MYSQL_HOST}" -u "${MYSQL_USER}" buddystudy_aggregation \
                | gzip > "/backups/buddystudy-aggregation-${ts}.sql.gz"
              find /backups -type f -name "buddystudy*.sql.gz" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
            env:
            - name: MYSQL_HOST
              value: buddystudy-mysql
            - name: MYSQL_USER
              value: buddystudy
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_PASSWORD
                  name: buddystudy-backend-secret
            - name: BACKUP_RETENTION_DAYS
              value: "14"
            image: mysql:8.4
            imagePullPolicy: IfNotPresent
            name: backup
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: buddystudy-mysql-backups
  schedule: 0 18 * * *
  successfulJobsHistoryLimit: 3
