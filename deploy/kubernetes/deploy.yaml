apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-backend
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-backend
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-backend
      app.kubernetes.io/part-of: buddystudy
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-backend
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: buddystudy-backend-config
        - secretRef:
            name: buddystudy-backend-secret
        image: ghcr.io/ghkdqhrbals/buddystudy-backend:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 256Mi
      initContainers:
      - command:
        - sh
        - -c
        - |
          until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0-0.buddystudy-redis-headless -p 6379 cluster info | grep -q "cluster_state:ok"; do
            sleep 2
          done
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-redis-cluster
      - command:
        - sh
        - -c
        - |
          until curl -fsS http://buddystudy-redis-stream-coordinator:8080/actuator/health >/dev/null; do
            sleep 2
          done
        image: curlimages/curl:8.11.0
        imagePullPolicy: IfNotPresent
        name: wait-for-redis-stream-coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-libretranslate
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-libretranslate
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-libretranslate
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-libretranslate
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: LT_LOAD_ONLY
          value: en,ko
        - name: LT_DISABLE_WEB_UI
          value: "true"
        - name: LT_WORKERS
          value: "1"
        image: libretranslate/libretranslate:latest
        imagePullPolicy: IfNotPresent
        name: libretranslate
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          httpGet:
            path: /languages
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - mountPath: /home/libretranslate/.local/share
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: buddystudy-libretranslate-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis-stream-coordinator
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis-stream-coordinator
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis-stream-coordinator
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-stream-coordinator
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: SERVER_PORT
          value: "8080"
        - name: COORDINATOR_ID
          value: buddystudy-k8s-coordinator
        - name: COORDINATOR_STORE_TYPE
          value: redis
        - name: COORDINATOR_STREAMS_PROVISIONING_ENABLED
          value: "true"
        - name: SPRING_DATA_REDIS_CLUSTER_NODES
          value: buddystudy-redis-0-0.buddystudy-redis-headless:6379,buddystudy-redis-1-0.buddystudy-redis-headless:6380,buddystudy-redis-2-0.buddystudy-redis-headless:6381
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        - name: REDIS_STREAM_COORDINATOR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_STREAM_COORDINATOR_PASSWORD
              name: buddystudy-backend-secret
        - name: REDIS_STREAM_COORDINATOR_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              key: AUTH_JWT_SECRET
              name: buddystudy-backend-secret
        image: ghcr.io/ghkdqhrbals/redis-stream-coordinator/coordinator-server:0.3.0-compatible.1
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 5
        name: coordinator
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 50m
            memory: 128Mi
      imagePullSecrets:
      - name: ghcr-pull-secret
      initContainers:
      - command:
        - sh
        - -c
        - |
          until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0-0.buddystudy-redis-headless -p 6379 cluster info | grep -q "cluster_state:ok"; do
            sleep 2
          done
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-redis-cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-postgres
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-postgres
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-postgres
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-postgres
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: buddystudy
        - name: POSTGRES_USER
          value: buddystudy
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: buddystudy-backend-secret
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - buddystudy
            - -d
            - buddystudy
          initialDelaySeconds: 30
          periodSeconds: 20
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - buddystudy
            - -d
            - buddystudy
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: buddystudy-postgres-data
      - configMap:
          name: buddystudy-postgres-init
        name: init-scripts
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/ordinal: "0"
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis-0
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
      app.kubernetes.io/ordinal: "0"
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-redis-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
        app.kubernetes.io/ordinal: "0"
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          exec redis-server \
            --port 6379 \
            --bind 0.0.0.0 \
            --protected-mode no \
            --appendonly yes \
            --dir /data \
            --requirepass "$REDIS_PASSWORD" \
            --masterauth "$REDIS_PASSWORD" \
            --cluster-enabled yes \
            --cluster-config-file nodes.conf \
            --cluster-node-timeout 5000 \
            --cluster-announce-hostname buddystudy-redis-0-0.buddystudy-redis-headless.buddystudy.svc.cluster.local \
            --cluster-preferred-endpoint-type hostname \
            --cluster-announce-port 6379 \
            --cluster-announce-bus-port 16379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" -p 6379 ping | grep PONG
          initialDelaySeconds: 30
          periodSeconds: 20
        name: redis
        ports:
        - containerPort: 6379
          hostPort: 6379
          name: redis
        - containerPort: 16379
          hostPort: 16379
          name: cluster-bus
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" -p 6379 ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-buddystudy-redis-0
---
