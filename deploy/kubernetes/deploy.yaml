apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-postgres
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-postgres
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-postgres
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-postgres
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: buddystudy
        - name: POSTGRES_USER
          value: buddystudy
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DATABASE_PASSWORD
              name: buddystudy-backend-secret
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - buddystudy
            - -d
            - buddystudy
          initialDelaySeconds: 30
          periodSeconds: 20
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - buddystudy
            - -d
            - buddystudy
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: buddystudy-postgres-data
      - configMap:
          name: buddystudy-postgres-init
        name: init-scripts
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
      app.kubernetes.io/part-of: buddystudy
  serviceName: buddystudy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          exec redis-server \
            --port 6379 \
            --bind 0.0.0.0 \
            --protected-mode no \
            --appendonly yes \
            --dir /data \
            --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" -p 6379 ping | grep PONG
          initialDelaySeconds: 30
          periodSeconds: 20
        name: redis
        ports:
        - containerPort: 6379
          hostPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" -p 6379 ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-buddystudy-redis
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-postgres-backup
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-postgres-backup
  namespace: buddystudy
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buddystudy
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystudy-postgres-backup
            app.kubernetes.io/part-of: buddystudy
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -euo pipefail
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p /backups
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystudy > "/backups/buddystudy-${ts}.dump"
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystudy_aggregation > "/backups/buddystudy-aggregation-${ts}.dump"
              find /backups -type f -name "buddystudy*.dump" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
            env:
            - name: PGHOST
              value: buddystudy-postgres
            - name: PGUSER
              value: buddystudy
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_PASSWORD
                  name: buddystudy-backend-secret
            - name: BACKUP_RETENTION_DAYS
              value: "14"
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent
            name: backup
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: buddystudy-postgres-backups
  schedule: 0 18 * * *
  successfulJobsHistoryLimit: 3
