apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis-proxy
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis-proxy
  namespace: buddystudy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis-proxy
      app.kubernetes.io/part-of: buddystudy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-proxy
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          exec redis-cluster-proxy \
            --port 6379 \
            --bind 0.0.0.0 \
            --threads 2 \
            --auth "$REDIS_PASSWORD" \
            buddystudy-redis-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: ableuler/redis-cluster-proxy:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 20
          tcpSocket:
            port: redis
        name: redis-cluster-proxy
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 10
          tcpSocket:
            port: redis
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      initContainers:
      - command:
        - sh
        - -c
        - |
          until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0.buddystudy-redis-headless -p 6379 cluster info | grep -q "cluster_state:ok"; do
            sleep 2
          done
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-redis-cluster
---
