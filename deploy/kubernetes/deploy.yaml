apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-postgres-backup
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-postgres-backup
  namespace: buddystudy
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buddystudy
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystudy-postgres-backup
            app.kubernetes.io/part-of: buddystudy
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -euo pipefail
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p /backups
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystudy > "/backups/buddystudy-${ts}.dump"
              pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystudy_aggregation > "/backups/buddystudy-aggregation-${ts}.dump"
              find /backups -type f -name "buddystudy*.dump" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
            env:
            - name: PGHOST
              value: buddystudy-postgres
            - name: PGUSER
              value: buddystudy
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_PASSWORD
                  name: buddystudy-backend-secret
            - name: BACKUP_RETENTION_DAYS
              value: "14"
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent
            name: backup
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: buddystudy-postgres-backups
  schedule: 0 18 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis-cluster-init
  namespace: buddystudy
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-cluster-init
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          set -eu
          nodes="
          buddystudy-redis-0-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
          buddystudy-redis-1-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6380
          buddystudy-redis-2-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6381
          "
          for node in $nodes; do
            until redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" ping | grep -q PONG; do
              sleep 2
            done
          done
          if redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0-0.buddystudy-redis-headless.buddystudy.svc.cluster.local -p 6379 cluster info | grep -q "cluster_state:ok"; then
            echo "Redis cluster already initialized"
            exit 0
          fi

          for node in $nodes; do
            dbsize="$(redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" dbsize)"
            if [ "$dbsize" != "0" ]; then
              echo "Redis cluster is not healthy and ${node} is not empty; refusing destructive reset"
              redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" cluster info || true
              exit 1
            fi
          done

          for node in $nodes; do
            redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" cluster reset hard || true
          done

          yes yes | redis-cli -a "$REDIS_PASSWORD" --cluster create $nodes --cluster-replicas 0
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: buddystudy-backend-secret
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        name: redis-cluster-init
      restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: buddystudy-redis-stream-coordinator
    app.kubernetes.io/part-of: buddystudy
  name: buddystudy-redis-stream-coordinator-bootstrap
  namespace: buddystudy
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-stream-coordinator-bootstrap
        app.kubernetes.io/part-of: buddystudy
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          set -eu

          until curl -fsS "${COORDINATOR_BASE_URL}/actuator/health" >/dev/null; do
            sleep 2
          done

          token="$(
            curl -fsS -H "Content-Type: application/json" \
              -X POST "${COORDINATOR_BASE_URL}/coord/v1/auth/login" \
              -d "{\"username\":\"admin\",\"password\":\"${COORDINATOR_PASSWORD}\"}" |
            sed -n 's/.*"accessToken"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          )"

          create_stream_group() {
            stream_prefix="$1"
            shard_count="$2"
            consumer_group="bs-backend"
            status="$(
              curl -sS -o /tmp/coord-response.json -w "%{http_code}" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -X POST "${COORDINATOR_BASE_URL}/coord/v1/streams/${stream_prefix}/groups/${consumer_group}" \
                -d "{\"initialShardCount\":${shard_count},\"requestedBy\":\"buddystudy-k8s-bootstrap\",\"reason\":\"bootstrap ${stream_prefix}/${consumer_group}\"}"
            )"
            if [ "$status" = "201" ] || [ "$status" = "409" ]; then
              echo "stream group ${stream_prefix}/${consumer_group} ready (${status})"
            else
              cat /tmp/coord-response.json
              exit 1
            fi
          }

          create_stream_group "push-v1" 8
          create_stream_group "view-v1" 8
          create_stream_group "notification-v1" 4
          create_stream_group "create-question-v1" 2
        env:
        - name: COORDINATOR_BASE_URL
          value: http://buddystudy-redis-stream-coordinator:8080
        - name: COORDINATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_STREAM_COORDINATOR_PASSWORD
              name: buddystudy-backend-secret
        image: curlimages/curl:8.11.0
        imagePullPolicy: IfNotPresent
        name: bootstrap
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 3600
