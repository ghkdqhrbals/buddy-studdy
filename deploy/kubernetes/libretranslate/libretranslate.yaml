apiVersion: v1
kind: Service
metadata:
  name: buddystuddy-libretranslate
  labels:
    app.kubernetes.io/name: buddystuddy-libretranslate
spec:
  selector:
    app.kubernetes.io/name: buddystuddy-libretranslate
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddystuddy-libretranslate
  labels:
    app.kubernetes.io/name: buddystuddy-libretranslate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-libretranslate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-libretranslate
    spec:
      containers:
        - name: libretranslate
          image: libretranslate/libretranslate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LT_LOAD_ONLY
              value: en,ko
            - name: LT_DISABLE_WEB_UI
              value: "true"
            - name: LT_WORKERS
              value: "1"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /home/libretranslate/.local/share
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: buddystuddy-libretranslate-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buddystuddy-libretranslate-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

