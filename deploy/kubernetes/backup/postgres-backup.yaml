apiVersion: batch/v1
kind: CronJob
metadata:
  name: buddystuddy-postgres-backup
  labels:
    app.kubernetes.io/name: buddystuddy-postgres-backup
spec:
  schedule: "0 18 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystuddy-postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir -p /backups
                  pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystuddy > "/backups/buddystuddy-${ts}.dump"
                  pg_dump -Fc -h "${PGHOST}" -U "${PGUSER}" -d buddystuddy_aggregation > "/backups/buddystuddy-aggregation-${ts}.dump"
                  find /backups -type f -name "buddystuddy*.dump" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
              env:
                - name: PGHOST
                  value: buddystuddy-postgres
                - name: PGUSER
                  value: buddystuddy
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: buddystuddy-backend-secret
                      key: DATABASE_PASSWORD
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: buddystuddy-postgres-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buddystuddy-postgres-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

