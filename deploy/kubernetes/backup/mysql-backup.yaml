apiVersion: batch/v1
kind: CronJob
metadata:
  name: buddystudy-mysql-backup
  labels:
    app.kubernetes.io/name: buddystudy-mysql-backup
spec:
  schedule: "0 18 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buddystudy-mysql-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mysql:8.4
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir -p /backups
                  mysqldump --single-transaction --quick --routines --triggers \
                    -h "${MYSQL_HOST}" -u "${MYSQL_USER}" buddystudy \
                    | gzip > "/backups/buddystudy-${ts}.sql.gz"
                  mysqldump --single-transaction --quick --routines --triggers \
                    -h "${MYSQL_HOST}" -u "${MYSQL_USER}" buddystudy_aggregation \
                    | gzip > "/backups/buddystudy-aggregation-${ts}.sql.gz"
                  find /backups -type f -name "buddystudy*.sql.gz" -mtime +"${BACKUP_RETENTION_DAYS}" -delete
              env:
                - name: MYSQL_HOST
                  value: buddystudy-mysql
                - name: MYSQL_USER
                  value: buddystudy
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: buddystudy-backend-secret
                      key: DATABASE_PASSWORD
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: buddystudy-mysql-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buddystudy-mysql-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
