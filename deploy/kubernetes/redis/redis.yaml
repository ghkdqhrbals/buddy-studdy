apiVersion: v1
kind: Service
metadata:
  name: buddystudy-redis-headless
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: buddystudy-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: cluster-bus
      port: 16379
      targetPort: cluster-bus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buddystudy-redis
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  serviceName: buddystudy-redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --port 6379 \
                --bind 0.0.0.0 \
                --protected-mode no \
                --appendonly yes \
                --dir /data \
                --requirepass "$REDIS_PASSWORD" \
                --masterauth "$REDIS_PASSWORD" \
                --cluster-enabled yes \
                --cluster-config-file nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-announce-hostname "$(hostname).buddystudy-redis-headless.buddystudy.svc.cluster.local" \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: buddystudy-local
        resources:
          requests:
            storage: 5Gi
        selector:
          matchLabels:
            app.kubernetes.io/name: buddystudy-redis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: buddystudy-redis-cluster-init
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-cluster-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-cluster-init
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              nodes="
              buddystudy-redis-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
              buddystudy-redis-1.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
              buddystudy-redis-2.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
              "
              for node in $nodes; do
                until redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" ping | grep -q PONG; do
                  sleep 2
                done
              done
              if redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0.buddystudy-redis-headless.buddystudy.svc.cluster.local cluster info | grep -q "cluster_state:ok"; then
                echo "Redis cluster already initialized"
                exit 0
              fi
              yes yes | redis-cli -a "$REDIS_PASSWORD" --cluster create $nodes --cluster-replicas 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddystudy-redis-proxy
  labels:
    app.kubernetes.io/name: buddystudy-redis-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-proxy
    spec:
      initContainers:
        - name: wait-for-redis-cluster
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              until redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0.buddystudy-redis-headless -p 6379 cluster info | grep -q "cluster_state:ok"; do
                sleep 2
              done
      containers:
        - name: redis-cluster-proxy
          image: ableuler/redis-cluster-proxy:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              exec redis-cluster-proxy \
                --port 6379 \
                --bind 0.0.0.0 \
                --threads 2 \
                --auth "$REDIS_PASSWORD" \
                buddystudy-redis-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
