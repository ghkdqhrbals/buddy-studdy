apiVersion: v1
kind: Service
metadata:
  name: buddystuddy-redis
  labels:
    app.kubernetes.io/name: buddystuddy-redis
spec:
  selector:
    app.kubernetes.io/name: buddystuddy-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddystuddy-redis
  labels:
    app.kubernetes.io/name: buddystuddy-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystuddy-backend-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}

