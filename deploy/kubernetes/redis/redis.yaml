apiVersion: v1
kind: PersistentVolume
metadata:
  name: buddystudy-redis-data
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/mode: standalone
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: buddystudy-local
  hostPath:
    path: /Users/gyuminhwangbo/data/buddystudy/redis/standalone
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-buddystudy-redis
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: buddystudy-local
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
      app.kubernetes.io/mode: standalone
---
apiVersion: v1
kind: Service
metadata:
  name: buddystudy-redis
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  selector:
    app.kubernetes.io/name: buddystudy-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buddystudy-redis
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  serviceName: buddystudy-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --port 6379 \
                --bind 0.0.0.0 \
                --protected-mode no \
                --appendonly yes \
                --dir /data \
                --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              hostPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" -p 6379 ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" -p 6379 ping | grep PONG"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-buddystudy-redis
