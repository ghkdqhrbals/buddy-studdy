apiVersion: batch/v1
kind: Job
metadata:
  name: buddystudy-redis-cluster-init
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis-cluster-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-cluster-init
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              nodes="
              buddystudy-redis-0-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6379
              buddystudy-redis-1-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6380
              buddystudy-redis-2-0.buddystudy-redis-headless.buddystudy.svc.cluster.local:6381
              "
              for node in $nodes; do
                until redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" ping | grep -q PONG; do
                  sleep 2
                done
              done
              if redis-cli -a "$REDIS_PASSWORD" -h buddystudy-redis-0-0.buddystudy-redis-headless.buddystudy.svc.cluster.local -p 6379 cluster info | grep -q "cluster_state:ok"; then
                echo "Redis cluster already initialized"
                exit 0
              fi

              for node in $nodes; do
                dbsize="$(redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" dbsize)"
                if [ "$dbsize" != "0" ]; then
                  echo "Redis cluster is not healthy and ${node} is not empty; refusing destructive reset"
                  redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" cluster info || true
                  exit 1
                fi
              done

              for node in $nodes; do
                redis-cli -a "$REDIS_PASSWORD" -h "${node%:*}" -p "${node#*:}" cluster reset hard || true
              done

              yes yes | redis-cli -a "$REDIS_PASSWORD" --cluster create $nodes --cluster-replicas 0
