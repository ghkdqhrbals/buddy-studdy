apiVersion: v1
kind: Service
metadata:
  name: buddystudy-redis-headless
  labels:
    app.kubernetes.io/name: buddystudy-redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: buddystudy-redis
  ports:
    - name: redis-0
      port: 6379
      targetPort: redis
    - name: redis-1
      port: 6380
      targetPort: redis
    - name: redis-2
      port: 6381
      targetPort: redis
    - name: cluster-bus-0
      port: 16379
      targetPort: cluster-bus
    - name: cluster-bus-1
      port: 16380
      targetPort: cluster-bus
    - name: cluster-bus-2
      port: 16381
      targetPort: cluster-bus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buddystudy-redis-0
  labels:
    app.kubernetes.io/name: buddystudy-redis
    app.kubernetes.io/ordinal: "0"
spec:
  serviceName: buddystudy-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystudy-redis
      app.kubernetes.io/ordinal: "0"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystudy-redis
        app.kubernetes.io/ordinal: "0"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --port 6379 \
                --bind 0.0.0.0 \
                --protected-mode no \
                --appendonly yes \
                --dir /data \
                --requirepass "$REDIS_PASSWORD" \
                --masterauth "$REDIS_PASSWORD" \
                --cluster-enabled yes \
                --cluster-config-file nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-announce-hostname buddystudy-redis-0-0.buddystudy-redis-headless.buddystudy.svc.cluster.local \
                --cluster-preferred-endpoint-type hostname \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buddystudy-backend-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              hostPort: 6379
            - name: cluster-bus
              containerPort: 16379
              hostPort: 16379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" -p 6379 ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" -p 6379 ping | grep PONG"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-buddystudy-redis-0
---
