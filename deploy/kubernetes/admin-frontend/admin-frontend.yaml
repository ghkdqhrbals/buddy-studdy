apiVersion: v1
kind: Service
metadata:
  name: buddystuddy-admin-frontend
  labels:
    app.kubernetes.io/name: buddystuddy-admin-frontend
spec:
  selector:
    app.kubernetes.io/name: buddystuddy-admin-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddystuddy-admin-frontend
  labels:
    app.kubernetes.io/name: buddystuddy-admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddystuddy-admin-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddystuddy-admin-frontend
    spec:
      containers:
        - name: admin-frontend
          image: ghcr.io/ghkdqhrbals/buddy-studdy-admin-frontend:latest
          imagePullPolicy: Always
          env:
            - name: BACKEND_UPSTREAM
              value: http://buddystuddy-backend:8080
            - name: BACKEND_PROXY_HOST
              value: buddystuddy-backend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi

