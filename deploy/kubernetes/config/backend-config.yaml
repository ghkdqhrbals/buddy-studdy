  BUDDYSTUDY_QUESTION_GENERATED_STREAM_KEY: "study.question.generated.v1"
  BUDDYSTUDY_CONTENT_TRANSLATION_REQUESTED_STREAM_KEY: "localization.content-translation.requested.v1"
  BUDDYSTUDY_QUESTION_PUSH_REQUESTED_STREAM_KEY: "notification.question-push.requested.v1"
  BUDDYSTUDY_QUESTION_VIEWED_STREAM_KEY: "community.question.viewed.v1"
  BUDDYSTUDY_QUESTION_LIKED_STREAM_KEY: "community.question.liked.v1"
  BUDDYSTUDY_QUESTION_UNLIKED_STREAM_KEY: "community.question.unliked.v1"
  BUDDYSTUDY_QUESTION_COMMENTED_STREAM_KEY: "community.question.commented.v1"
  BUDDYSTUDY_QUESTION_COMMENT_DELETED_STREAM_KEY: "community.question.comment-deleted.v1"
  BUDDYSTUDY_TRANSLATION_BASE_URL: "http://buddystudy-libretranslate:5000"
  GOOGLE_IOS_CLIENT_ID: "328281669925-evuebplih3vir99daj4lapj1javqsmsr.apps.googleusercontent.com"
