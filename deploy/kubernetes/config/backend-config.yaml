apiVersion: v1
kind: ConfigMap
metadata:
  name: buddystudy-backend-config
data:
  APP_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_CLOUD_AWS_SECRETSMANAGER_ENABLED: "false"
  FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_ENABLED: "true"
  FLYWAY_LOCATIONS: "classpath:db/migration-mysql"
  DATABASE_URL: "jdbc:mysql://buddystudy-mysql:3306/buddystudy?serverTimezone=UTC"
  R2DBC_DATABASE_URL: "r2dbc:mysql://buddystudy-mysql:3306/buddystudy?serverZoneId=UTC"
  DATABASE_USERNAME: "buddystudy"
  SPRING_DATASOURCE_URL: "jdbc:mysql://buddystudy-mysql:3306/buddystudy?serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "buddystudy"
  ADMIN_ANALYTICS_DATABASE_URL: "jdbc:mysql://buddystudy-mysql:3306/buddystudy_aggregation?serverTimezone=UTC"
  ADMIN_ANALYTICS_DATABASE_USERNAME: "buddystudy"
  REDIS_HOST: "buddystudy-redis"
  REDIS_PORT: "6379"
  REDIS_SSL: "false"
  ENABLE_OPENAPI_DOCS: "false"
  SCHEDULER_ENABLED: "true"
  SCHEDULER_BATCH_SIZE: "50"
  MAX_PENDING_PER_STUDY: "1"
  REACTION_STREAM_ENABLED: "true"
  BUDDYSTUDY_STREAMS_KEY: "buddystudy-events-v1"
  BUDDYSTUDY_TRANSLATION_BASE_URL: "http://buddystudy-libretranslate:5000"
  GOOGLE_IOS_CLIENT_ID: "328281669925-evuebplih3vir99daj4lapj1javqsmsr.apps.googleusercontent.com"
  MONITORING_ENVIRONMENT_NAME: "development"
  MONITORING_SERVICE_NAME: "BuddyStudy backend"
  MONITORING_ADMIN_BASE_URL: "https://api.ghkdqhrbals.org/admin"
  MONITORING_SCHEDULER_FAILURE_ALERT_REPEAT_SECONDS: "300"
  MONITORING_SCHEDULER_READINESS_ENABLED: "true"
  MONITORING_SCHEDULER_STALE_THRESHOLD_MINUTES: "15"
  MONITORING_SCHEDULER_STARTUP_GRACE_MINUTES: "15"
  MONITORING_SCHEDULER_MONITORED_JOBS: "question-schedule,question-push-outbox-dispatch,user-stats-refresh,admin-analytics-recent,admin-analytics-correction"
