apiVersion: v1
kind: ConfigMap
metadata:
  name: buddystudy-backend-config
data:
  APP_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_CLOUD_AWS_SECRETSMANAGER_ENABLED: "false"
  FLYWAY_ENABLED: "false"
  SPRING_FLYWAY_ENABLED: "false"
  FLYWAY_LOCATIONS: "filesystem:/app/db/migration"
  DATABASE_URL: "jdbc:postgresql://buddystudy-postgres:5432/buddystudy"
  DATABASE_USERNAME: "buddystudy"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://buddystudy-postgres:5432/buddystudy"
  SPRING_DATASOURCE_USERNAME: "buddystudy"
  ADMIN_ANALYTICS_DATABASE_URL: "jdbc:postgresql://buddystudy-postgres:5432/buddystudy_aggregation"
  ADMIN_ANALYTICS_DATABASE_USERNAME: "buddystudy"
  REDIS_HOST: "buddystudy-redis-0-0.buddystudy-redis-headless"
  REDIS_PORT: "6379"
  REDIS_SSL: "false"
  SPRING_DATA_REDIS_CLUSTER_NODES: "buddystudy-redis-0-0.buddystudy-redis-headless:6379,buddystudy-redis-1-0.buddystudy-redis-headless:6380,buddystudy-redis-2-0.buddystudy-redis-headless:6381"
  ENABLE_OPENAPI_DOCS: "false"
  SCHEDULER_ENABLED: "true"
  SCHEDULER_BATCH_SIZE: "50"
  MAX_PENDING_PER_STUDY: "1"
  REACTION_STREAM_ENABLED: "true"
  REACTION_STREAM_COORDINATOR_BASE_URL: "http://buddystudy-redis-stream-coordinator:8080"
  REACTION_STREAM_COORDINATOR_USERNAME: "admin"
  PUSH_STREAM_PREFIX: "push-v1"
  VIEW_STREAM_PREFIX: "view-v1"
  BUDDYSTUDY_TRANSLATION_BASE_URL: "http://buddystudy-libretranslate:5000"
  GOOGLE_IOS_CLIENT_ID: "328281669925-evuebplih3vir99daj4lapj1javqsmsr.apps.googleusercontent.com"
  MONITORING_ENVIRONMENT_NAME: "production"
  MONITORING_SERVICE_NAME: "BuddyStudy backend"
  MONITORING_ADMIN_BASE_URL: "https://api.ghkdqhrbals.org/admin"
  MONITORING_SCHEDULER_FAILURE_ALERT_REPEAT_SECONDS: "300"
  MONITORING_SCHEDULER_READINESS_ENABLED: "true"
  MONITORING_COORDINATOR_READINESS_ENABLED: "true"
  MONITORING_COORDINATOR_BASE_URL: "http://buddystudy-redis-stream-coordinator:8080"
  MONITORING_COORDINATOR_TIMEOUT_MS: "3000"
  MONITORING_SCHEDULER_STALE_THRESHOLD_MINUTES: "15"
  MONITORING_SCHEDULER_STARTUP_GRACE_MINUTES: "15"
  MONITORING_SCHEDULER_MONITORED_JOBS: "question-schedule,question-push-outbox-dispatch,user-stats-refresh,admin-analytics-recent,admin-analytics-correction"
