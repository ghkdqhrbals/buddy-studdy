                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Backend 백그라운드 오류: {{ $labels.logger }}'
          occurred_at: '{{ $labels.occurred_at }}'
