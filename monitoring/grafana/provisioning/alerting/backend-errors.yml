apiVersion: 1

contactPoints:
  - orgId: 1
    name: BuddyStudy Slack
    receivers:
      - uid: buddystudy-slack-errors
        type: slack
        disableResolveMessage: false
        settings:
          url: $GRAFANA_SLACK_WEBHOOK_URL
          username: Grafana
          icon_url: https://avatars.githubusercontent.com/u/7195757?s=200&v=4
          title: '{{ template "default.title" . }}'
          text: |-
            {{ range .Alerts.Firing }}
            *{{ .Annotations.summary }}*
            *발생 시각:* `{{ .Annotations.occurred_at }}`
            *요청 위치:* `{{ .Annotations.request_location }}`
            *코드 위치:* `{{ .Annotations.code_location }}`
            {{ .Annotations.description }}
            <{{ .Annotations.logs_url }}|Grafana에서 오류 로그 보기>
            {{ end }}
      - uid: buddystudy-codex-incident-autofix
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://buddystudy-incident-receiver:3030/internal/incidents/grafana
          httpMethod: POST
          maxAlerts: '10'
          hmacConfig:
            secret: $GRAFANA_INCIDENT_HMAC_SECRET
            header: X-Grafana-Alerting-Signature
            timestampHeader: X-Grafana-Alerting-Timestamp

groups:
  - orgId: 1
    name: Backend operational errors
    folder: BuddyStudy
    interval: 1m
    rules:
      - uid: buddystudy-backend-error-log
        title: BuddyStudy backend API ERROR log
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: buddystudy-loki
            model:
              editorMode: code
              expr: 'sum by (occurred_at, logger, method, path, origin) (count_over_time({app="buddystudy", level="ERROR"} |= "api_error" | regexp "^(?P<occurred_at>\\S+)\\s+ERROR\\s+.*---\\s+\\[[^]]+\\]\\s+(?P<logger>\\S+)\\s+:\\s+" | regexp "method=(?P<method>\\S+)\\s+path=(?P<path>\\S+).*origin=(?P<origin>\\S+)" | __error__="" [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Backend API 오류
          occurred_at: '{{ $labels.occurred_at }}'
          request_location: '{{ $labels.method }} https://api.ghkdqhrbals.org{{ $labels.path }}'
          code_location: '{{ $labels.origin }} · {{ $labels.logger }}'
          description: 'Logger: {{ $labels.logger }}. 전체 stack trace와 진단값은 하나의 Loki 이벤트 및 Sentry Issue로 수집됩니다.'
          logs_url: https://grafana.lowfidev.cloud/explore?panes=%7B%22backendErrors%22%3A%7B%22datasource%22%3A%22buddystudy-loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22uid%22%3A%22buddystudy-loki%22%2C%22type%22%3A%22loki%22%7D%2C%22editorMode%22%3A%22code%22%2C%22expr%22%3A%22%7Bapp%3D%5C%22buddystudy%5C%22%2C+level%3D%5C%22ERROR%5C%22%7D%22%2C%22queryType%22%3A%22range%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-15m%22%2C%22to%22%3A%22now%22%7D%7D%7D&schemaVersion=1&orgId=1
        labels:
          service: buddystudy-backend
          severity: error
        isPaused: false
        notification_settings:
          receiver: BuddyStudy Slack
          group_by:
            - alertname
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 30m
      - uid: buddystudy-backend-operational-error-log
        title: BuddyStudy backend operational ERROR log
        condition: C
        data:
          - refId: A
            relativeTimeRange:
