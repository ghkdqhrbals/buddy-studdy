          logs_url: https://grafana.lowfidev.cloud/explore?panes=%7B%22backendErrors%22%3A%7B%22datasource%22%3A%22buddystudy-loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22uid%22%3A%22buddystudy-loki%22%2C%22type%22%3A%22loki%22%7D%2C%22editorMode%22%3A%22code%22%2C%22expr%22%3A%22%7Bapp%3D%5C%22buddystudy%5C%22%2C+level%3D%5C%22ERROR%5C%22%7D%22%2C%22queryType%22%3A%22range%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-15m%22%2C%22to%22%3A%22now%22%7D%7D%7D&schemaVersion=1&orgId=1
        labels:
          service: buddystudy-backend
          severity: error
        isPaused: false
        notification_settings:
          receiver: BuddyStudy Slack
          group_by:
            - alertname
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 30m
