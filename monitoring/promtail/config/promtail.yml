server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml
  sync_period: 10s
  ignore_invalid_yaml: false

clients:
  - url: http://buddystudy-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: monitoring-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: monitoring-access
          service: buddystudy-monitoring
          __path__: /var/log/monitoring/monitoring-access.log
    pipeline_stages:
      - json:
          expressions:
            event: event
      - labels:
          event:

  - job_name: monitoring-gateway-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: monitoring-gateway-error
          service: buddystudy-monitoring
          __path__: /var/log/monitoring/monitoring-error.log
