services:
  api-dashboard:
    image: nginx:1.27-alpine
    container_name: buddystudy-api-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    environment:
      API_DASHBOARD_BASIC_AUTH_HTPASSWD: ${API_DASHBOARD_BASIC_AUTH_HTPASSWD:?set API_DASHBOARD_BASIC_AUTH_HTPASSWD}
    command: >
      /bin/sh -c 'printf "%s\n" "$$API_DASHBOARD_BASIC_AUTH_HTPASSWD" > /etc/nginx/.htpasswd
      && nginx -g "daemon off;"'
    volumes:
      - ./api-dashboard/public:/usr/share/nginx/html:ro
      - ./api-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - loki
      - testzone-service
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.3.2
    container_name: buddystudy-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ${HOME}/buddystudy/monitoring/loki/data:/loki
      - ./loki/config/loki.yml:/etc/loki/local-config.yaml:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.3.0
    container_name: buddystudy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.lowfidev.cloud/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_LIVE_ALLOWED_ORIGINS: https://grafana.lowfidev.cloud
      TESTZONE_INFLUX_ORG: ${TESTZONE_INFLUX_ORG:-buddystudy}
      TESTZONE_INFLUX_BUCKET: ${TESTZONE_INFLUX_BUCKET:-testzone}
      TESTZONE_INFLUX_TOKEN: ${TESTZONE_INFLUX_TOKEN:?set TESTZONE_INFLUX_TOKEN}
    volumes:
      - ${HOME}/buddystudy/monitoring/grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - testzone-influxdb
    networks:
      - monitoring

  grafana-gateway:
    image: nginx:1.27-alpine
    container_name: buddystudy-grafana-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./grafana-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
    networks:
      - monitoring

  testzone-influxdb:
    image: influxdb:2.7-alpine
    container_name: buddystudy-testzone-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${TESTZONE_INFLUX_USERNAME:-testzone}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${TESTZONE_INFLUX_PASSWORD:?set TESTZONE_INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${TESTZONE_INFLUX_ORG:-buddystudy}
      DOCKER_INFLUXDB_INIT_BUCKET: ${TESTZONE_INFLUX_BUCKET:-testzone}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${TESTZONE_INFLUX_TOKEN:?set TESTZONE_INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: ${TESTZONE_INFLUX_RETENTION:-30d}
    volumes:
      - ${HOME}/buddystudy/monitoring/testzone/influxdb:/var/lib/influxdb2
    networks:
      - monitoring

  testzone-service:
    build:
      context: ./testzone-service
    image: buddystudy-testzone-service:local
    container_name: buddystudy-testzone-service
    restart: unless-stopped
    environment:
      TESTZONE_PORT: "3020"
      TESTZONE_DATA_DIR: /data
      TESTZONE_MAX_VUS: "1000"
      TESTZONE_MAX_TARGET_RPS: "3000"
      TESTZONE_MAX_DURATION_SECONDS: "3600"
      TESTZONE_MAX_CONCURRENT_RUNS: "1"
      TESTZONE_GRAFANA_URL: https://grafana.lowfidev.cloud/
      TESTZONE_INFLUX_URL: http://buddystudy-testzone-influxdb:8086
      TESTZONE_INFLUX_ORG: ${TESTZONE_INFLUX_ORG:-buddystudy}
      TESTZONE_INFLUX_BUCKET: ${TESTZONE_INFLUX_BUCKET:-testzone}
      TESTZONE_INFLUX_TOKEN: ${TESTZONE_INFLUX_TOKEN:?set TESTZONE_INFLUX_TOKEN}
      TESTZONE_COMPONENT_PASSWORD: ${TESTZONE_COMPONENT_PASSWORD:?set TESTZONE_COMPONENT_PASSWORD}
    volumes:
      - ${HOME}/buddystudy/monitoring/testzone/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - testzone-influxdb
    networks:
      - monitoring
      - testzone

networks:
  monitoring:
    name: buddystudy-monitoring-stack
  testzone:
    name: buddystudy-testzone
