x-bounded-local-logging: &bounded-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  incident-receiver:
    image: node:22-alpine
    container_name: buddystudy-incident-receiver
    restart: unless-stopped
    command:
      - node
      - /app/src/server.mjs
    environment:
      INCIDENT_RECEIVER_PORT: "3030"
      INCIDENT_DATA_DIR: /data
      GRAFANA_INCIDENT_HMAC_SECRET: ${GRAFANA_INCIDENT_HMAC_SECRET:?set GRAFANA_INCIDENT_HMAC_SECRET}
      CODEX_AUTOFIX_GITHUB_TOKEN: ${CODEX_AUTOFIX_GITHUB_TOKEN:?set CODEX_AUTOFIX_GITHUB_TOKEN}
      GITHUB_AUTOFIX_REPOSITORY: ${GITHUB_AUTOFIX_REPOSITORY:-ghkdqhrbals/buddy-studdy}
      GITHUB_AUTOFIX_EVENT_TYPE: codex-incident-autofix
      LOKI_BASE_URL: http://buddystudy-loki:3100
      DEPLOYMENT_HISTORY_URL: http://buddystudy-testzone-service:3020
    volumes:
      - ./incident-receiver/src:/app/src:ro
      - ${HOME}/buddystudy/monitoring/incident-receiver/data:/data
    depends_on:
      - loki
      - testzone-service
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-local-logging
    networks:
      - monitoring

  api-dashboard:
    image: nginx:1.27-alpine
    container_name: buddystudy-api-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./api-dashboard/public:/usr/share/nginx/html:ro
      - ./api-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOME}/buddystudy/monitoring/api-dashboard/logs:/var/log/nginx
    depends_on:
      - loki
      - testzone-service
    logging: *bounded-local-logging
    networks:
      - monitoring

  monitoring-log-rotator:
    image: alpine:3.21
    container_name: buddystudy-monitoring-log-rotator
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/monitoring/rotate-gateway-logs.sh
    environment:
      LOG_DIRECTORY: /var/log/nginx
      ACCESS_LOG_ROTATE_BYTES: "8388608"
      ERROR_LOG_ROTATE_BYTES: "2097152"
      ROTATED_LOG_COUNT: "3"
      LOG_ROTATE_CHECK_INTERVAL_SECONDS: "30"
      LOG_ROTATE_STARTUP_GRACE_SECONDS: "60"
      NGINX_MASTER_PID: "1"
    volumes:
      - ./log-retention/rotate-gateway-logs.sh:/opt/monitoring/rotate-gateway-logs.sh:ro
      - ${HOME}/buddystudy/monitoring/api-dashboard/logs:/var/log/nginx
    depends_on:
      - api-dashboard
      - monitoring-promtail
    network_mode: none
    pid: "service:api-dashboard"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-local-logging

  monitoring-promtail:
    image: grafana/promtail:3.3.2
    container_name: buddystudy-monitoring-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config/promtail.yml:/etc/promtail/config.yml:ro
      - ${HOME}/buddystudy/monitoring/api-dashboard/logs:/var/log/monitoring:ro
      - ${HOME}/buddystudy/monitoring/promtail/data:/var/lib/promtail
    depends_on:
      - api-dashboard
      - loki
    logging: *bounded-local-logging
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.3.2
    container_name: buddystudy-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ${HOME}/buddystudy/monitoring/loki/data:/loki
      - ./loki/config/loki.yml:/etc/loki/local-config.yaml:ro
    logging: *bounded-local-logging
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.3.0
    container_name: buddystudy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.lowfidev.cloud/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_LIVE_ALLOWED_ORIGINS: https://grafana.lowfidev.cloud
      TESTZONE_INFLUX_ORG: ${TESTZONE_INFLUX_ORG:-buddystudy}
      TESTZONE_INFLUX_BUCKET: ${TESTZONE_INFLUX_BUCKET:-testzone}
      TESTZONE_INFLUX_TOKEN: ${TESTZONE_INFLUX_TOKEN:?set TESTZONE_INFLUX_TOKEN}
      GRAFANA_SLACK_WEBHOOK_URL: ${GRAFANA_SLACK_WEBHOOK_URL:-${SLACK_WEBHOOK_URL:-}}
      GRAFANA_INCIDENT_HMAC_SECRET: ${GRAFANA_INCIDENT_HMAC_SECRET:?set GRAFANA_INCIDENT_HMAC_SECRET}
    volumes:
      - ${HOME}/buddystudy/monitoring/grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - incident-receiver
      - loki
      - testzone-influxdb
    logging: *bounded-local-logging
    networks:
      - monitoring

  grafana-gateway:
    image: nginx:1.27-alpine
    container_name: buddystudy-grafana-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./grafana-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
    logging: *bounded-local-logging
    networks:
      - monitoring

  testzone-influxdb:
    image: influxdb:2.7-alpine
    container_name: buddystudy-testzone-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${TESTZONE_INFLUX_USERNAME:-testzone}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${TESTZONE_INFLUX_PASSWORD:?set TESTZONE_INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${TESTZONE_INFLUX_ORG:-buddystudy}
      DOCKER_INFLUXDB_INIT_BUCKET: ${TESTZONE_INFLUX_BUCKET:-testzone}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${TESTZONE_INFLUX_TOKEN:?set TESTZONE_INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: ${TESTZONE_INFLUX_RETENTION:-30d}
    volumes:
      - ${HOME}/buddystudy/monitoring/testzone/influxdb:/var/lib/influxdb2
    logging: *bounded-local-logging
    networks:
      - monitoring

  testzone-service:
    build:
      context: ./testzone-service
    image: buddystudy-testzone-service:local
    container_name: buddystudy-testzone-service
    restart: unless-stopped
    environment:
      TESTZONE_PORT: "3020"
      TESTZONE_DATA_DIR: /data
      TESTZONE_MAX_VUS: "1000"
      TESTZONE_MAX_TARGET_RPS: "3000"
      TESTZONE_MAX_DURATION_SECONDS: "3600"
      TESTZONE_MAX_CONCURRENT_RUNS: "1"
      TESTZONE_GRAFANA_URL: https://grafana.lowfidev.cloud/
      TESTZONE_INFLUX_URL: http://buddystudy-testzone-influxdb:8086
      TESTZONE_INFLUX_ORG: ${TESTZONE_INFLUX_ORG:-buddystudy}
      TESTZONE_INFLUX_BUCKET: ${TESTZONE_INFLUX_BUCKET:-testzone}
      TESTZONE_INFLUX_TOKEN: ${TESTZONE_INFLUX_TOKEN:?set TESTZONE_INFLUX_TOKEN}
      TESTZONE_COMPONENT_PASSWORD: ${TESTZONE_COMPONENT_PASSWORD:?set TESTZONE_COMPONENT_PASSWORD}
    volumes:
      - ${HOME}/buddystudy/monitoring/testzone/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - testzone-influxdb
    logging: *bounded-local-logging
    networks:
      - monitoring
      - testzone

networks:
  monitoring:
    name: buddystudy-monitoring-stack
  testzone:
    name: buddystudy-testzone
