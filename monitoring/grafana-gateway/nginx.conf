server {
  listen 80;
  server_name _;
  # Custom dashboards moved to the dedicated monitoring origin.
  location = /system.html {
    return 308 https://monitoring.lowfidev.cloud/system.html$is_args$args;
  }

  location = /performance.html {
    return 308 https://monitoring.lowfidev.cloud/performance.html$is_args$args;
  }

  location = /testzone.html {
    return 308 https://monitoring.lowfidev.cloud/testzone.html$is_args$args;
  }

  location /api/live/ {
    proxy_pass http://buddystudy-grafana:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_set_header Host grafana.lowfidev.cloud;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host grafana.lowfidev.cloud;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://buddystudy-grafana:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_set_header Host grafana.lowfidev.cloud;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host grafana.lowfidev.cloud;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
  }
}
