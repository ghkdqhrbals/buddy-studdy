<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuddyStudy API Logs</title>
    <link rel="stylesheet" href="/styles.css?v=2026070712" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="side-nav" aria-label="Monitoring navigation">
        <div class="side-nav-brand">
          <span>BuddyStudy</span>
          <strong>Monitoring</strong>
        </div>
        <nav>
          <a href="/" aria-current="page">API Logs</a>
          <a href="/performance.html">API Performance</a>
        </nav>
      </aside>

      <div class="content-shell">
        <header class="topbar">
          <div>
            <h1>API Logs</h1>
            <p>BuddyStudy request traces, payloads, and related backend logs</p>
          </div>
        </header>

      <section class="filters log-filters" aria-label="Log filters">
        <div class="time-range-filter">
          <label>
            Time range
            <select id="rangeSelect">
              <option value="300000">Last 5 minutes</option>
              <option value="900000">Last 15 minutes</option>
              <option value="3600000" selected>Last 1 hour</option>
              <option value="21600000">Last 6 hours</option>
              <option value="86400000">Last 24 hours</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <div id="customRangeFields" class="custom-range-fields">
            <fieldset>
              <legend>From</legend>
              <input id="customStartDateInput" type="date" />
              <input id="customStartTimeInput" type="time" step="1" />
            </fieldset>
            <fieldset>
              <legend>To</legend>
              <input id="customEndDateInput" type="date" />
              <input id="customEndTimeInput" type="time" step="1" />
            </fieldset>
            <button id="applyCustomRangeButton" type="button">Apply</button>
          </div>
        </div>
        <label>
          Method
          <select id="methodSelect">
            <option value="">All</option>
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
          </select>
        </label>
        <label>
          Status
          <select id="statusSelect">
            <option value="">All</option>
            <option value="2">2xx</option>
            <option value="3">3xx</option>
            <option value="4">4xx</option>
            <option value="5">5xx</option>
          </select>
        </label>
        <label class="path-filter">
          Path search
          <input id="pathInput" type="search" placeholder="/api/v1/devices/register" autocomplete="off" />
        </label>
        <label class="path-filter">
          Request ID
          <input id="requestIdInput" type="search" placeholder="trace id" autocomplete="off" />
        </label>
        <label class="path-filter log-search-filter">
          Log search
          <input id="logSearchInput" type="search" placeholder="error text, user id, class name" autocomplete="off" />
        </label>
        <button id="refreshButton" type="button">Search</button>
      </section>

      <section class="timeline-panel" aria-label="API request timeline">
        <div class="timeline-header">
          <div>
            <h2>Timeline</h2>
            <p id="timelineRangeLabel">Drag on the graph to select a time range.</p>
          </div>
          <div class="timeline-actions">
            <span id="timelineCountLabel">Requests -</span>
            <button id="resetTimelineButton" type="button" disabled>Reset range</button>
          </div>
        </div>
        <div class="timeline-canvas-wrap">
          <canvas id="timelineCanvas" height="150"></canvas>
          <div id="timelineSelection" class="timeline-selection" hidden></div>
        </div>
      </section>

      <main class="panel">
        <div class="panel-header">
          <div>
            <h2>Requests</h2>
            <p id="rangeLabel">Loading...</p>
          </div>
          <div class="panel-actions">
            <div class="pager-shell">
              <label class="page-size-control">
                <span>Rows</span>
                <select id="pageSizeSelect">
                  <option value="50">50</option>
                  <option value="100" selected>100</option>
                  <option value="200">200</option>
                </select>
              </label>
              <div class="pagination-controls" aria-label="Request pages">
                <button id="prevPageButton" type="button" disabled>Prev</button>
                <span id="pageInfo">Page 1</span>
                <button id="nextPageButton" type="button" disabled>Next</button>
              </div>
            </div>
            <div id="statusMessage" class="status-message">Ready</div>
          </div>
        </div>

        <div class="request-table" role="table" aria-label="API request logs">
          <div class="request-row table-head" role="row">
            <div role="columnheader">
              <button id="timeSortButton" class="time-sort-button" type="button">Time ↓</button>
            </div>
            <div role="columnheader">Method</div>
            <div role="columnheader">Path</div>
            <div role="columnheader">Status</div>
            <div role="columnheader">Duration</div>
            <div role="columnheader">Client IP</div>
            <div role="columnheader">Request ID</div>
          </div>
          <div id="requestRows" class="request-rows"></div>
        </div>
      </main>
      </div>
    </div>

    <template id="emptyTemplate">
      <div class="empty-state">
        <h3>No API requests</h3>
        <p>Try widening the time range or clearing filters.</p>
      </div>
    </template>

    <script type="module" src="/app.js?v=2026070711"></script>
  </body>
</html>
