<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuddyStudy TestZone</title>
    <script src="/nav-bootstrap.js?v=2026072704"></script>
    <link rel="stylesheet" href="/styles.css?v=2026072602" />
    <link rel="stylesheet" href="/react/manage.css?v=2026072902" />
    <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css?v=1.6.32" />
    <link rel="stylesheet" href="/testzone.css?v=2026072512" />
  </head>
  <body>
    <div id="monitoring-react-root"></div>
    <template id="testzone-page-template">
    <div class="app-shell testzone-shell">
      <aside class="side-nav" aria-label="Monitoring navigation"></aside>

      <div class="content-shell testzone-content">
        <header class="testzone-header">
          <div>
            <span class="testzone-eyebrow">Performance workspace</span>
            <h1>TestZone</h1>
            <p>스크립트 작성부터 실행, 결과 분석까지 한 곳에서 관리합니다.</p>
          </div>
          <div class="header-actions">
            <span id="serviceStatus" class="service-status" data-state="loading">연결 확인 중</span>
          </div>
        </header>

        <div class="workspace-bar">
          <div class="workspace-project">
            <label>
              <span>Project</span>
              <select id="projectSelect" aria-label="Project"></select>
            </label>
            <div class="workspace-project-actions">
              <button id="newProjectButton" class="button button-secondary" type="button">New project</button>
              <button id="deleteProjectButton" class="button button-secondary danger-text" type="button">Delete</button>
            </div>
          </div>
        </div>

        <nav class="testzone-tabs" aria-label="TestZone sections">
          <button type="button" data-tab="overview" aria-selected="true">History</button>
          <button type="button" data-tab="scripts" aria-selected="false">Scripts</button>
          <button type="button" data-tab="components" aria-selected="false">Components</button>
        </nav>

        <main class="testzone-workspace">
          <section id="overviewPanel" class="tab-panel" data-panel="overview">
            <section class="workspace-section runs-section">
              <header>
                <div>
                  <h2>Run history</h2>
                  <p id="runCount">0 runs</p>
                </div>
                <div class="run-refresh-control">
                  <span id="runAutoRefreshStatus" class="run-auto-refresh-status">Manual</span>
                  <button id="refreshRunsButton" class="icon-button" type="button" title="Refresh runs" aria-label="Refresh runs">↻</button>
                </div>
              </header>
              <div class="table-wrap">
                <table class="testzone-table">
                  <colgroup>
                    <col class="run-column-started" />
                    <col class="run-column-name" />
                    <col class="run-column-script" />
                    <col class="run-column-plan" />
                    <col class="run-column-status" />
                    <col class="run-column-metric" />
                    <col class="run-column-metric" />
                    <col class="run-column-metric" />
                    <col class="run-column-actions" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>Started</th>
                      <th>Test name</th>
                      <th>Script</th>
                      <th>Load plan</th>
                      <th>Status</th>
                      <th>RPS</th>
                      <th>p95</th>
                      <th>Error</th>
                      <th class="actions-column">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="runRows"></tbody>
                </table>
                <div id="runEmptyState" class="empty-state" hidden>
                  <strong>아직 실행 기록이 없습니다.</strong>
                  <span>스크립트를 선택하고 첫 성능 테스트를 실행하세요.</span>
                </div>
              </div>
              <footer id="runPagination" class="run-pagination" hidden>
                <strong id="runPaginationTotal">0 total</strong>
                <nav aria-label="Run history pages">
                  <button id="runPreviousPageButton" class="page-control" type="button" aria-label="Previous page">‹</button>
                  <div id="runPageNumbers" class="run-page-numbers"></div>
                  <button id="runNextPageButton" class="page-control" type="button" aria-label="Next page">›</button>
                </nav>
              </footer>
            </section>
            <section id="runDetail" class="workspace-section run-detail" hidden>
              <header>
                <div>
                  <h3 id="runDetailTitle">Run details</h3>
                  <p id="runDetailMeta"></p>
                </div>
                <div class="run-detail-actions">
                  <button id="rerunSelectedRunButton" class="row-action" type="button">Rerun</button>
                  <button id="closeRunDetailButton" class="icon-button" type="button" aria-label="Close run details">×</button>
                </div>
              </header>
              <div class="run-detail-grid">
                <div><span>Target</span><strong id="runDetailTarget">-</strong></div>
                <div><span>Scenarios</span><strong id="runDetailScenarioCount">-</strong></div>
                <div><span>Duration</span><strong id="runDetailDuration">-</strong></div>
                <div><span>Script</span><button id="runDetailScriptButton" class="text-link" type="button">-</button></div>
                <div><span>Status</span><strong id="runDetailStatus">-</strong></div>
              </div>
              <section class="run-scenario-plan" aria-labelledby="runScenarioPlanTitle">
                <header>
                  <div>
                    <h4 id="runScenarioPlanTitle">Scenario plan</h4>
                    <p>스크립트에 정의된 실행 함수, 처리율, VU 용량을 시나리오별로 표시합니다.</p>
                  </div>
                </header>
                <div class="run-scenario-table-wrap">
                  <table class="run-scenario-table">
                    <thead>
                      <tr>
                        <th>Scenario</th>
                        <th>Executor</th>
                        <th>Function</th>
                        <th>Schedule</th>
                        <th>Target RPS</th>
                        <th>VUsers</th>
                      </tr>
                    </thead>
                    <tbody id="runScenarioRows"></tbody>
                  </table>
                </div>
              </section>
              <nav id="runScenarioFilter" class="run-scenario-filter" aria-label="Run scenario metric filter"></nav>
              <div class="run-outcome-summary run-scenario-summary" aria-label="Selected scenario statistics">
                <article><span>Actual RPS</span><strong id="detailTps">-</strong></article>
                <article><span>Peak p95</span><strong id="detailP95">-</strong></article>
                <article><span>Error rate</span><strong id="detailErrorRate">-</strong></article>
                <article><span>Peak VUs</span><strong id="detailVus">-</strong></article>
                <article><span>Dropped</span><strong id="detailDropped">-</strong></article>
              </div>
              <section class="run-detail-timeline" aria-labelledby="runDetailTimelineTitle">
                <header>
                  <div>
                    <h4 id="runDetailTimelineTitle">Run time-series</h4>
                    <p id="runDetailTimelineDescription">All scenarios의 초 단위 처리량과 응답시간을 확인합니다.</p>
                  </div>
                </header>
                <div class="run-metric-grid">
                  <section class="run-metric-card">
                    <header>
                      <div>
                        <h4 id="runOutcomeChartTitle">Throughput by scenario</h4>
                        <span id="runOutcomeChartSubtitle">total / scenario request rate</span>
                      </div>
                    </header>
                    <div id="runOutcomeChartLegend" class="run-chart-legend"></div>
                    <div class="run-chart-wrap">
                      <div
                        id="runDetailOutcomeChart"
                        class="run-history-chart"
                        role="img"
                        aria-label="Selected run HTTP success and error counts per second."
                      ></div>
                    </div>
                  </section>
                  <section class="run-metric-card">
                    <header>
                      <div>
                        <h4 id="runLatencyChartTitle">p95 latency by scenario</h4>
                        <span id="runLatencyChartSubtitle">scenario p95</span>
                      </div>
                    </header>
                    <div id="runLatencyChartLegend" class="run-chart-legend"></div>
                    <div class="run-chart-wrap">
                      <div
                        id="runDetailLatencyChart"
                        class="run-history-chart"
                        role="img"
                        aria-label="Selected run average, p90, and p95 response time chart."
                      ></div>
                    </div>
                  </section>
                </div>
                <div id="runDetailChartEmpty" class="chart-empty" hidden>
                  <strong>No time-series data</strong>
                  <span>이 실행에서 수집된 초 단위 지표가 없습니다.</span>
                </div>
              </section>
              <pre id="runLogTail" class="run-log-tail" aria-label="Run log output"></pre>
            </section>
          </section>

          <section id="scriptsPanel" class="tab-panel" data-panel="scripts" hidden>
            <div class="ide-shell">
              <aside class="file-pane">
                <header>
                  <div>
                    <span>Project files</span>
                    <strong>k6 scripts</strong>
                  </div>
                  <button id="newScriptButton" class="icon-button" type="button" title="New script" aria-label="New script">+</button>
                </header>
                <div id="scriptList" class="script-list"></div>
              </aside>

              <section class="editor-pane">
                <header class="editor-toolbar">
                  <div class="editor-file">
                    <span id="editorDirtyMark" aria-hidden="true"></span>
                    <input id="scriptNameInput" aria-label="Script file name" />
                  </div>
                  <div class="editor-actions">
                    <span id="editorFeedback" class="inline-feedback" role="status"></span>
                    <button id="toggleFilesButton" class="button button-secondary" type="button">Files</button>
                    <button id="focusEditorButton" class="button button-secondary" type="button">Focus</button>
                    <button id="validateScriptButton" class="button button-secondary" type="button">Validate</button>
                    <button id="saveScriptButton" class="button button-secondary" type="button">Save</button>
                    <button id="editorRunButton" class="button button-primary" type="button">Run</button>
                    <button id="deleteScriptButton" class="icon-button danger" type="button" title="Delete script" aria-label="Delete script">×</button>
                  </div>
                </header>
                <section
                  id="editorProblemPanel"
                  class="editor-problem-panel"
                  role="alert"
                  aria-live="assertive"
                  tabindex="-1"
                  hidden
                >
                  <div class="editor-problem-heading">
                    <span class="editor-problem-icon" aria-hidden="true">!</span>
                    <div>
                      <strong id="editorProblemTitle">Save failed</strong>
                      <span id="editorProblemMessage">Changes were not saved.</span>
                    </div>
                  </div>
                  <div id="lintPanel" class="lint-panel"></div>
                </section>
                <div class="code-editor">
                  <div id="editorLineNumbers" class="line-numbers" aria-hidden="true"></div>
                  <pre id="scriptHighlight" class="script-highlight" aria-hidden="true"></pre>
                  <textarea id="scriptEditor" aria-label="k6 JavaScript editor" spellcheck="false" wrap="off"></textarea>
                </div>
                <footer class="editor-statusbar">
                  <span>JavaScript · k6</span>
                  <span id="editorPosition">Ln 1, Col 1</span>
                  <span>⌘S 저장 · Tab 들여쓰기</span>
                </footer>
              </section>
            </div>
          </section>

          <section id="componentsPanel" class="tab-panel" data-panel="components" hidden>
            <div class="overview-heading">
              <div>
                <h2>Test components</h2>
                <p>승인된 테스트 전용 데이터 컴포넌트만 격리된 Docker 네트워크에 배포합니다.</p>
              </div>
              <button id="refreshComponentsButton" class="button button-secondary" type="button">Refresh</button>
            </div>
            <section class="component-notice">
              <strong>테스트 데이터는 운영과 분리됩니다.</strong>
              <span>Reset과 Return은 테스트 볼륨의 데이터를 삭제합니다. 운영 서버와 운영 데이터에는 접근하지 않습니다.</span>
            </section>
            <div id="componentGrid" class="component-grid"></div>
          </section>
        </main>
      </div>
    </div>

    <dialog id="scriptSnapshotDialog" class="testzone-dialog script-snapshot-dialog">
      <form>
        <header>
          <div><span>Run artifact</span><h2 id="scriptSnapshotTitle">Script snapshot</h2></div>
          <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </header>
        <pre id="scriptSnapshotCode" class="snapshot-code"></pre>
      </form>
    </dialog>

    <dialog id="newProjectDialog" class="testzone-dialog compact-dialog">
      <form id="newProjectForm">
        <header>
          <div><span>Test workspace</span><h2>New project</h2></div>
          <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </header>
        <div class="dialog-body">
          <label>Project name<input id="newProjectName" maxlength="120" autocomplete="off" required /></label>
        </div>
        <footer>
          <button class="button button-secondary" type="button" data-close-dialog>Cancel</button>
          <button id="createProjectButton" class="button button-primary" type="submit">Create project</button>
        </footer>
      </form>
    </dialog>

    <dialog id="runPageJumpDialog" class="testzone-dialog compact-dialog page-jump-dialog">
      <form id="runPageJumpForm">
        <header>
          <div><span>Run history</span><h2 id="runPageJumpTitle">Choose a page</h2></div>
          <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </header>
        <div class="dialog-body">
          <label>Page<select id="runPageJumpSelect" aria-label="Run history page"></select></label>
        </div>
        <footer>
          <button class="button button-secondary" type="button" data-close-dialog>Cancel</button>
          <button class="button button-primary" type="submit">Go to page</button>
        </footer>
      </form>
    </dialog>

    <dialog id="componentConfigDialog" class="testzone-dialog compact-dialog">
      <form id="componentConfigForm">
        <header>
          <div><span>Runtime parameters</span><h2 id="componentConfigTitle">Configure component</h2></div>
          <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </header>
        <div id="componentConfigFields" class="dialog-body"></div>
        <footer>
          <button class="button button-secondary" type="button" data-close-dialog>Cancel</button>
          <button class="button button-primary" type="submit">Save parameters</button>
        </footer>
      </form>
    </dialog>

    <dialog id="componentCredentialsDialog" class="testzone-dialog compact-dialog">
      <form>
        <header>
          <div><span>Private connection values</span><h2 id="componentCredentialsTitle">Credentials</h2></div>
          <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </header>
        <div id="componentCredentialsBody" class="dialog-body credential-list"></div>
      </form>
    </dialog>

    <dialog id="confirmDialog" class="testzone-dialog compact-dialog">
      <form id="confirmForm">
        <header><div><span>Confirm action</span><h2 id="confirmTitle">Delete item?</h2></div></header>
        <div class="dialog-body"><p id="confirmMessage"></p></div>
        <footer>
          <button class="button button-secondary" type="button" data-close-dialog>Cancel</button>
          <button id="confirmActionButton" class="button button-danger" type="submit">Delete</button>
        </footer>
      </form>
    </dialog>

    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    </template>
    <script src="/vendor/uplot/uPlot.iife.min.js?v=1.6.32"></script>
    <script type="module" src="/react/manage.js?v=2026072902"></script>
  </body>
</html>
