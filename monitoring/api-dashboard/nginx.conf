server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=30s ipv6=off;

  auth_basic "BuddyStudy Monitoring";
  auth_basic_user_file /etc/nginx/.htpasswd;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /testzone/api/ {
    set $testzone http://buddystudy-testzone-service:3020;
    rewrite ^/testzone/api/(.*)$ /api/$1 break;
    proxy_pass $testzone;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /loki/ {
    set $loki http://buddystudy-loki:3100;
    proxy_pass $loki;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /grafana/ {
    return 302 https://grafana.lowfidev.cloud$request_uri;
  }

  location = /grafana {
    return 302 https://grafana.lowfidev.cloud/;
  }
}
