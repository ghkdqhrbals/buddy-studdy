map $http_x_forwarded_proto $public_forwarded_proto {
  default $http_x_forwarded_proto;
  "" https;
}

map $http_cf_connecting_ip $monitoring_forwarded_client_ip {
  default $http_cf_connecting_ip;
  "" $http_x_forwarded_for;
}

map $monitoring_forwarded_client_ip $monitoring_client_ip {
  default $monitoring_forwarded_client_ip;
  "" $remote_addr;
}

map "$status:$request_method:$uri" $monitoring_audit_enabled {
  default 0;
  ~^(401|403): 1;
  ~^[0-9][0-9][0-9]:GET:/$ 1;
  ~^[0-9][0-9][0-9]:GET:/(index|performance|system|testzone|audit|settings|users|streams)\.html$ 1;
  ~^[0-9][0-9][0-9]:(POST|PUT|PATCH|DELETE):/testzone/api/ 1;
  ~^[0-9][0-9][0-9]:(POST|PUT|PATCH|DELETE):/backend/api/ 1;
}

log_format monitoring_access escape=json
  '{"event":"monitoring_access",'
  '"time":"$time_iso8601",'
  '"requestId":"$request_id",'
  '"clientIp":"$monitoring_client_ip",'
  '"forwardedFor":"$http_x_forwarded_for",'
  '"user":"$remote_user",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"query":"$args",'
  '"status":$status,'
  '"durationSeconds":$request_time,'
  '"userAgent":"$http_user_agent",'
  '"referer":"$http_referer"}';

server {
  listen 80;
  server_name monitoring.lowfidev.cloud _;
  resolver 127.0.0.11 valid=30s ipv6=off;

  auth_basic "BuddyStudy Monitoring";
  auth_basic_user_file /etc/nginx/.htpasswd;

  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/monitoring-access.log monitoring_access if=$monitoring_audit_enabled;

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /testzone/api/ {
    set $testzone http://buddystudy-testzone-service:3020;
    rewrite ^/testzone/api/(.*)$ /api/$1 break;
    proxy_pass $testzone;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
  }

  # The browser Basic Auth credential and the backend admin bearer token both
  # use Authorization. Let the backend own authentication for this narrow API
  # prefix so bearer requests do not trigger an endless Basic Auth challenge.
  location ^~ /backend/api/v1/admin/ {
    auth_basic off;
    proxy_pass https://api.ghkdqhrbals.org/api/v1/admin/;
    proxy_ssl_server_name on;
    proxy_ssl_name api.ghkdqhrbals.org;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host api.ghkdqhrbals.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    proxy_set_header Authorization $http_authorization;
  }

  location /loki/ {
    set $loki http://buddystudy-loki:3100;
    proxy_pass $loki;
    proxy_http_version 1.1;
    # Cloudflare may decode the upstream gzip body while preserving its
    # Content-Encoding header. Request plain JSON from Loki to prevent
    # ERR_CONTENT_DECODING_FAILED in browser fetch requests.
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
  }

  location ^~ /grafana/ {
    return 302 https://grafana.lowfidev.cloud$request_uri;
  }

  location = /grafana {
    return 302 https://grafana.lowfidev.cloud/;
  }
}
