server {
  listen 80;
  server_name localhost;
  resolver 127.0.0.11 valid=30s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
  # Local logs only; this gateway publishes exclusively on host loopback.
  location /loki/ {
    limit_except GET { deny all; }
    set $loki http://loki:3100;
    proxy_pass $loki;
    proxy_set_header Accept-Encoding "";
  }
  # Administrator mutations still require real backend authorization.
  location /backend/ {
    set $backend http://backend:8080;
    rewrite ^/backend(/.*)$ $1 break;
    proxy_pass $backend;
    proxy_set_header Authorization $http_authorization;
  }
  location /testzone/ { return 503; }
  location /grafana/ { return 503; }
}
